        `ANTHROPIC_API_KEY` is set (billing is on the Anthropic account).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  role_allowed: { type: boolean }
                  configured: { type: boolean }
        "403":
          description: Affiliate role denied

  /admin/ai/chat:
    post:
      tags: [Admin]
      summary: Admin AI Ask chat turn
      description: |
        Requires `ADMIN_AI_ENABLED=1` and role `super_admin` or `admin`.
        Uses Anthropic Messages with curated tools (read + guided writes):
        `search_clients`, `search_referrers`, `get_case`, `pipeline_summary`, `list_progress_reports`,
        `get_progress_report`, `search_work_tasks`, `get_client`,
        `list_case_documents`, `list_payments`, `list_installments`,
        `list_clients_owing`, `list_round_schedule`, plus write tools
        `create_prospect`, `create_work_task`, `add_case_note`, `upload_case_document`, `send_email`,
        `send_sms`, `send_text`, `list_sms`, `get_texts`, `get_conversation`, `list_ofg_phone_numbers`,
        `update_pipeline_stage`, `preview_convert_prospect`, `convert_prospect`
        (unconverted leads without an enrolled case), `update_client_status`
        (MCP blocks pending_payment/onboarding/active until enrolled),
        `upsert_progress_report`, `upsert_payment_splits`, `update_payment_split`
        (dry-run then confirm=true; `create_work_task` is OFG-only unless
        `push_hubspot=true`; `send_email` emails a client or a referrer
        (realtor/LO) + logs a note; `send_sms`/`send_text` texts via Twilio OFG number into
        Conversations + case note and returns message/SID/status for HubSpot; inbound SMS
        auto-logs to the client file; `list_ofg_phone_numbers` lists active OFG numbers).
        Audits every turn to `admin_ai_audit_logs`. `admin` role is rate-limited (~30/hour);
        `super_admin` is not. Tool loop is capped (4 rounds / ~50s wall) to
        fit the API `maxDuration` (60s).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                context:
                  type: object
                  properties:
                    case_id: { type: integer, nullable: true }
                    case_number: { type: string, nullable: true }
                    client_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        href: { type: string }
                        label: { type: string }
                  tools_used:
                    type: array
                    items: { type: string }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      input_tokens: { type: integer }
                      output_tokens: { type: integer }
        "400":
          description: Invalid messages
        "403":
          description: Role not allowed / affiliate denied
        "404":
          description: Feature flag off
        "429":
          description: Rate limited (admin role)
        "502":
          description: AI provider error (`ai_provider_error`)
        "503":
          description: |
            Ask unavailable — `ai_not_provisioned` (missing key), `ai_billing`
            (Anthropic credits), or `ai_model_config` (retired/invalid model ID)

