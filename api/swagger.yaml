  /admin/funding:
    get:
      tags: [Funding]
      summary: List funding applications (admin board)
      description: |
        Paginated Kanban board — first page per status column (limit default 20).
        Pass `column` + `offset` to load more within one column. Requires super_admin or admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Name, email, phone, LLC, or application id
        - name: q
          in: query
          schema: { type: string }
          description: Alias for search (legacy)
        - name: funding_type
          in: query
          schema:
            type: string
            enum: [credit_card_stacking, bank_statements]
        - name: language
          in: query
          schema:
            type: string
            enum: [en, es]
        - name: status
          in: query
          schema: { type: string }
          description: Optional single-status filter (legacy)
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: column
          in: query
          schema:
            type: string
            enum: [awaiting_docs, submitted, under_review, complete, converted]
          description: When set with offset, returns load-more payload for that column only
      responses:
        "200":
          description: Board (all columns) or single-column page when column is set
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      limit: { type: integer }
                      applications:
                        type: array
                        items:
                          $ref: "#/components/schemas/FundingApplication"
                      columns:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            items:
                              type: array
                              items:
                                $ref: "#/components/schemas/FundingApplication"
                            total: { type: integer }
                            offset: { type: integer }
                            limit: { type: integer }
                            has_more: { type: boolean }
                  - type: object
                    properties:
                      column: { type: string }
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/FundingApplication"
                      total: { type: integer }
                      offset: { type: integer }
                      limit: { type: integer }
                      has_more: { type: boolean }
        "403":
          description: Forbidden — admin or super_admin required
    post:
      tags: [Funding]
      summary: Create funding application manually (admin)
      description: |
        Adds a row to the funding board — e.g. phone intake or GHL lead.
        Fires `funding_application_created` (team email/in-app/SMS per prefs + extra emails)
        and emails the applicant a link to `/funding?token=…` to upload documents.
        Requires super_admin or admin role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, funding_type]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                funding_type:
                  type: string
                  enum: [credit_card_stacking, bank_statements]
                preferred_language:
                  type: string
                  enum: [en, es]
                status:
                  type: string
                  enum: [awaiting_docs, submitted, under_review, complete]
                  default: awaiting_docs
                postal_code: { type: string }
                state: { type: string }
                llc_name: { type: string }
                llc_address: { type: string }
                client_id:
                  type: integer
                  description: Optional existing client to link and prefill
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/FundingApplication"
        "400":
          description: Validation error
        "403":
          description: Forbidden — admin or super_admin required
        "404":
          description: client_id not found

