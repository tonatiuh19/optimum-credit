  /admin/documents/{id}:
    delete:
      tags: [Admin]
      summary: Remove an archived upload and reopen the Get Started task
      description: >
        Clears the file on the matching `client_task_completions` upload row and
        sets status/review back to pending so the client can upload again.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: client_task_completions id
      responses:
        "200":
          description: Upload cleared
        "400":
          description: Not an upload task
        "404":
          description: Not found

  /admin/documents/{id}/file:
    get:
      tags: [Admin]
      summary: Download decrypted document file (admin)
      security:
        - BearerAuth: []
      description: |
        Reads the encrypted file from disk, decrypts it with AES-256-GCM using
        the stored `enc_iv` and `enc_tag`, and streams the raw file bytes back
        with the original `Content-Type`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      responses:
        "200":
          description: Decrypted file bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized (admin only)
        "404":
          description: Document not found
        "500":
          description: Decryption failed

  /admin/documents/{id}/review:
    post:
      tags: [Admin]
      summary: Approve or reject a document (super admin)
      security:
        - BearerAuth: []
      description: |
        Approves or rejects a client document. On rejection, sends an email and
        SMS to the client with the rejection reason. When all 4 required documents
        are approved for the first time, the client is auto-advanced to `docs_ready`
        and a "documents verified" email + SMS is sent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: string
                  description: Required when decision is "rejected"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  auto_advanced:
                    type: boolean
                    description: True if client was auto-advanced to docs_ready
        "400":
          description: Missing or invalid decision / reason
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /admin/tickets:
    get:
      tags: [Admin]
      summary: List support tickets (paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, waiting_client, resolved, closed]
        - in: query
          name: search
          schema:
            type: string
          description: Subject or client name/email search
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated support tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /admin/pipeline:
    get:
      tags: [Admin]
      summary: Get credit repair cases + prospects for the pipeline Kanban (server-side filters + column pagination)
      description: |
        Cases and prospects on the Kanban board. Prospect cards are unconverted
        leads (`status=prospect` OR `pipeline_stage=prospect`, not cancelled,
        with no enrolled active non-prospect case) and may include `case_id` /
        `case_number` when a Prospect-stage case already exists (New Case →
        Prospect). Cases with `pipeline_stage=prospect` are excluded from
        `cases` (shown via the Prospect column). Convert prospect → new_client
        via `/admin/prospects/{id}/convert`. Search matches name, email, phone
        (including digit-stripped), case number, and numeric client id.

        Filters apply server-side so column counts stay accurate. Case-only
        filters (package, case status, tasks, info requests, non-prospect stage)
        hide the prospect column results.

        Without `column`: returns the first page of each column in `columns`
        (default `limit=20`, max 50), plus flat `cases`/`prospects` for the
        loaded pages and `web_review_prospects` for the web-lead review bucket
        (`web_lead_review` label). Main `prospects` excludes that bucket.
        With `column` + `offset`: returns a single-column page for load-more
        (`column` is `prospect`, `web_review`, or a case stage). Do not confuse
        filter `stage` with load-more `column`.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Name, email, phone (digit-stripped), case number, or client id
        - in: query
          name: language
          schema: { type: string, enum: [en, es] }
        - in: query
          name: prospect_sort
          schema: { type: string, enum: [heat] }
          description: "heat = prospects ordered by the lead credit insights heat score (hottest first). Prospect rows carry insight_* fields (heat score, readiness, middle / target / points to target, projected middle, estimated value, active mortgage file, next action, Requested By)."
        - in: query
          name: billing
          schema:
            type: string
            enum: [overdue, split_plan, paid_full, direct_paid, no_payment]
        - in: query
          name: package_id
          schema: { type: string }
          description: Package id, or "none" for no package
        - in: query
          name: assigned_admin_id
          schema: { type: string }
          description: Admin id, or "unassigned"
        - in: query
          name: referral_category
          schema:
            type: string
            enum: [realtor_broker, one_off, affiliate_partner]
        - in: query
          name: client_status
          schema: { type: string }
        - in: query
          name: case_status
          schema: { type: string, enum: [active, completed, on_hold] }
        - in: query
          name: stage
          schema: { type: string }
          description: Filter board to this pipeline stage or "prospect"
        - in: query
          name: payment_badge
          schema: { type: string, enum: [paid, unpaid] }
        - in: query
          name: tasks
          schema:
            type: string
            enum: [incomplete, complete, pending_review, rejected]
        - in: query
          name: info_requests
          schema: { type: string, enum: [open, none] }
        - in: query
          name: has_notes
          schema: { type: string, enum: [yes, no] }
        - in: query
          name: labels
          schema: { type: string }
          description: Comma-separated label slugs (ANY match)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Page size per column (board) or for load-more
        - in: query
          name: column
          schema:
            type: string
            enum:
              [
                prospect,
                web_review,
                new_client,
                docs_ready,
                round_1,
                round_2,
                round_3,
                round_4,
                round_5,
                completed,
              ]
          description: When set, returns a single-column page for load-more
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Load-more offset within `column`
      responses:
        "200":
          description: Board columns or a single column page
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      limit:
                        type: integer
                      columns:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            items:
                              type: array
                              items: {}
                            total: { type: integer }
                            offset: { type: integer }
                            limit: { type: integer }
                            has_more: { type: boolean }
                      cases:
                        type: array
                        items:
                          $ref: "#/components/schemas/CreditRepairCase"
                      prospects:
                        type: array
                        items:
                          $ref: "#/components/schemas/Prospect"
                      web_review_prospects:
                        type: array
                        description: First page of web_lead_review bucket (separate from prospects)
                        items:
                          $ref: "#/components/schemas/Prospect"
                  - type: object
                    required: [column, items, total, offset, limit, has_more]
                    properties:
                      column: { type: string }
                      items:
                        type: array
                        items: {}
                      total: { type: integer }
                      offset: { type: integer }
                      limit: { type: integer }
