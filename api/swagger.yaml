      summary: Mint a prepaid onboard invite
      description: |
        Creates a single-use `/join/:token` link (default 7 days). Staff sets package,
        amount already paid offline, payment method, optional remaining installments.
        Redeeming the link creates/promotes the client to New Client with a paid split
        (no card charge on the public page).
      security:
