  /registration/process-payment:
    post:
      tags: [Registration]
      summary: Charge card via Authorize.net Accept.js nonce (legacy two-step flow)
      description: |
        Accepts an opaque payment nonce from Accept.js when Authorize.net is configured,
        or processes a mock payment when it is not. For `tradeline_picker` packages,
        pass `tradelineProductIds` and the charge amount is the sum of selected lines.

        **Legacy route.** In production this route is disabled (returns `410`) unless
        `ALLOW_LEGACY_PROCESS_PAYMENT=true` is set — new clients should use the unified
        `POST /registration` flow instead. Even when enabled, the target client must be
        in `pending_payment` or `prospect` status. This route is rate-limited per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: integer }
                dataDescriptor:
                  type: string
                  example: COMMON.ACCEPT.INAPP.PAYMENT
                dataValue:
                  type: string
                  description: Opaque nonce from Accept.js
                tradelineProductIds:
                  type: array
                  items: { type: integer }
                  description: Required when package checkout_type is tradeline_picker
      responses:
        "200":
          description: Payment succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "402":
          description: Payment declined
        "404":
          description: Client not found
        "410":
          description: Route disabled — client is not eligible (wrong status) or legacy flow disabled in production. Use POST /registration instead.
        "429":
          description: Too many attempts — rate limited
        "503":
          description: Payment provider not configured (only when nonce required and ANet missing)

