  /admin/contacts/{id}/convert:
    post:
      tags: [Admin]
      summary: Convert contact to Pipeline prospect
      description: >-
        Creates a `clients` row with status/pipeline_stage=prospect, sets
        `converted_client_id` on the contact, and re-links Conversations
        `contact_id` → `client_id`. If phone/email already matches a client,
        links the contact to that existing client (`existing:true`) instead of
        creating a twin — there is no `confirm_duplicate` override.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Converted (or linked to existing client)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  contact_id: { type: integer }
                  client_id: { type: integer }
                  preferred_language: { type: string, enum: [en, es] }
                  existing: { type: boolean }
                  linked_existing: { type: boolean }
        "404":
          description: Not found or already converted

  /admin/clients/export:
    get:
      tags: [Admin]
      summary: Download clients CSV (tracker reconcile)
      description: >-
        Same filters as `GET /admin/clients` (no pagination). Returns UTF-8 CSV
        with BOM for Excel/Sheets: `client_id`, `first_name`, `last_name`,
        `name`, `status`, `pipeline_stage`, `email`, `phone`, `created_at`.
        Capped at 20,000 rows (`X-Export-Truncated: 1` when hit).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: stage
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string, enum: [en, es] }
        - in: query
          name: billing
          schema:
            type: string
            enum: [overdue, split_plan, paid_full, direct_paid, no_payment]
        - in: query
          name: joined_from
          schema: { type: string, format: date }
        - in: query
          name: joined_to
          schema: { type: string, format: date }
        - in: query
          name: has_notes
          schema: { type: string, enum: [yes, no] }
        - in: query
          name: labels
          schema: { type: string }
        - in: query
          name: sort_by
          schema: { type: string }
        - in: query
          name: sort_dir
          schema: { type: string, enum: [ASC, DESC] }
      responses:
        "200":
          description: CSV attachment (`ofg-clients-YYYY-MM-DD.csv`)
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Export-Truncated:
              schema: { type: string }
              description: Set to `1` when the row cap was hit
        "401":
          description: Unauthorized
        "403":
          description: Affiliate without portal access
        "500":
          description: Export failed

  /admin/clients:
    get:
      tags: [Admin]
      summary: List clients
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: stage
          schema:
            type: string
          description: >-
            Pipeline stage. Extended OFG rounds stay on `round_5`, so also
            accepts `round_6`..`round_12` (that extended round, from published
            reports + case max_rounds) and `round_6_plus` (any extended round).
            `round_5` excludes clients already in an extended round. Same for
            the CSV export. Each list row also returns `effective_round` (the real
            round for `round_5` clients: 5–12; null for other stages).
        - in: query
          name: search
          schema:
            type: string
          description: Name, email, phone (digit-stripped), or numeric client id
        - in: query
          name: unconverted_lead
          schema:
            type: string
            enum: ["1", "true"]
          description: >-
            When set, only unconverted Prospect-column leads (`status` or
            `pipeline_stage` is prospect, not cancelled, no enrolled case).
        - in: query
          name: labels
          schema:
            type: string
          description: >-
            Comma-separated label slugs (e.g. `collections,housing`) — returns
            clients with ANY matching label. `label` (singular) also accepted.
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
            enum: [en, es]
        - in: query
          name: billing
          schema:
            type: string
            enum: [overdue, split_plan, paid_full, direct_paid, no_payment]
        - in: query
          name: joined_from
          schema:
            type: string
            format: date
        - in: query
          name: joined_to
          schema:
            type: string
            format: date
        - in: query
          name: has_notes
          schema:
            type: string
            enum: [yes, no]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          schema:
            type: string
            enum:
              [
                created_at,
                first_name,
                last_name,
                email,
                package_name,
                pipeline_stage,
                status,
              ]
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        "200":
          description: Paginated list of clients (each includes a `labels` array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminClientListItem"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
    post:
      tags: [Admin]
      summary: Create a new client or prospect lead
      description: >-
        Staff may set `status=prospect` to create a CRM lead without credit
        analysis (`pipeline_stage=prospect`). Language assigns
        `assigned_admin_id` from `admins.language_owner_for` matching the
        client's `preferred_language`.
        Optional `referral_category` + `referrer_id` drive round-update routing.
        For non-prospect creates, optional `create_case` (or `round_schedule`
        with dates / `send_calendar`) opens a credit repair case and may persist
        / email the round calendar .ics.
        Affiliate-role callers are always stamped `status='prospect'`,
        `pipeline_stage='prospect'`, and their own `affiliate_id` —
        `package_id`, `status`, and `admin_notes` inputs are ignored, no welcome
        email is sent, and the client is auto-tagged with `affiliate_referral`.
        Requires an active/comped affiliate subscription
        (403 `affiliate_subscription_required` otherwise).
        `email` is optional when `phone` is provided (and vice versa). Empty
        email stores NULL; outbound client emails are skipped safely.
        Hard-blocks placeholder phones and phone/email matches on any existing
        client (`409` `duplicate_phone` / `duplicate_email` with
        `existing_client_id`) — no confirm override.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Optional when phone is set
                phone:
                  type: string
                  nullable: true
                  description: Optional when email is set; required if email is empty; placeholder phones rejected
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [prospect, pending_payment, onboarding, active, paused, cancelled]
                preferred_language:
                  type: string
                  enum: [en, es]
                referral_category:
                  type: string
                  enum: [realtor_broker, one_off, affiliate_partner]
                referrer_id:
                  type: integer
                  nullable: true
                referrers:
                  type: array
                  maxItems: 3
                  description: Multi-partner links (replaces single referrer_id when present)
                  items:
                    type: object
                    properties:
                      referrer_id: { type: integer }
                      notify_on_round:
                        type: boolean
                        description: >
                          Accepted for compatibility; server always stores true.
                      first_name: { type: string }
                      last_name: { type: string }
                      email: { type: string }
                      phone: { type: string }
                      preferred_language: { type: string, enum: [en, es] }
                cms_credentials:
                  type: object
                  description: SmartCredit + MyFreeScoreNow vault (staff only; hard-fails create if save fails)
                  properties:
                    smart_credit:
                      type: object
                      properties:
                        email: { type: string }
                        password: { type: string }
                    myfreescorenow:
                      type: object
                      properties:
                        email: { type: string }
                        password: { type: string }
                assigned_admin_id:
                  type: integer
                  nullable: true
                admin_notes:
                  type: string
                send_welcome_email:
                  type: boolean
                create_case:
                  type: boolean
                  description: Create a credit_repair_cases row (staff non-prospect only)
                round_schedule:
                  $ref: "#/components/schemas/RoundScheduleInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
                  case:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      case_number: { type: string }
                  round_calendar:
                    type: object
                    nullable: true
        "400":
          description: Validation error (including `placeholder_phone`)
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "409":
          description: >-
            `duplicate_phone` or `duplicate_email` with `existing_client_id`
            (and `duplicates` for phone). No confirm override.
        "500":
          description: CMS vault save failed after insert (code `cms_credentials_failed`; client rolled back)

  /admin/clients/{id}:
    put:
      tags: [Admin]
      summary: Update a client
      description: >-
        Affiliates may only update `first_name`, `last_name`, `email`, and
        `phone` on clients within their own referral scope — `package_id`,
        `status`, `preferred_language`, and `admin_notes` are silently ignored
        for affiliate callers, and out-of-scope client ids return 404.
        Staff may set `preferred_language` (en|es); that also reassigns
        `assigned_admin_id` to the language owner unless `assigned_admin_id`
        is sent explicitly.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
