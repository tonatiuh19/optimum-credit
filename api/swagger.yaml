        name_es: { type: string }
        layer: { type: string, enum: [source, analysis] }
        color: { type: string }
        sort_order: { type: integer }

    FundingApplication:
      type: object
      properties:
        id: { type: integer }
        public_token: { type: string }
        funding_type:
          type: string
          enum: [credit_card_stacking, bank_statements]
        status:
          type: string
          enum:
            [
              draft,
              awaiting_docs,
              submitted,
              under_review,
              complete,
              converted,
              cancelled,
            ]
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
