          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Case documents
    post:
      tags: [Admin]
      summary: Admin upload documents to a case (AES-256-GCM)
      description: |
        Multipart upload. Each file and the total request body must stay under
        ~4MB (Vercel serverless limit). Prefer one file per request for large PDFs.
        Files are AES-256-GCM encrypted then stored on CDN. Returns 413 when oversize.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type, files]
              properties:
                doc_type:
                  type: string
                  enum: [id_front, id_back, ssn_card, proof_of_address, other]
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Documents uploaded and encrypted
        "413":
          description: File or total upload exceeds platform 4MB limit
        "502":
          description: Document storage (CDN) temporarily unavailable

