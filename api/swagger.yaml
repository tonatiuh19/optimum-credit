    ReportWizardBeforeContext:
      type: object
      properties:
        source:
          type: string
          enum: [enrollment, prior_round, none]
        can_reuse:
          type: boolean
        prior_session_id:
          type: integer
          nullable: true
        prior_round:
          type: integer
          nullable: true
        file_name:
          type: string
          nullable: true
        report_date_after:
          type: string
          nullable: true
        score_after:
          type: number
          nullable: true
        middle_score_after:
          type: number
          nullable: true
        compare_mode:
          type: string
          enum: [baseline, chain]
          description: baseline = reuse Round 1 Before; chain = reuse prior After
        reuse_pdf_role:
          type: string
          enum: [before, after]
          description: Which PDF on prior_session_id to load when can_reuse is true

    # ─── Payment Splits ───────────────────────────────────────────────────────────

    PaymentSplit:
      type: object
      properties:
        id:
          type: integer
        case_id:
          type: integer
        label:
          type: string
        amount_cents:
          type: integer
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, paid, cancelled]
        completion_source:
          type: string
          enum: [authorize_link, manual]
          nullable: true
        notes:
          type: string
          nullable: true
        payment_link:
          type: string
          nullable: true
        case_number:
          type: string
          nullable: true
        client_first_name:
          type: string
          nullable: true
        client_last_name:
          type: string
          nullable: true

    CreateSplitPayload:
      type: object
      required: [label, amount_cents, due_date, send_payment_link]
      properties:
        label:
          type: string
        amount_cents:
          type: integer
        due_date:
          type: string
          format: date
        send_payment_link:
          type: boolean
        reminder_flow_id:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        mark_as_paid:
          type: boolean
          description: >
            When true, creates the split already marked paid (manual).
            Skips payment link generation and reminder scheduling.

    RoundScheduleInput:
      type: object
      description: >
        Planned Round 1–5 completion dates (all-day). Opt-in calendar .ics
        email via send_calendar (default false). Recipients: client, attached
        referrer (if email), and assigned language-owner admin.
      properties:
        round_1_date: { type: string, format: date }
        round_2_date: { type: string, format: date }
        round_3_date: { type: string, format: date }
        round_4_date: { type: string, format: date }
        round_5_date: { type: string, format: date }
        interval_days: { type: integer, default: 35 }
        send_calendar: { type: boolean, default: false }
