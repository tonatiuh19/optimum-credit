              - get_progress_report
              - search_work_tasks
              - get_client
              - list_case_documents
              - list_payments
              - list_installments
              - list_clients_owing
              - list_round_schedule
              - create_prospect
              - create_work_task
              - add_case_note
              - upload_case_document
              - send_email
              - send_sms
              - send_text
              - list_sms
              - get_texts
              - get_conversation
              - list_ofg_phone_numbers
              - update_pipeline_stage
              - preview_convert_prospect
              - convert_prospect
              - update_client_status
              - upsert_progress_report
              - upsert_payment_splits
              - update_payment_split
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tool: { type: string }
                  data: {}
        "400":
          description: Tool arg / execution error
        "403":
          description: Role not allowed / affiliate denied
        "404":
          description: Feature off or unknown tool
        "429":
          description: Rate limited

