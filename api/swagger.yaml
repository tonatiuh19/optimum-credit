          description: Unauthorized

  /admin/task-templates/{id}:
    put:
      tags: [Admin]
      summary: Update an existing task template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTemplatePayload"
      responses:
        "200":
          description: Updated task template
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      tags: [Admin]
      summary: Delete a task template (blocked if system task or has completions)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "400":
          description: Cannot delete (system task or has completions)
        "401":
          description: Unauthorized

  /admin/cases/{id}:
    get:
      tags: [Admin]
      summary: Get full detail for a single credit repair case
      description: |
        `case_info.hygiene_alerts` (Engine Spec v1 PR-P2-3, shown on the case,
        never in reports): `status_behind_stage`, `proof_of_address_pending`
        (`days` > 14), `no_round_schedule`. `reports[].items_disputed` is null
        when no dispute log exists ("not recorded").
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_info:
                    type: object
                    properties:
                      id:
                        type: integer
                      case_number:
                        type: string
                        example: CR-00001
                      status:
                        type: string
                        enum: [active, completed, cancelled, on_hold]
                      pipeline_stage:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      max_rounds:
                        type: integer
                        minimum: 5
                        maximum: 12
                        description: Max OFG progress rounds (5 default; up to 24 for special clients)
                      next_dispute_target_date:
                        type: string
                        format: date
                        nullable: true
                      highest_published_round:
                        type: integer
                      extended_rounds_legend:
                        type: string
                        nullable: true
                        example: Special · R6/8
                      available_rounds:
                        type: array
                        items:
                          type: integer
                        description: Round numbers 1..max_rounds for UI selectors
                  client:
                    $ref: "#/components/schemas/AdminClientDetail"
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDocument"
                  reports:
                    type: array
                    items:
                      type: object
                  payments:
                    type: array
                    items:
                      type: object
                  pipeline_history:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found

  /admin/cases/{id}/extended-rounds:
    patch:
      tags: [Admin]
      summary: Update extended OFG rounds settings for a case
      description: |
        Any staff admin may raise `max_rounds` (5–24) for special clients, set
        an optional `next_dispute_target_date` (calendar), and/or choose
        `report_compare_mode` (`baseline` = vs enrollment Before — default;
        `chain` = vs prior After). Pipeline stage ENUM stays on `round_5` while
        publishing rounds 6..(max−1); final max round → `completed`.
        Cannot set `max_rounds` below the highest already-published `round_number`.
        If the case is already `completed` and `max_rounds` is raised above the highest
        published round, the case/client are reopened to `round_5` so staff can publish
        the next report (no graduating/reminder side effects).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_rounds:
                  type: integer
                  minimum: 5
                  maximum: 12
                next_dispute_target_date:
                  type: string
                  format: date
                  nullable: true
                  description: YYYY-MM-DD or null to clear
                report_compare_mode:
                  type: string
                  enum: [baseline, chain]
                  description: |
                    baseline (default) — Round N Before = enrollment / Round 1 Before;
                    chain — Round N Before = prior round After (legacy).
      responses:
        "200":
          description: Updated extended-rounds fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      client_id: { type: integer }
                      max_rounds: { type: integer }
                      next_dispute_target_date:
                        type: string
                        format: date
                        nullable: true
                      report_compare_mode:
                        type: string
                        enum: [baseline, chain]
                      highest_published_round: { type: integer }
                      pipeline_stage: { type: string }
                      reopened_to_round_5:
                        type: boolean
                        description: True when completed was reopened to round_5 after raising max
                      extended_rounds_legend:
                        type: string
                        nullable: true
                      available_rounds:
                        type: array
                        items: { type: integer }
                      is_extended: { type: boolean }
        "400":
          description: Invalid body
        "401":
          description: Unauthorized
        "404":
          description: Case not found
        "422":
          description: max_rounds below highest published round

  /admin/cases/{id}/stage:
    post:
      tags: [Admin]
      summary: Move a credit repair case to a new pipeline stage
      description: |
        `prospect` is intentionally excluded from the `stage` enum — cases are
        only ever leave via `/admin/prospects/{id}/convert` (1C). Cases at
        `pipeline_stage=prospect` cannot use this endpoint — convert is required.
        Entering `docs_ready` fires the `docs_ready` reminder flow.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum:
                    [
                      new_client,
                      docs_ready,
                      round_1,
                      round_2,
                      round_3,
                      round_4,
                      round_5,
                      completed,
                      cancelled,
                    ]
                notes:
                  type: string
      responses:
        "200":
          description: Stage updated (or unchanged if same stage)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unchanged:
                    type: boolean
                    description: True when the requested stage equals the current stage
        "400":
          description: Invalid stage value or case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found
        "422":
          description: Stage transition blocked (e.g. docs_ready requires all docs approved)

  /admin/contacts:
    get:
      tags: [Admin]
      summary: List CRM contacts (address book)
      description: >-
        Active contacts only by default (`deleted_at` null, `converted_client_id`
        null). Admin/super_admin only — affiliates receive 403.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Name, email, or phone
        - in: query
          name: language
          schema:
            type: string
            enum: [en, es]
        - in: query
          name: has_notes
          schema:
            type: string
            enum: [yes, no]
        - in: query
          name: include_deleted
          schema:
            type: string
            enum: ["1", "true"]
        - in: query
          name: include_converted
          schema:
            type: string
            enum: ["1", "true"]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          schema:
            type: string
            enum:
              [created_at, first_name, last_name, email, phone, preferred_language]
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        "200":
          description: Paginated contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminCrmContact"
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "403":
          description: Affiliate access denied
    post:
      tags: [Admin]
      summary: Create CRM contact
      description: >-
        Address-book entry (not a pipeline client). Requires first_name, last_name,
        and email or phone. Email must be a valid address; phone must have ≥10 digits
        and is stored as E.164 (US 10-digit → +1…). Soft-warns on phone/email duplicates
        unless `confirm_duplicate=true`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
                admin_notes: { type: string, nullable: true }
                address_line1: { type: string, nullable: true }
                address_line2: { type: string, nullable: true }
                city: { type: string, nullable: true }
                state: { type: string, nullable: true }
                zip: { type: string, nullable: true }
                confirm_duplicate: { type: boolean }
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    $ref: "#/components/schemas/AdminCrmContact"
        "400":
          description: Validation error
        "403":
          description: Affiliate access denied
        "409":
          description: Duplicate phone/email (pass confirm_duplicate)

  /admin/contacts/{id}:
    get:
      tags: [Admin]
      summary: Get CRM contact
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    $ref: "#/components/schemas/AdminCrmContact"
        "404":
          description: Not found
        "403":
          description: Affiliate access denied
    put:
      tags: [Admin]
      summary: Update CRM contact
      description: >-
        Active unconverted contacts only. Soft-warns duplicates unless
        `confirm_duplicate=true`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                preferred_language: { type: string, enum: [en, es] }
                admin_notes: { type: string, nullable: true }
                address_line1: { type: string, nullable: true }
                address_line2: { type: string, nullable: true }
                city: { type: string, nullable: true }
                state: { type: string, nullable: true }
