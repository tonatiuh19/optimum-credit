  /admin/cases:
    post:
      tags: [Admin - Cases]
      summary: Create a new credit repair case
      description: |
        Creates a `credit_repair_cases` row. Allowed `pipeline_stage` values are
        only `prospect` and `new_client` (default) — later stages must be reached
        via convert / task approval / Pipeline board moves so cases are not
        created mid-pipeline with incomplete onboarding. `pipeline_stage=prospect`
        is allowed only when the client has `status=prospect` — this attaches a
        Prospect-stage case without converting. Convert-time fields (`notes`,
        `package_id`, `splits`, `round_schedule`, `send_case_email`) are ignored
        for prospect stage (no welcome email / tasks / payment_confirmed).
        `pipeline_stage=new_client` (default) always sends the convert-welcome
        email with a Get Started / document-upload magic link (`/portal/onboarding/:token`)
        when the client has an email, schedules `payment_confirmed` Day 2/3 nudges
        (Day-0 skipped), assigns onboarding tasks, and may fire first-time
        activation SMS. Optional `send_case_email` still sends the legacy
        case-started payments email in addition. Other stages for a prospect must
        use `/admin/prospects/{id}/convert`. Prospect-stage cases do not appear in
        Kanban case columns; they stay in the Prospect column until convert.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: integer
                package_id:
                  type: integer
                  nullable: true
                pipeline_stage:
                  type: string
                  enum: [prospect, new_client]
                  default: new_client
                  description: >
                    New Case may only start at Prospect or New Client. Advance
                    to Docs Verified / rounds via the Pipeline board after
                    required tasks are approved.
                notes:
                  type: string
                  nullable: true
                send_case_email:
                  type: boolean
                round_schedule:
                  $ref: "#/components/schemas/RoundScheduleInput"
                splits:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateSplitPayload"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id:
                    type: integer
                  case_number:
                    type: string
        "400":
          description: Missing client_id
        "401":
          description: Unauthorized

  /admin/prepaid-onboard-invites:
    get:
      tags: [Admin - Pipeline]
      summary: List recent prepaid onboard invites
      description: Staff-minted single-use links for already-paid unknown clients.
      security:
        - BearerAuth: []
      parameters:
