            schema:
              type: object
              required: [session_id, digits]
              properties:
                session_id: { type: integer }
                digits: { type: string, description: "0-9 * # (w = pause)" }
      responses:
        "200": { description: Sent }
        "400": { description: Invalid digits }
        "404": { description: No active third caller }
  /voice/three-way/remove:
    post:
      tags: [Conversations]
      summary: Hang up the third caller (client and staff stay connected)
      security: [{ bearerAuth: [] }]
      responses:
