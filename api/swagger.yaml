      summary: MyFreeScoreNow affiliate API gate status
      description: |
        Read-only. Default `MFSN_ENABLED` omitted/0 returns mode `disabled` and
        never calls MyFreeScoreNow. Does not return secrets or bearer tokens.
        Affiliates are forbidden.
      security:
        - BearerAuth: []
