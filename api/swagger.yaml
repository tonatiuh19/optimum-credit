                reviewed_json:
                  type: object
      responses:
        "200":
          description: Enhanced reviewed_json saved for human confirm
        "503":
          description: Claude unavailable
        "502":
          description: Claude enhance failed

  /admin/report-wizard/sessions/{id}/score-update:
    post:
      tags: [Report Wizard]
      summary: Switch a draft between the full progress report and a Score update
      description: |
        Score update (Oct 28, 2026): when a SmartCredit PDF was saved before its account
        pages loaded, the report can be sent as a one-page Score update — staff-verified
        scores, the hard-inquiry totals each report prints, and removed inquiries only when
        both reads match those printed totals on every bureau. No account results. Same
        approval gate as every report; counts as the round. `enabled: true` only while a
        read is flagged incomplete_print; `enabled: false` is always allowed. Audited
        (`report_wizard.score_update`).
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: "{ session, score_update }"
        "404":
          description: Session not found
        "409":
          description: Already published (code session_published)
        "422":
          description: No read is flagged incomplete (code score_update_not_needed)
  /admin/report-wizard/sessions/{id}/preview:
    post:
      tags: [Admin]
      summary: Generate a non-persisted PDF preview from reviewed data
      description: >-
        Score update sessions return the one-page Score update PDF with header
        X-Report-Kind=score_update (gate codes: reads_pending 409, reads_failed,
        score_update_not_needed, blocked_data_integrity 422).
        Same 3-page progress PDF as before. Enhancement: when the background
        account-level reads of this session's Before and After PDFs are both
        ready (queued at session create), account-detail pages are appended
        (summary tiles, REMOVED / PARTIAL per account, still reporting, what
        moved the score). Otherwise the PDF is unchanged.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewed_json:
                  type: object
      responses:
        "200":
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "409":
          description: |
            Engine Spec v1 PR-P0-1 — `code: reads_pending`: the account-level
            Before / After reads are not both ready (`reads` has per-pull status).
            No text-summary fallback.
        "422":
          description: |
            Compliance validation failed, or `code: reads_failed` (a read failed
            twice — needs review) / `code: blocked_data_integrity` (identical
            pulls: same report date, same file hash, or identical scores +
            balances — PR-P0-5).

  /admin/report-wizard/sessions/{id}/review:
    patch:
      tags: [Admin]
      summary: Save admin-edited reviewed_json for a wizard session
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewed_json]
              properties:
                reviewed_json:
                  type: object
      responses:
        "200":
          description: Review saved

  /admin/round-reports/pending-approval:
    get:
      tags: [Report Wizard]
      security: [{ bearerAuth: [] }]
      summary: "Spec v1.1 P0-1: progress reports published but not sent (pending_approval | needs_review), with failed self-checks and whether the caller can approve / override"
      responses:
        "200":
          description: "{ items[] } — each item has report_kind: progress_report | score_update"
  /admin/round-reports/{id}/approval:
    get:
      tags: [Report Wizard]
      security: [{ bearerAuth: [] }]
      summary: "Approval status of one round report: delivery_status, §9 self-check rows, publish options, approver"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Approval status
        "404":
          description: Not found
  /admin/round-reports/{id}/rebuild:
    post:
      tags: [Report Wizard]
      security: [{ bearerAuth: [] }]
      summary: "Rebuild a held report (Nov 6, 2026): a report never sent to the client (needs_review or pending_approval) on the client's latest round goes back to its wizard session's Review step with the reads already uploaded; its PDF is removed. Publishing again rebuilds it with the current reader and self-check. Same people as Approve. Audited (report_wizard.rebuild_held_report). The §9 self-check also lists printed_repairs (values corrected from the PDF's own rows) and a held publish alerts REPORT_HELD_ALERT_ADMIN_IDS in-app."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Back in Review
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  client_id: { type: integer }
                  round_number: { type: integer }
                  session_id: { type: integer }
        "403": { description: Not the report's approver }
        "409": { description: "not_rebuildable (already sent / approved / rebuilt) or not_latest_round" }
        "422": { description: no_session }
  /admin/round-reports/{id}/approve:
    post:
      tags: [Report Wizard]
      security: [{ bearerAuth: [] }]
      summary: "Approve & send (language owner EN/ES or REPORT_RELEASE_MANAGER_IDS). needs_review needs a release manager + override_reason (≥ 10 chars, audited). Sends the client flow + partner PDF, or releases to the portal silently for old rounds. A sent round that makes two in a row with no items removed and no score gain alerts ROUND_NO_CHANGE_ALERT_ADMIN_IDS by SMS + in-app."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                override_reason: { type: string }
      responses:
        "200":
          description: "{ ok, delivery_status: sent | silent, client_notify, partners_emailed }"
        "403":
          description: Not an approver for this report language
        "409":
          description: Already approved / being approved
        "422":
          description: Self-check failed (code self_check_failed) — fix and republish, or release-manager override
  /admin/report-wizard/sessions/{id}/reads:
    get:
      tags: [Report Wizard]
      summary: Account-level read status for the Progress Report engine (also re-queues missing reads)
      description: |
        `ready` = both reads ready and no data-integrity block. Before reused
        from the prior round (`before_source: prior_round`) = that round's After
        read. A missing read is queued from the stored source PDF; a failed read
        is retried once, then reported as failed (needs review).
        Spec v1.1: a SmartCredit PDF saved before the accounts loaded fails with
        code incomplete_print (empty account pages, or fewer accounts than the
        pull's own summary lists, e.g. "TU 11 of 32").
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "{ ready, reads: { before, after: { status: missing|queued|reading|ready|failed, error, reused, code? } }, blocked_data_integrity, report_dates, score_update, score_update_available, incomplete_sides } — in a Score update session ready = both reads settled and one is incomplete. Also starting_point, scores_from_reads, read_scores { before, after }: once both reads settle the review scores are filled from the reads (any report format); a later typed score that differs from the PDF fails the scores self-check (needs_review, release-manager override)"
  /admin/report-wizard/sessions/{id}/finalize:
    post:
      tags: [Admin]
      summary: "Publish OFG report (generate PDF, advance pipeline; Score update sessions publish the one-page Score update with engine_json.engine=score_update and no account results). Spec v1.1 P0-1: never sends — the report waits for POST /admin/round-reports/{id}/approve (delivery_status pending_approval, or needs_review when the §9 self-check fails) and stays hidden from the client until then."
      description: |
        Round 6+ (ROUND_AUDIT_MIN_ROUND): also sends an SMS + in-app audit
        alert to ROUND_AUDIT_ALERT_ADMIN_IDS (default Lecca), once per case + round.
        Enhancement: the published PDF gets the same appended account-detail
        pages as Preview when both enhanced reads are ready; otherwise it is the
        unchanged 3-page report.
        Generates the progress-report PDF, advances the case round stage when
        appropriate, and notifies the client via the `round_N_complete` reminder
        flow only (no duplicate immediate email/SMS). The flow email attaches the
        Round PDF when stored, includes a portal magic link landing on
        `/portal/reports`, and a short-lived secure PDF download URL
        (`GET /api/public/round-report-pdf/{token}`, 72h). SMS (when enabled)
        uses the publishing admin's OFG number, matches preferred language, and
        links the secure PDF URL.         When `notify_partners` is true (default),
        linked referral partners of any category receive the PDF via
        `client_referrers` only (no legacy `clients.referrer_id` fallback).
        Soft stats `partners_linked` / `partners_with_email` /
        `partners_emailed` / `partners_pdf_load_failed` are returned for UI
        warnings. There is no bare stage-text partner fallback after publish
        (PDF path only). Published reports appear in the client portal via
        `round_report_pdfs` (dashboard no longer requires legacy
        `pdf_storage_key`).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compliance_acknowledged]
              properties:
                compliance_acknowledged:
                  type: boolean
                acknowledge_score_anomalies:
                  type: boolean
                notify_client:
                  type: boolean
                  description: >-
                    GF-84 override. Omit to use the default (old / backfilled rounds
                    publish silently; see notify-default). false also skips partners.
                notify_partners:
                  type: boolean
                  description: >
                    Default true. When true, email linked referral partners with
                    the Round PDF. Set false to notify the client only.
      responses:
        "200":
          description: Published
        "422":
          description: Compliance validation failed

  /admin/round-report-pdfs/{pdfId}/resend:
    post:
      tags: [Admin]
      summary: Resend a published Round PDF to client and referral partners
      description: |
        Same secure delivery as wizard publish / MCP `send_round_report`: mints a
        short-lived `/api/public/round-report-pdf/{token}`, emails the client
        (`tplRoundComplete` + optional PDF attach), optional twin SMS, and by
        default emails every linked referral partner with the PDF.
        Defaults: `also_email`, `also_sms`, `attach_pdf`, `notify_partners` all true.
        Affiliates are denied. Appends a CRM admin note on success.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: pdfId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                also_email:
                  type: boolean
                  default: true
                also_sms:
                  type: boolean
                  default: true
                attach_pdf:
                  type: boolean
                  default: true
                notify_partners:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  email_sent:
                    type: boolean
                  sms_sent:
                    type: boolean
                  partners_emailed:
                    type: integer
                  partners_linked:
                    type: integer
                  partners_with_email:
                    type: integer
                  secure_pdf_url:
                    type: string
        "422":
          description: Client missing email or phone when required
        "404":
          description: PDF or client not found

  /admin/report-wizard/sessions/{id}/source/{role}:
    get:
