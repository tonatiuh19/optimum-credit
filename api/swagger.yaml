  /cron/process-queue:
    get:
      tags: [Admin]
      summary: Process pending notification_queue rows (Vercel Cron)
      description: |
        Same as POST. Vercel Cron invokes GET with `Authorization: Bearer CRON_SECRET`
        every 5 minutes (`vercel.json`). Cancels stale pending (>14d), reclaims stuck
        claim tags (>15m), claim-tag sends via Resend, and deletes expired `mms_media`.
      parameters:
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: Bearer CRON_SECRET (Vercel Cron)
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processed: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  stale_cancelled: { type: integer }
                  stuck_reclaimed: { type: integer }
                  work_due_notified: { type: integer }
                  mms_expired_deleted: { type: integer }
        "401":
          description: Unauthorized
        "500":
          description: Processing failure
    post:
      tags: [Admin]
      summary: Process pending notification_queue rows
      description: |
        Protected by `X-Cron-Secret` or `Authorization: Bearer CRON_SECRET`
        (must match `CRON_SECRET`). Cancels pending rows scheduled more than
        14 days ago, reclaims stuck `processing` claims older than 15 minutes,
        then claims a batch with a unique tag (overlap-safe) and sends emails
        via Resend. SMS / in_app / push channels are marked `failed` until
        those deliverers are wired (never fake-marked `sent`). Also deletes
        expired `mms_media` rows (up to 200 per run).
      parameters:
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processed: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  stale_cancelled: { type: integer }
                  stuck_reclaimed: { type: integer }
                  work_due_notified: { type: integer }
                  mms_expired_deleted: { type: integer }
        "401":
          description: Unauthorized
        "500":
          description: Processing failure

