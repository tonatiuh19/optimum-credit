  /admin/task-completions/{id}/reopen:
    post:
      tags: [Admin]
      summary: Reopen an approved task (optional client email); restores admin upload path
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Task completion id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notify_client]
              properties:
                notify_client:
                  type: boolean
                  description: When true, email the client a secure one-time re-submit link
                reason:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        "200":
          description: Task reopened (email failures still return 200 with notified=false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reopened: { type: boolean }
                  notified: { type: boolean }
                  notify_requested: { type: boolean }
                  notify_skipped_reason: { type: string, nullable: true }
                  notify_error: { type: string, nullable: true }
                  emailed: { type: string, nullable: true }
                  expires_at: { type: string, format: date-time, nullable: true }
                  stage_rolled_back: { type: boolean }
                  pipeline_stage: { type: string }
                  task_slug: { type: string }
                  task_type: { type: string }
                  template_id: { type: integer }
                  is_required: { type: boolean }
        "401":
          description: Unauthorized
        "404":
          description: Task completion not found
        "409":
          description: Concurrent change — task no longer approved
        "422":
          description: Not approved, or case is not active

  /admin/client-documents/{id}/file:
    get:
      tags: [Admin]
      summary: Decrypt and serve a client_documents file
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: File bytes
        "404":
          description: Not found

  /admin/admins/{id}/resend-welcome:
    post:
      tags: [Admin]
      summary: Resend team welcome email (super_admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email sent
        "404":
          description: Admin not found

  /admin/admins/{id}:
    put:
      tags: [Admin]
      summary: Update admin team member (super_admin only)
      description: >-
        Updates profile fields. `preferred_language` is UI preference.
        `language_owner_for` (en|es|null) sets/clears sole language ownership
        (clears any previous owner for that language). Deactivating an admin
        also clears language_owner_for so reassignment is not blocked.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                role: { type: string }
                status: { type: string, enum: [active, inactive, suspended] }
                preferred_language: { type: string, enum: [en, es] }
                language_owner_for:
                  type: string
                  enum: [en, es]
                  nullable: true
      responses:
        "200":
          description: Updated
        "403":
          description: Forbidden

  /admin/task-templates:
    get:
      tags: [Admin]
      summary: List onboarding task templates with optional search and filters
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Full-text search across title_en, title_es, slug, description_en
        - in: query
          name: type
          schema:
            type: string
            enum: [all, form, upload, sign_document]
          description: Filter by task type
        - in: query
          name: active
          schema:
            type: string
            enum: [all, active, inactive]
          description: Filter by active status
      responses:
        "200":
          description: Filtered list of task templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnboardingTaskTemplate"
        "401":
          description: Unauthorized
    post:
      tags: [Admin]
      summary: Create a new onboarding task template
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTemplatePayload"
      responses:
        "201":
          description: Task template created
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /admin/task-templates/{id}:
    put:
      tags: [Admin]
      summary: Update an existing task template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTemplatePayload"
      responses:
        "200":
          description: Updated task template
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      tags: [Admin]
      summary: Delete a task template (blocked if system task or has completions)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "400":
          description: Cannot delete (system task or has completions)
        "401":
          description: Unauthorized

  /admin/cases/{id}:
    get:
      tags: [Admin]
      summary: Get full detail for a single credit repair case
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_info:
                    type: object
                    properties:
                      id:
                        type: integer
                      case_number:
                        type: string
                        example: CR-00001
                      status:
                        type: string
                        enum: [active, completed, cancelled, on_hold]
                      pipeline_stage:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                  client:
                    $ref: "#/components/schemas/AdminClientDetail"
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDocument"
                  reports:
                    type: array
                    items:
                      type: object
                  payments:
                    type: array
                    items:
                      type: object
                  pipeline_history:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found

  /admin/cases/{id}/stage:
    post:
      tags: [Admin]
      summary: Move a credit repair case to a new pipeline stage
      description: |
        `prospect` is intentionally excluded from the `stage` enum — cases are
        only ever leave via `/admin/prospects/{id}/convert` (1C). Cases at
        `pipeline_stage=prospect` cannot use this endpoint — convert is required.
        Entering `docs_ready` fires the `docs_ready` reminder flow.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum:
                    [
                      new_client,
                      docs_ready,
                      round_1,
                      round_2,
                      round_3,
                      round_4,
                      round_5,
                      completed,
                      cancelled,
                    ]
                notes:
                  type: string
      responses:
        "200":
          description: Stage updated (or unchanged if same stage)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unchanged:
                    type: boolean
                    description: True when the requested stage equals the current stage
        "400":
          description: Invalid stage value or case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found
        "422":
          description: Stage transition blocked (e.g. docs_ready requires all docs approved)

  /admin/clients:
    get:
      tags: [Admin]
      summary: List clients
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: stage
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
          description: Name, email, phone (digit-stripped), or numeric client id
        - in: query
          name: unconverted_lead
          schema:
            type: string
            enum: ["1", "true"]
          description: >-
            When set, only unconverted Prospect-column leads (`status` or
            `pipeline_stage` is prospect, not cancelled, no enrolled case).
        - in: query
          name: labels
          schema:
            type: string
          description: >-
            Comma-separated label slugs (e.g. `collections,housing`) — returns
            clients with ANY matching label. `label` (singular) also accepted.
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
            enum: [en, es]
        - in: query
          name: billing
          schema:
            type: string
            enum: [overdue, split_plan, paid_full, direct_paid, no_payment]
        - in: query
          name: joined_from
          schema:
            type: string
            format: date
        - in: query
          name: joined_to
          schema:
            type: string
            format: date
        - in: query
          name: has_notes
          schema:
            type: string
            enum: [yes, no]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          schema:
            type: string
            enum:
              [
                created_at,
                first_name,
                last_name,
                email,
                package_name,
                pipeline_stage,
                status,
              ]
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        "200":
          description: Paginated list of clients (each includes a `labels` array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminClientListItem"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
    post:
      tags: [Admin]
      summary: Create a new client or prospect lead
      description: >-
        Staff may set `status=prospect` to create a CRM lead without credit
        analysis (`pipeline_stage=prospect`). Language assigns
        `assigned_admin_id` from `admins.language_owner_for` matching the
        client's `preferred_language`.
        Optional `referral_category` + `referrer_id` drive round-update routing.
        For non-prospect creates, optional `create_case` (or `round_schedule`
        with dates / `send_calendar`) opens a credit repair case and may persist
        / email the round calendar .ics.
        Affiliate-role callers are always stamped `status='prospect'`,
        `pipeline_stage='prospect'`, and their own `affiliate_id` —
        `package_id`, `status`, and `admin_notes` inputs are ignored, no welcome
        email is sent, and the client is auto-tagged with `affiliate_referral`.
        Requires an active/comped affiliate subscription
        (403 `affiliate_subscription_required` otherwise).
        `email` is optional when `phone` is provided (and vice versa). Empty
        email stores NULL; outbound client emails are skipped safely.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Optional when phone is set
                phone:
                  type: string
                  nullable: true
                  description: Optional when email is set; required if email is empty
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [prospect, pending_payment, onboarding, active, paused, cancelled]
                preferred_language:
                  type: string
                  enum: [en, es]
                referral_category:
                  type: string
                  enum: [realtor_broker, one_off, affiliate_partner]
                referrer_id:
                  type: integer
                  nullable: true
                assigned_admin_id:
                  type: integer
                  nullable: true
                admin_notes:
                  type: string
                send_welcome_email:
                  type: boolean
                create_case:
                  type: boolean
                  description: Create a credit_repair_cases row (staff non-prospect only)
                round_schedule:
                  $ref: "#/components/schemas/RoundScheduleInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
                  case:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      case_number: { type: string }
                  round_calendar:
                    type: object
                    nullable: true
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "409":
          description: Email already exists

  /admin/clients/{id}:
    put:
      tags: [Admin]
      summary: Update a client
      description: >-
        Affiliates may only update `first_name`, `last_name`, `email`, and
        `phone` on clients within their own referral scope — `package_id`,
        `status`, and `admin_notes` are silently ignored for affiliate
        callers, and out-of-scope client ids return 404.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [pending_payment, onboarding, active, paused, cancelled]
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "404":
          description: Client not found (or out of the caller's affiliate scope)
        "409":
          description: Email already exists
    delete:
      tags: [Admin]
      summary: Delete a client
      description: >-
        Affiliates may only delete their own referred leads while they are
        still `status='prospect'` — out-of-scope clients return 404, and
        already-converted clients return 403.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Affiliate subscription required, or client is past the prospect stage
        "404":
          description: Client not found (or out of the caller's affiliate scope)

  /admin/bulk-import/templates/clients.csv:
    get:
      tags: [Bulk Import]
      summary: Download the clients CSV import template
      security:
        - BearerAuth: []
      responses:
        "200":
          description: CSV file with headers + one sample row
          content:
            text/csv:
              schema:
                type: string

  /admin/bulk-import/validate:
    post:
      tags: [Bulk Import]
      summary: Upload + validate a bulk import CSV (stages a review job, no DB writes yet)
      description: |
        Parses and validates the uploaded CSV (max 500 rows, 5MB), resolves
        `package_slug` to `package_id`, and flags rows whose email already
        exists in `clients`. The result is staged as a `bulk_import_jobs` row
        (`status = validated`, TTL 1 hour) that must be reviewed and then
        committed via `POST /admin/bulk-import/{jobId}/commit`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                entity:
                  type: string
                  enum: [clients]
                  default: clients
      responses:
        "200":
          description: Validation summary + row-level preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  row_count:
                    type: integer
                  will_create_count:
                    type: integer
                  skipped_count:
                    type: integer
                  error_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  breakdown:
                    type: object
                    properties:
                      will_create: { type: integer }
                      skipped: { type: integer }
                      error: { type: integer }
        "400":
          description: Missing/invalid file, unknown or forbidden columns, too many rows
        "403":
          description: Bulk CSV import is disabled (see BULK_CSV_IMPORT_ENABLED)

  /admin/bulk-import/{jobId}:
    get:
      tags: [Bulk Import]
      summary: Get a staged/committed bulk import job (status, preview, result)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      id: { type: integer }
                      entity: { type: string, enum: [clients] }
                      status:
                        type: string
                        enum:
                          [validated, processing, committed, expired, failed]
                      file_name: { type: string }
                      row_count: { type: integer }
                      created_count: { type: integer }
                      skipped_count: { type: integer }
                      error_count: { type: integer }
                      expires_at: { type: string, format: date-time }
                      created_at: { type: string, format: date-time }
                      committed_at:
                        type: string
                        format: date-time
                        nullable: true
                  will_create_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  result:
                    type: object
                    nullable: true
        "404":
          description: Import job not found

  /admin/bulk-import/{jobId}/commit:
    post:
      tags: [Bulk Import]
      summary: Commit a validated bulk import job — creates clients for `will_create` rows
      description: |
        Requires the job to belong to the requesting admin, be unexpired, and
        have `status = validated` (claimed atomically to `processing`). Rows
        already marked `skipped`/`error` during validation are not retried;
        `will_create` rows are re-checked for email conflicts before insert.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send_welcome_emails:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  created_count:
                    type: integer
                  skipped_count:
                    type: integer
                  error_count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        row_number: { type: integer }
                        status:
                          { type: string, enum: [created, skipped, error] }
                        client_id: { type: integer }
                        message: { type: string }
                        external_ref: { type: string, nullable: true }
        "403":
          description: Bulk CSV import is disabled
        "404":
          description: Import job not found
        "409":
          description: Job is not in a committable state (already processing/committed)
        "410":
          description: Job has expired

  /admin/crc/status:
    get:
      tags: [CRC]
      summary: Check CRC API configuration status
      security:
        - BearerAuth: []
      responses:
        "200":
          description: CRC configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  dry_run:
                    type: boolean
                  mode:
                    type: string
                    enum: [disabled, dry_run, live]

  /admin/crc/preview/{id}:
    get:
      tags: [CRC]
      summary: Preview the XML payload that would be sent for a client (no actual call)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Preview payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [insertRecord, updateRecord]
                  endpoint:
                    type: string
                  crc_client_id:
                    type: string
                    nullable: true
                  crc_synced_at:
                    type: string
                    nullable: true
                  xmlData:
                    type: string
                  note:
                    type: string
        "404":
          description: Client not found

  /admin/crc/simulate-webhook:
    post:
      tags: [CRC]
      summary: Simulate a Zapier stage-change webhook (for local testing)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                clientId:
                  type: integer
                email:
                  type: string
                  format: email
                stage:
                  type: string
                  example: "Round 2 (Month 2)"
      responses:
        "200":
          description: Webhook simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulated:
                    type: boolean
                  webhook_response:
                    type: object

  /admin/clients/{clientId}/round-reports/{round}/pdf:
    post:
      tags: [Admin]
      summary: "[Deprecated] Manual PDF upload — use OFG Report Wizard instead"
      description: |
        **Returns 410 Gone.** Manual PDF uploads bypass compliance checks.
        Use `POST /admin/cases/{caseId}/report-wizard/sessions` to generate OFG progress reports.
      deprecated: true
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
        - in: path
          name: round
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf]
              properties:
                pdf:
                  type: string
                  format: binary
                  description: The PDF file to upload
      responses:
        "410":
          description: Deprecated — use OFG Report Wizard
        "401":
          description: Unauthorized

  /admin/round-reports/{reportId}/pdf:
    get:
      tags: [Admin]
      summary: Serve (decrypt & stream) a round report PDF for admin preview/download
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: PDF not found

  /portal/round-reports/{round}/pdf:
    get:
      tags: [Portal]
      summary: Serve a round report PDF to the authenticated client (download)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: round
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: PDF not found for this round

  /admin/round-report-pdfs/{pdfId}:
    get:
      tags: [Admin]
      summary: Serve (decrypt & stream) a specific round report PDF (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: pdfId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: PDF not found
    delete:
      tags: [Admin]
      summary: Delete a specific round report PDF
      description: Requires `super_admin` role.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: pdfId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
