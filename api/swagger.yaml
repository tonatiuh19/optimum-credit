              properties:
                text_language: { type: string, enum: [en, es] }
                client_goal: { type: string }
                notes: { type: string }
                email_opt_in: { type: boolean }
                report_file: { type: string, format: binary }
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAnalysisResult"

  /portal/credit-analysis:
    get:
      tags: [Portal, Credit Analysis]
      summary: Latest credit analysis for logged-in prospect
      description: >-
        Prospects always allowed. Enrolled clients may GET their latest stored
        pre-sale analysis (read-only); returns 403 prospect_only when none exists.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Latest analysis or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/CreditAnalysisResult"
        "403":
          description: Not a prospect (prospect_only)
        "400":
          description: Missing report_file or invalid client
    post:
      tags: [Portal, Credit Analysis]
      summary: Run free credit analysis (prospect portal, multipart)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [report_file]
              properties:
                text_language: { type: string, enum: [en, es] }
                client_goal: { type: string }
                notes: { type: string }
                email_opt_in: { type: boolean }
                report_file: { type: string, format: binary }
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAnalysisResult"
        "403":
          description: Not a prospect (prospect_only)
        "400":
          description: Missing report_file or invalid client

  /public/prospect-lead:
    post:
      tags: [Credit Analysis]
      summary: Lightweight lead capture → prospect (no file, public, no auth)
      description: |
        Used by the homepage "Get my free analysis" mini-form. Creates a
        `status=prospect` client (or reuses an existing prospect) and attaches
        `source_label` (defaults to `web_analysis`). When `lead_source` is
        `get_started`, also attaches the `get_started_wizard` source label.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one). If it
        resolves to an active/invited affiliate, `clients.affiliate_id` is
        set (never overwritten if already attributed) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                source_label: { type: string, default: web_analysis }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                notes: { type: string }
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
      responses:
        "200":
          description: Lead captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  client_id: { type: integer }
        "400":
          description: Missing/invalid fields

  /public/get-credit-report-lead:
    post:
      tags: [Credit Analysis]
      summary: Free-report prospect capture → pipeline + email/SMS (public)
      description: |
        Used by `/get-credit-report`. Creates or updates a prospect (match email
        or phone), attaches `get_credit_report` plus event labels only on
        2026-09-14 (`golf_tournament_prospect`) / 2026-09-15 (`las_vegas_event`)
        America/Los_Angeles. Sends branded email with direct MFSN CTA and SMS
        with short `https://www.ofgllc.com/go/free-score`. Also fans out team
        alert `get_credit_report_lead` via Settings → Team notifications
        (email / in-app / SMS per admin prefs; SMS From = each admin’s assigned
        OFG staff number). Unassigned (`assigned_admin_id` null). Prospect SMS
        From = César OFG (`+19496740714`) or `GET_CREDIT_REPORT_SMS_FROM_E164`.
        When system setting `get_credit_report_free_report_enabled` = `0`
        (Settings → admin switch) the free report is off: the email/SMS are a
        registration confirmation with no link, `free_report` is false and
        `mfsn_url` / `short_url` are null. `/go/free-score` keeps working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, phone]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                preferred_language: { type: string, enum: [en, es] }
                hear_about: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Prospect captured; notify attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  client_id: { type: integer }
                  free_report: { type: boolean }
                  mfsn_url: { type: string, nullable: true }
                  short_url: { type: string, nullable: true }
                  event_kind:
                    type: string
                    nullable: true
                    enum: [golf, vegas, null]
                  labels:
                    type: array
                    items: { type: string }
                  email_sent: { type: boolean }
                  sms_sent: { type: boolean }
        "400":
          description: Missing/invalid fields
        "429":
          description: Rate limited

