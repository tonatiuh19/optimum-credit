        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled

  /admin/info-requests/{id}/files/{fileId}:
    get:
      tags: [Admin]
      summary: Download encrypted upload from an info request
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: fileId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: File bytes

  /admin/documents/{id}/file:
    get:
      tags: [Admin]
      summary: Download decrypted document file (admin)
      security:
        - BearerAuth: []
      description: |
        Reads the encrypted file from disk, decrypts it with AES-256-GCM using
        the stored `enc_iv` and `enc_tag`, and streams the raw file bytes back
        with the original `Content-Type`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      responses:
        "200":
          description: Decrypted file bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized (admin only)
        "404":
          description: Document not found
        "500":
          description: Decryption failed

  /admin/documents/{id}/review:
    post:
      tags: [Admin]
      summary: Approve or reject a document (super admin)
      security:
        - BearerAuth: []
      description: |
        Approves or rejects a client document. On rejection, sends an email and
        SMS to the client with the rejection reason. When all 4 required documents
        are approved for the first time, the client is auto-advanced to `docs_ready`
        and a "documents verified" email + SMS is sent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: string
                  description: Required when decision is "rejected"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  auto_advanced:
                    type: boolean
                    description: True if client was auto-advanced to docs_ready
        "400":
          description: Missing or invalid decision / reason
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /admin/pipeline:
    get:
      tags: [Admin]
      summary: Get all active credit repair cases + prospects for the pipeline Kanban board
      description: |
        `prospects` (status='prospect' clients with no case yet — 1C) are
        returned separately from `cases` since the pipeline board renders
        them as a distinct lane; dragging a prospect card is only valid
        prospect → new_client, which should call `/admin/prospects/{id}/convert`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pipeline cases + prospects
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditRepairCase"
                  prospects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Prospect"
        "401":
          description: Unauthorized

  /admin/labels:
    get:
      tags: [Admin]
      summary: List labels (source + analysis layers)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: layer
          schema: { type: string, enum: [source, analysis] }
          description: Optional filter by label layer
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "401":
          description: Unauthorized

  /admin/clients/{id}/labels:
    post:
      tags: [Admin]
      summary: Add/remove labels on a client (merge, by slug)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items: { type: string }
                  description: Label slugs to attach
                remove:
                  type: array
                  items: { type: string }
                  description: Label slugs to remove
      responses:
        "200":
          description: Client's updated labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "404":
          description: Client not found

  /admin/prospects:
    get:
      tags: [Admin]
      summary: List prospects (status='prospect' clients)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Prospects
          content:
            application/json:
              schema:
                type: object
                properties:
                  prospects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Prospect"
        "401":
          description: Unauthorized

  /admin/prospects/{id}/convert:
    post:
      tags: [Admin]
      summary: Convert a prospect into a client + case (5A/7A)
      description: |
        Sets `status=onboarding`, `pipeline_stage=new_client`, creates a
        `credit_repair_cases` row, runs `autoAssignTasksForCase`, and sends
        the dedicated prospect-welcome email (NOT the payment_confirmed flow —
        no payment was ever taken).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: { type: integer, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      case_number: { type: string }
        "404":
          description: Prospect not found
        "409":
          description: Client is not a prospect

  /admin/reminder-flows:
    get:
      tags: [Admin]
      summary: List all reminder flows with step counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reminder flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  flows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReminderFlow"
    post:
      tags: [Admin]
      summary: Create a reminder flow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_event]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                trigger_event:
                  type: string
                  enum:
                    [
                      payment_confirmed,
                      docs_ready,
                      round_1_complete,
                      round_2_complete,
                      round_3_complete,
                      round_4_complete,
                      round_5_complete,
                      completed,
                    ]
                required_label_slugs:
                  type: array
                  nullable: true
                  items: { type: string }
                  description: |
                    Optional label gate — when set, the flow only fires for
                    clients that currently have ALL listed label slugs
                    attached (see `client_labels`).
      responses:
        "201":
          description: Flow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow:
                    $ref: "#/components/schemas/ReminderFlow"
        "400":
          description: Missing/invalid fields

  /admin/reminder-flows/{id}:
    get:
      tags: [Admin]
      summary: Get a single reminder flow with its steps + recent executions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Flow detail
        "404":
          description: Not found
    put:
      tags: [Admin]
      summary: Update a reminder flow
      description: |
        Partial update — only fields present in the body are changed.
        `required_label_slugs` replaces the full label-gate list (send `null`
        or `[]` to clear it and run the flow unconditionally).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                is_active: { type: boolean }
                required_label_slugs:
                  type: array
                  nullable: true
                  items: { type: string }
                  description: Optional label gate — flow only fires when client has ALL listed label slugs
      responses:
        "200":
          description: Flow updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow:
                    $ref: "#/components/schemas/ReminderFlow"

  /admin/reminder-flows/{id}/trigger:
    post:
      tags: [Admin]
      summary: Manually run a reminder flow for a client
      description: |
        Fires the flow's email/alert steps using the selected client's merge
        fields. Set `deliver_to_admin: true` to send emails to the authenticated
        admin instead (sandbox) — subjects are prefixed with `[TEST]` and the
        10-minute idempotency guard is skipped.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
                deliver_to_admin:
                  type: boolean
                  description: When true, emails go to the admin session email
      responses:
        "200":
          description: Flow triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sandbox: { type: boolean }
                  delivered_to: { type: string }
        "400":
          description: Missing client_id or admin email
        "404":
          description: Flow not found

  /admin/admins:
    get:
      tags: [Admin]
      summary: List admin team members
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admins list
        "401":
          description: Unauthorized
    post:
      tags: [Admin]
      summary: Create admin team member (super_admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Created
        "409":
          description: Email already exists
        "403":
          description: Forbidden

  /admin/admins/{id}/resend-welcome:
    post:
      tags: [Admin]
      summary: Resend team welcome email (super_admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email sent
        "404":
          description: Admin not found

  /admin/task-templates:
    get:
      tags: [Admin]
      summary: List onboarding task templates with optional search and filters
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Full-text search across title_en, title_es, slug, description_en
        - in: query
          name: type
          schema:
            type: string
            enum: [all, form, upload, sign_document]
          description: Filter by task type
        - in: query
          name: active
          schema:
            type: string
            enum: [all, active, inactive]
          description: Filter by active status
      responses:
        "200":
          description: Filtered list of task templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnboardingTaskTemplate"
        "401":
          description: Unauthorized
    post:
      tags: [Admin]
      summary: Create a new onboarding task template
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTemplatePayload"
      responses:
        "201":
          description: Task template created
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /admin/task-templates/{id}:
    put:
      tags: [Admin]
      summary: Update an existing task template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTemplatePayload"
      responses:
        "200":
          description: Updated task template
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      tags: [Admin]
      summary: Delete a task template (blocked if system task or has completions)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "400":
          description: Cannot delete (system task or has completions)
        "401":
          description: Unauthorized

  /admin/cases/{id}:
    get:
      tags: [Admin]
      summary: Get full detail for a single credit repair case
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_info:
                    type: object
                    properties:
                      id:
                        type: integer
                      case_number:
                        type: string
                        example: CR-00001
                      status:
                        type: string
                        enum: [active, completed, cancelled, on_hold]
                      pipeline_stage:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                  client:
                    $ref: "#/components/schemas/AdminClientDetail"
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDocument"
                  reports:
                    type: array
                    items:
                      type: object
                  payments:
                    type: array
                    items:
                      type: object
                  pipeline_history:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found

  /admin/cases/{id}/stage:
    post:
      tags: [Admin]
      summary: Move a credit repair case to a new pipeline stage
      description: |
        `prospect` is intentionally excluded from the `stage` enum — cases are
        only ever created at `new_client` via `/admin/prospects/{id}/convert`
        (1C), so a case can never move to/from `prospect`. Entering
        `docs_ready` fires the `docs_ready` reminder flow.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Credit repair case ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum:
                    [
                      new_client,
                      docs_ready,
                      round_1,
                      round_2,
                      round_3,
                      round_4,
                      round_5,
                      completed,
                      cancelled,
                    ]
                notes:
                  type: string
      responses:
        "200":
          description: Stage updated (or unchanged if same stage)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unchanged:
                    type: boolean
                    description: True when the requested stage equals the current stage
        "400":
          description: Invalid stage value or case ID
        "401":
          description: Unauthorized
        "404":
          description: Case not found
        "422":
          description: Stage transition blocked (e.g. docs_ready requires all docs approved)

  /admin/clients:
    get:
      tags: [Admin]
      summary: List clients
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: stage
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: labels
          schema:
            type: string
          description: >-
            Comma-separated label slugs (e.g. `collections,housing`) — returns
            clients with ANY matching label. `label` (singular) also accepted.
      responses:
        "200":
          description: List of clients (each includes a `labels` array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminClientListItem"
    post:
      tags: [Admin]
      summary: Create a new client
      description: >-
        Affiliate-role callers (`getAffiliateScope`) are always stamped
        `status='prospect'`, `pipeline_stage='prospect'`, and their own
        `affiliate_id` — `package_id`, `status`, and `admin_notes` inputs are
        ignored, no welcome email is sent, and the client is auto-tagged with
        the `affiliate_referral` label. Requires an active/comped affiliate
        subscription (403 `affiliate_subscription_required` otherwise).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [pending_payment, onboarding, active, paused, cancelled]
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "409":
          description: Email already exists

  /admin/clients/{id}:
    put:
      tags: [Admin]
      summary: Update a client
      description: >-
        Affiliates may only update `first_name`, `last_name`, `email`, and
        `phone` on clients within their own referral scope — `package_id`,
        `status`, and `admin_notes` are silently ignored for affiliate
        callers, and out-of-scope client ids return 404.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [pending_payment, onboarding, active, paused, cancelled]
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "404":
          description: Client not found (or out of the caller's affiliate scope)
        "409":
          description: Email already exists
    delete:
      tags: [Admin]
      summary: Delete a client
      description: >-
        Affiliates may only delete their own referred leads while they are
        still `status='prospect'` — out-of-scope clients return 404, and
        already-converted clients return 403.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Affiliate subscription required, or client is past the prospect stage
        "404":
          description: Client not found (or out of the caller's affiliate scope)

  /admin/bulk-import/templates/clients.csv:
    get:
      tags: [Bulk Import]
      summary: Download the clients CSV import template
      security:
        - BearerAuth: []
      responses:
        "200":
          description: CSV file with headers + one sample row
          content:
            text/csv:
              schema:
                type: string

  /admin/bulk-import/validate:
    post:
      tags: [Bulk Import]
      summary: Upload + validate a bulk import CSV (stages a review job, no DB writes yet)
      description: |
        Parses and validates the uploaded CSV (max 500 rows, 5MB), resolves
        `package_slug` to `package_id`, and flags rows whose email already
        exists in `clients`. The result is staged as a `bulk_import_jobs` row
        (`status = validated`, TTL 1 hour) that must be reviewed and then
        committed via `POST /admin/bulk-import/{jobId}/commit`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                entity:
                  type: string
                  enum: [clients]
                  default: clients
      responses:
        "200":
          description: Validation summary + row-level preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  row_count:
                    type: integer
                  will_create_count:
                    type: integer
                  skipped_count:
                    type: integer
                  error_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  breakdown:
                    type: object
                    properties:
                      will_create: { type: integer }
                      skipped: { type: integer }
                      error: { type: integer }
        "400":
          description: Missing/invalid file, unknown or forbidden columns, too many rows
        "403":
          description: Bulk CSV import is disabled (see BULK_CSV_IMPORT_ENABLED)

  /admin/bulk-import/{jobId}:
    get:
      tags: [Bulk Import]
      summary: Get a staged/committed bulk import job (status, preview, result)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      id: { type: integer }
                      entity: { type: string, enum: [clients] }
                      status:
                        type: string
                        enum:
                          [validated, processing, committed, expired, failed]
                      file_name: { type: string }
                      row_count: { type: integer }
                      created_count: { type: integer }
                      skipped_count: { type: integer }
                      error_count: { type: integer }
                      expires_at: { type: string, format: date-time }
                      created_at: { type: string, format: date-time }
                      committed_at:
                        type: string
                        format: date-time
                        nullable: true
                  will_create_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  result:
                    type: object
                    nullable: true
        "404":
          description: Import job not found

  /admin/bulk-import/{jobId}/commit:
    post:
      tags: [Bulk Import]
      summary: Commit a validated bulk import job — creates clients for `will_create` rows
      description: |
        Requires the job to belong to the requesting admin, be unexpired, and
        have `status = validated` (claimed atomically to `processing`). Rows
        already marked `skipped`/`error` during validation are not retried;
        `will_create` rows are re-checked for email conflicts before insert.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send_welcome_emails:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  created_count:
                    type: integer
                  skipped_count:
