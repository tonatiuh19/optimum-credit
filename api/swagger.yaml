      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Flow detail
        "404":
          description: Not found
    put:
      tags: [Admin]
      summary: Update a reminder flow
      description: |
        Partial update — only fields present in the body are changed.
        `required_label_slugs` replaces the full label-gate list (send `null`
        or `[]` to clear it and run the flow unconditionally).
      security:
        - BearerAuth: []
      parameters:
