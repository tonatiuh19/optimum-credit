                      $ref: "#/components/schemas/ReminderFlow"
    post:
      tags: [Admin]
      summary: Create a reminder flow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_event]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                trigger_event:
                  type: string
                  enum:
                    [
                      payment_confirmed,
                      docs_ready,
                      round_1_complete,
                      round_2_complete,
                      round_3_complete,
                      round_4_complete,
                      round_5_complete,
                      round_extended_complete,
                      completed,
                      payment_due,
                      event_registered,
                    ]
                required_label_slugs:
                  type: array
                  nullable: true
                  items: { type: string }
                  description: |
                    Optional label gate — when set, the flow only fires for
                    clients that currently have ALL listed label slugs
                    attached (see `client_labels`).
      responses:
        "201":
          description: Flow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow:
                    $ref: "#/components/schemas/ReminderFlow"
        "400":
          description: Missing/invalid fields

  /admin/reminder-flows/{id}:
