  /pay/{token}:
    get:
      tags: [Public]
      summary: Get public split payment info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Split payment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  split_id:
                    type: integer
                  case_number:
                    type: string
                    nullable: true
                  label:
                    type: string
                  amount_cents:
                    type: integer
                  due_date:
                    type: string
                    format: date
                  status:
                    type: string
                  client_first_name:
                    type: string
                    nullable: true
                  has_stored_card:
                    type: boolean
        "404":
          description: Token not found or expired
    post:
      tags: [Public]
      summary: Process a split payment via token
      description: |
        Reserves the split under a row lock (status → `processing`) and records a
        provisional `pending` payment before charging, so two concurrent submissions
        (e.g. a double-click or a retried request) can't both succeed against the
        same split. If the split is already reserved/paid, returns `409`. Rate-limited
        per token.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [stored_profile, new_card]
                data_descriptor:
                  type: string
                  description: Accept.js nonce descriptor (new_card only)
                data_value:
                  type: string
                  description: Accept.js nonce value (new_card only)
      responses:
        "200":
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  transaction_id:
                    type: string
        "400":
          description: Invalid payment or split already paid
        "402":
          description: Card was declined by the payment processor
        "404":
          description: Token not found
        "409":
          description: This split is already being processed by another request
        "429":
          description: Too many attempts — rate limited
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreditRepairCase:
      type: object
      properties:
        id:
          type: integer
          description: credit_repair_cases.id
        case_number:
          type: string
          example: CR-00001
        client_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        package_id:
          type: integer
          nullable: true
        package_name:
          type: string
          nullable: true
        package_slug:
          type: string
          nullable: true
        crc_client_id:
          type: string
          nullable: true
        crc_synced_at:
          type: string
          format: date-time
          nullable: true
        pipeline_stage:
          type: string
          enum:
            [
              prospect,
              new_client,
              docs_ready,
              round_1,
              round_2,
              round_3,
              round_4,
              round_5,
              completed,
              cancelled,
            ]
        pipeline_stage_changed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, completed, cancelled, on_hold]
          description: Case status (distinct from client status)
        client_status:
          type: string
          description: Client account status
        created_at:
          type: string
          format: date-time
        docs_total:
          type: integer
        docs_approved:
          type: integer
        docs_pending:
          type: integer
        docs_rejected:
          type: integer
        labels:
          type: array
          description: Source + analysis labels attached to the case's client
          items:
            $ref: "#/components/schemas/Label"

    AdminClientListItem:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        pipeline_stage:
          type: string
          enum:
            [
              prospect,
              new_client,
              docs_ready,
              round_1,
              round_2,
              round_3,
              round_4,
              round_5,
              completed,
              cancelled,
            ]
        status:
          type: string
          enum:
            [prospect, pending_payment, onboarding, active, paused, cancelled]
        package_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"

    Label:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string, example: web_analysis }
        name_en: { type: string }
        name_es: { type: string }
        layer: { type: string, enum: [source, analysis] }
        color: { type: string }
        sort_order: { type: integer }

    ReminderFlow:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        trigger_event:
          type: string
          enum:
            [
              payment_confirmed,
              docs_ready,
              round_1_complete,
              round_2_complete,
              round_3_complete,
              round_4_complete,
              round_5_complete,
              completed,
            ]
        is_active: { type: boolean }
        required_label_slugs:
          type: array
          nullable: true
          items: { type: string }
          description: |
            Optional label gate — when set, the flow only fires for clients
            that currently have ALL listed label slugs attached. Null/empty
            means the flow always fires for the trigger_event.
        step_count:
          type: integer
          description: Only present on the list endpoint
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Prospect:
      type: object
      description: A clients row with status/pipeline_stage='prospect' — no case yet (1C).
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        source_label: { type: string, nullable: true }
        preferred_language: { type: string, enum: [en, es], nullable: true }
        client_goal: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        agent_phone: { type: string, nullable: true }
        rep_name: { type: string, nullable: true }
        credit_analysis_id: { type: integer, nullable: true }
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        created_at: { type: string, format: date-time }

    CreditAnalysisResult:
      type: object
      properties:
        id: { type: integer }
        client_id: { type: integer }
        mode: { type: string, enum: [client, agent] }
        scores:
          type: object
          nullable: true
          properties:
            transunion: { type: integer, nullable: true }
            experian: { type: integer, nullable: true }
            equifax: { type: integer, nullable: true }
        negatives:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              creditor: { type: string }
              bureaus: { type: array, items: { type: string } }
              detail: { type: string }
        suggested_labels:
          type: array
          items: { type: string }
        analysis_html: { type: string }
        analysis_text: { type: string, nullable: true }
        email_sent: { type: boolean }
        generated_at: { type: string, format: date-time }
        extraction_status:
          type: string
          enum: [ok, empty, parse_failed, unsupported_type]
          description: |
            How well we were able to read text out of the uploaded report.
            Anything other than `ok` means scores/negatives may be incomplete
            or absent — `analysis_html`/`analysis_text` will say so honestly
            instead of implying no negative items were found.
        chars_extracted:
          type: integer
          nullable: true
          description: Trimmed character count of extracted text (0 for unsupported/failed files)
        analyst:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Flat Optimum analyst JSON (no nested objects/arrays). Includes
            bureau labels, lending conversion (`fha_status`, `goal_score`,
            `mortgage_*`), neg_1..5, util_1..3, timeline, dispute rounds,
            file-strength labels, action_1..6, HTML table fragments, and
            `client_text_message`. HTML fragments use brand navy `#121829`
            and gold `#C0A06A`.

    BulkImportPreviewRow:
      type: object
      properties:
        row_number:
          type: integer
        status:
          type: string
          enum: [will_create, skipped, error]
        message:
          type: string
        external_ref:
          type: string
          nullable: true
        display_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        badge:
          type: string
          nullable: true
        conflict_entity_id:
          type: integer
          nullable: true

    ClientDocument:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        doc_type:
          type: string
          enum: [id_front, id_back, ssn_card, proof_of_address, other]
        file_name:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        storage_provider:
          type: string
          enum: [local, s3, r2]
        encrypted:
          type: integer
          enum: [0, 1]
        review_status:
          type: string
          enum: [pending, approved, rejected]
        rejection_reason:
          type: string
          nullable: true
        uploaded_at:
          type: string
          format: date-time

    CrcSyncLogEntry:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        action:
          type: string
          enum: [push_create, push_update, pull, webhook_stage_update]
        crc_client_id:
          type: string
          nullable: true
        pipeline_stage:
          type: string
          nullable: true
        status:
          type: string
          enum: [success, error]
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TradelineProduct:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        details: { type: string }
        price_cents: { type: integer }
        compare_price_cents: { type: integer, nullable: true }
        is_active: { type: boolean }
        sort_order: { type: integer }

    SupportFaqPortal:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        category:
          type: string
          enum: [billing, documents, process, technical, general]
        sort_order:
          type: integer

    SupportFaq:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        category:
          type: string
          enum: [billing, documents, process, technical, general]
        sort_order:
          type: integer
        is_active:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── OFG Report Wizard ────────────────────────────────────────────────────────

    ReportWizardDraftSummary:
      type: object
      properties:
        id:
          type: integer
        case_id:
          type: integer
        client_id:
          type: integer
        round_number:
          type: integer
        status:
          type: string
          enum: [draft, extracting, review, generating, published, failed]
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Payment Splits ───────────────────────────────────────────────────────────

    PaymentSplit:
      type: object
      properties:
        id:
          type: integer
        case_id:
          type: integer
        label:
          type: string
        amount_cents:
          type: integer
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, paid, cancelled]
        completion_source:
          type: string
          enum: [authorize_link, manual]
          nullable: true
        notes:
          type: string
          nullable: true
        payment_link:
          type: string
          nullable: true
        case_number:
          type: string
          nullable: true
        client_first_name:
          type: string
          nullable: true
        client_last_name:
          type: string
          nullable: true

    CreateSplitPayload:
      type: object
      required: [label, amount_cents, due_date, send_payment_link]
      properties:
        label:
          type: string
        amount_cents:
          type: integer
        due_date:
          type: string
          format: date
        send_payment_link:
          type: boolean
        reminder_flow_id:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        mark_as_paid:
          type: boolean
          description: >
            When true, creates the split already marked paid (manual).
            Skips payment link generation and reminder scheduling.
