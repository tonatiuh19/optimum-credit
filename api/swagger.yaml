  /registration/confirm-mock:
    post:
      tags: [Registration]
      summary: Confirm a sandbox mock payment (dev only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, transactionId]
              properties:
                clientId: { type: integer }
                transactionId:
                  type: string
                  description: The mockTransactionId returned by /registration
      responses:
        "200":
          description: Mock payment confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid or non-mock transaction ID

  /auth/onboarding/{token}:
    summary: Redeem magic-link onboarding token
    description: |
      Validates a single-use onboarding token embedded in the welcome email.
      On success, creates a client session and returns a bearer token.
      Tokens expire after 72 hours and are single-use (`consumed_at` is set).
    parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
        description: Raw 64-character hex onboarding token from the welcome email link
    responses:
      "200":
        description: Token valid — session created
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Bearer session token for subsequent requests
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
      "400":
        description: Token expired or already used
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: Link expired or already used

  /auth/client/request-otp:
    post:
      tags: [Auth]
      summary: Request a one-time login code (client)
      description: |
        Sends a login OTP when a client account exists for the email.
        Returns `404 ACCOUNT_NOT_FOUND` when no account matches so the UI can
        show a clear message. Rate-limited per IP+email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "404":
          description: No account for that email (`code: ACCOUNT_NOT_FOUND`)
        "429":
          description: Too many requests — rate limited

  /auth/client/verify-otp:
    post:
      tags: [Auth]
      summary: Verify a one-time login code and start a client session
      description: |
        A code allows at most 5 incorrect attempts before it's invalidated. Rate-limited
        per IP+email in addition to the attempt cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
        "400":
          description: Invalid or expired code
        "429":
          description: Too many attempts — rate limited

  /admin/ai/status:
    get:
      tags: [Admin]
      summary: Admin AI Ask feature status
      description: |
        Gated by `ADMIN_AI_ENABLED` (off by default). UI visibility also requires
        role `super_admin` or `admin`. `configured` reflects whether
        `ANTHROPIC_API_KEY` is set (billing is on the Anthropic account).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  role_allowed: { type: boolean }
                  configured: { type: boolean }
        "403":
          description: Affiliate role denied

  /admin/ai/chat:
    post:
      tags: [Admin]
      summary: Admin AI Ask chat turn
      description: |
        Requires `ADMIN_AI_ENABLED=1` and role `super_admin` or `admin`.
        Uses Anthropic Messages with curated tools (read + guided writes):
        `search_clients`, `search_referrers`, `search_admins`, `get_case`, `pipeline_summary`, `list_progress_reports`,
        `get_progress_report`, `search_work_tasks`, `get_client`,
        `list_case_documents`, `list_payments`, `list_installments`,
        `list_clients_owing`, `list_round_schedule`, plus write tools
        `create_prospect`, `create_work_task`, `update_work_task`, `add_case_note`, `upload_case_document`, `send_email`,
        `send_round_report` (resend published Round PDF with secure download token + branded email + optional SMS),
        `send_sms`, `send_text`, `send_whatsapp`, `send_wa`, `send_contact_sms`, `send_contact_whatsapp`, `send_contact_email`,
        `list_sms`, `list_whatsapp`, `get_texts`, `get_conversation`, `list_ofg_phone_numbers`,
        `update_pipeline_stage`, `preview_convert_prospect`, `convert_prospect`
        (unconverted leads without an enrolled case), `update_client_status`
        (MCP blocks pending_payment/onboarding/active until enrolled),
        `upsert_progress_report` (staff notes only; requires score_before/score_after;
        published PDF overwrite returns crm_required unless replace_published),
        `set_case_payment_plan` (discounted Zelle/cash OFG balance; not coupon codes),
        `upsert_payment_splits`, `update_payment_split`,
        `list_coupons`, `create_coupon` (checkout promo codes for /register)
        (dry-run then confirm=true; `create_work_task` / `update_work_task` assign named staff via
        `assignee_admin_id` / `assignee_name` from `search_admins`, else language owner on create;
        `create_prospect` / `create_contact` / `convert_contact` / `update_client` use
        `assigned_admin_*` the same way; `create_prospect` returns `existing:true`
        (never inserts) on phone/email match and rejects placeholder phones;
        `convert_contact` links to an existing client on match instead of creating a twin;
        OFG-only unless
        `push_hubspot=true`; `send_email` emails a client, referrer, or staff (`to_admin_*`)
        + logs a note; `send_contact_sms`/`send_contact_email` message CRM Contacts by contact_id + log contacts.admin_notes;
        `send_round_report` mints `/api/public/round-report-pdf/:token`
        and sends the Round-complete template + optional twin SMS; `send_sms`/`send_text` texts via Twilio
        (`from_admin_*` / `from_phone_number_id` override the MCP-connected From line) into
        Conversations + case note and returns message/SID/status for HubSpot; `send_whatsapp`/`send_wa`/
        `send_contact_whatsapp` send 360dialog WhatsApp (César assignee; session-window text) into
        Conversations channel=whatsapp; `list_whatsapp` filters that channel; inbound SMS
        auto-logs to the client file; `list_ofg_phone_numbers` lists active OFG numbers).
        Audits every turn to `admin_ai_audit_logs`. `admin` role is rate-limited (~30/hour);
        `super_admin` is not. Tool loop is capped (4 rounds / ~50s wall) to
        fit the API `maxDuration` (60s). When a write cannot be completed via MCP
        (e.g. file too large), tools return `crm_required` with `user_message` +
        `crm_href` — the assistant must tell staff to finish in CRM and not retry MCP.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                context:
                  type: object
                  properties:
                    case_id: { type: integer, nullable: true }
                    case_number: { type: string, nullable: true }
                    client_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        href: { type: string }
                        label: { type: string }
                  tools_used:
                    type: array
                    items: { type: string }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      input_tokens: { type: integer }
                      output_tokens: { type: integer }
        "400":
          description: Invalid messages
        "403":
          description: Role not allowed / affiliate denied
        "404":
          description: Feature flag off
        "429":
          description: Rate limited (admin role)
        "502":
          description: AI provider error (`ai_provider_error`)
        "503":
          description: |
            Ask unavailable — `ai_not_provisioned` (missing key), `ai_billing`
            (Anthropic credits), or `ai_model_config` (retired/invalid model ID)

  /admin/ai/tools:
    get:
      tags: [Admin]
      summary: List Admin AI curated tools (MCP)
      description: |
        Same feature gate as Ask chat. Auth: admin session Bearer **or**
        `ADMIN_AI_MCP_TOKEN` (scoped to `ADMIN_AI_MCP_ADMIN_ID`).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tool definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        input_schema: { type: object }
                        annotations:
                          type: object
                          description: |
                            MCP tool annotations (source of truth for the stdio proxy).
                            Send tools (SMS / WhatsApp / email) are `destructiveHint: true`,
                            `readOnlyHint: false` so MCP clients ask the user before running.
                          properties:
                            title: { type: string }
                            readOnlyHint: { type: boolean }
                            destructiveHint: { type: boolean }
                            idempotentHint: { type: boolean }
                            openWorldHint: { type: boolean }
                  instructions:
                    type: string
                    description: MCP server instructions (tool data is untrusted; two-step confirm for writes).
        "403":
          description: Role not allowed / affiliate denied
        "404":
          description: Feature flag off

  /admin/ai/tools/{name}:
    post:
      tags: [Admin]
      summary: Execute one Admin AI curated tool (MCP)
      description: |
        Runs `executeAdminAiTool` for a named allowlisted tool. Audits to
        `admin_ai_audit_logs` with question prefix `[mcp/tool]` (file contents such as
        `file_base64` / `attachment_base64` / data: URLs are stored only as size + sha256).
        Rate-limited per admin: 120/hour (super_admin 3,000/hour). Write tools are refused
        for affiliate-scoped accounts.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              - search_clients
              - search_referrers
              - update_referrer
              - attach_referrer
              - get_case
              - pipeline_summary
              - list_funding_applications
              - get_funding_application
              - update_funding_status
              - funding_pipeline_summary
              - create_funding_application
              - convert_funding_application
              - upload_funding_document
              - list_progress_reports
              - get_progress_report
              - search_work_tasks
              - search_admins
              - get_client
              - list_case_documents
              - list_payments
              - list_installments
              - list_clients_owing
              - list_round_schedule
              - list_reports_pending_approval
              - get_scorecard
              - create_prospect
              - create_contact
              - update_contact
              - convert_contact
              - search_contacts
              - get_contact
              - create_work_task
              - update_work_task
              - add_case_note
              - upload_case_document
              - send_email
              - send_round_report
              - send_sms
              - send_text
              - send_whatsapp
              - send_wa
              - send_contact_sms
              - send_contact_whatsapp
              - send_contact_email
              - list_sms
              - list_whatsapp
              - get_texts
              - get_conversation
              - list_ofg_phone_numbers
              - update_pipeline_stage
              - preview_convert_prospect
              - convert_prospect
              - update_client_status
              - upsert_progress_report
              - set_case_payment_plan
              - upsert_payment_splits
              - update_payment_split
              - list_coupons
              - create_coupon
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tool: { type: string }
                  data: {}
        "400":
          description: Tool arg / execution error
        "403":
          description: Role not allowed / affiliate denied
        "404":
          description: Feature off or unknown tool
        "429":
          description: Rate limited

  /mcp:
    post:
      tags: [Admin]
      summary: Remote MCP (Streamable HTTP)
      description: |
        OAuth 2.1 + PKCE bearer (or legacy `ADMIN_AI_MCP_TOKEN`). Same curated
        tools as Admin Ask. Discovery via `/.well-known/oauth-protected-resource`
        and `/.well-known/oauth-authorization-server/api/mcp`. Consent at
        `/admin/mcp-consent`. DCR redirect URIs limited to known Claude/Cursor
        callbacks, loopback, or `cursor:` scheme. Tool calls are audited and
        rate-limited like `/admin/ai/tools/{name}`. `initialize` returns server
        `instructions`; send tools are annotated destructive so clients ask the user.
        `/api/mcp/oauth/token` and `/api/mcp/oauth/revoke` are rate-limited per IP
        (60 per 10 minutes → 429 `rate_limited` with `Retry-After`). Expired codes and
        tokens are purged by the daily `/api/cron/admin-morning-digest`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: JSON-RPC MCP response
        "401":
          description: |
            Missing/invalid MCP OAuth token. Header
            `WWW-Authenticate: Bearer resource_metadata="<app>/.well-known/oauth-protected-resource", scope="admin_ai.read"` (RFC 9728).
        "403":
          description: Role not allowed
        "404":
          description: ADMIN_AI_ENABLED off

  /admin/me/mcp-connections:
    get:
      tags: [Admin]
      summary: List my MCP OAuth connections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        client_id: { type: string }
                        client_name: { type: string }
                        scopes: { type: string }
                        created_at: { type: string }
                        last_used_at: { type: string, nullable: true }
                        access_expires_at: { type: string }
                        refresh_expires_at: { type: string, nullable: true }
        "403":
          description: Affiliate denied
  /admin/me/mcp-connections/{id}:
    delete:
      tags: [Admin]
      summary: Revoke an MCP OAuth connection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Revoked
        "404":
          description: Not found

  /admin/me/notification-prefs:
    get:
      tags: [Admin]
      summary: Get my notification preferences
      description: |
        Per-admin mute toggles for operational alerts (email / in-app / SMS),
        including `inbound_sms` when clients text your OFG line (in-app bell,
        email, and optional SMS alert to `admins.phone` from the assigned OFG
        From number — not a full SMS relay). Null stored prefs mean all ON.
        SMS channel requires Twilio env keys + an assigned OFG number + profile
        phone. OTP / welcome emails are never included.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Prefs + channel availability
        "403":
          description: Affiliate role denied
    put:
      tags: [Admin]
      summary: Update my notification preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: object, additionalProperties: { type: boolean } }
                in_app: { type: object, additionalProperties: { type: boolean } }
                sms: { type: object, additionalProperties: { type: boolean } }
      responses:
        "200":
          description: Updated prefs
        "403":
          description: Affiliate role denied

  /admin/me/ably-token:
    get:
      tags: [Admin]
      summary: Ably token for admin realtime (bell + Conversations when enabled)
      description: |
        Issues a TokenRequest with subscribe on `admin:{id}:notifications`.
        Adds `admin:{id}:conversations` when the admin has an assigned OFG number.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: tokenRequest
        "503":
          description: ABLY_API_KEY not configured

  /admin/me/notifications:
    get:
      tags: [Admin]
      summary: List my in-app notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Inbox + unread_count

  /admin/me/notifications/read:
    post:
      tags: [Admin]
      summary: Mark in-app notifications read
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                all: { type: boolean }
      responses:
        "200":
          description: ok + unread_count

  /admin/conversations/access:
    get:
      tags: [Admin]
      summary: Conversations access for current admin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: enabled + assigned numbers

  /admin/conversations/badge:
    get:
      tags: [Admin]
      summary: Unread SMS count for sidebar nav badge
      description: Sum of unread client + unknown threads assigned to you or on your OFG numbers.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: unread_total
        "403":
          description: No assigned OFG number

  /admin/conversations/ai-stats:
    get:
      tags: [Admin]
      summary: SMS AI performance (answered vs handed to staff)
      description: >
        Counts from inbound-AI system notes over the last N days: texts the AI answered on its own,
        texts handed to staff (by reason code), live lookups and callback tasks it created.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: ConversationsAiStats (days, answered, resolved, escalated, resolve_rate = answered / (answered + escalated), lookups, callbacks, escalated_by_reason[])
        "403":
          description: No assigned OFG number

  /admin/conversations/ably-token:
    get:
      tags: [Admin]
      summary: Ably token request for Conversations realtime (alias)
      description: Same as GET /admin/me/ably-token when Conversations access is enabled.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: tokenRequest
        "403":
          description: No assigned OFG number
        "503":
          description: ABLY_API_KEY not configured

  /admin/phone-numbers:
    get:
      tags: [Admin]
      summary: List OFG Twilio inventory numbers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: numbers[]

  /admin/phone-numbers/sync-twilio:
    post:
      tags: [Admin]
      summary: Upsert Twilio IncomingPhoneNumbers into admin_phone_numbers
      description: Super-admin only. Does not change existing assignments.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: upserted count + numbers[]
        "403":
          description: super_admin required
        "503":
          description: Twilio not configured

  /admin/phone-numbers/{id}:
    patch:
      tags: [Admin]
      summary: Assign or unassign an OFG number (admin/super_admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id: { type: integer, nullable: true }
                friendly_name: { type: string, nullable: true }
      responses:
        "200":
          description: Updated number
        "403":
          description: Forbidden

  /admin/conversations:
    get:
      tags: [Admin]
      summary: Contact-hub inbox (clients + unknown)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: view
          schema:
            type: string
            enum: [all, mine, unassigned, open, closed, unread, unknown]
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Page size (admin UI uses 25 with Show more append)
      responses:
        "200":
          description: Paginated contact hub inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "403":
          description: conversations_number_required

  /admin/conversations/contact/{kind}/{id}/timeline:
    get:
      tags: [Admin]
      summary: Unified timeline for a client or unknown contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [client, unknown] }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: contact + messages (+ threads for clients)
        "403":
          description: conversations_number_required

  /admin/conversations/send:
    post:
      tags: [Admin]
      summary: Send SMS/MMS, WhatsApp (360dialog), or internal note
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: integer }
                unknown_contact_id:
                  type: integer
                  description: Open unknown contact (one of client_id, unknown_contact_id, or contact_id)
                contact_id:
                  type: integer
                  description: CRM contact id
                channel: { type: string, enum: [sms, internal, whatsapp] }
                body: { type: string, description: Text body (SMS max 1600; WhatsApp max 4096); optional when media_url is set for SMS/MMS }
                is_internal_note: { type: boolean }
                ofg_number_id: { type: integer, description: Required for SMS; ignored for WhatsApp }
                media_url:
                  type: string
                  description: Public MMS URL from POST /admin/conversations/media/upload (SMS only)
                media_content_type: { type: string }
      responses:
        "200":
          description: Send result
        "403":
          description: conversations_number_required or WhatsApp not enabled for this account
        "409":
          description: Reserved (closed threads auto-reopen on staff send)

  /admin/conversations/start:
    post:
      tags: [Admin]
      summary: Cold outbound SMS or WhatsApp to a phone number
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, body]
              properties:
                phone: { type: string }
                body: { type: string }
                channel: { type: string, enum: [sms, internal, whatsapp], default: sms }
                ofg_number_id: { type: integer, description: Required for SMS; ignored for WhatsApp }
                media_url: { type: string }
                media_content_type: { type: string }
      responses:
        "200":
          description: "{ kind client|unknown|contact, client_id?, unknown_contact_id?, ... }"
        "409":
          description: Reserved (closed threads auto-reopen on staff send)

  /webhooks/360dialog/whatsapp:
    get:
      tags: [Webhooks]
      summary: 360dialog / Meta webhook verification (hub.challenge)
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        "200":
          description: Echo hub.challenge when WHATSAPP_360DIALOG_ENABLED + verify token match
        "403":
          description: Forbidden
        "503":
          description: WhatsApp disabled
    post:
      tags: [Webhooks]
      summary: Inbound WhatsApp messages + delivery statuses (360dialog Cloud API)
      description: |
        Gated by WHATSAPP_360DIALOG_ENABLED + D360_API_KEY. Threads assign to
        WHATSAPP_ASSIGNED_ADMIN_ID or the admin whose profile phone is (951) 378-3429.
        Text-only outbound; inbound non-text stored as `[type]` placeholder.
      responses:
        "200":
          description: "{ ok: true, messages: N }"
        "503":
          description: WhatsApp disabled

  /admin/conversations/suggest-replies:
    post:
      tags: [Admin]
      summary: AI reply suggestions for an open conversation thread
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [client, unknown] }
                contact_id: { type: integer }
                recent_messages: { type: array }
                include_ai: { type: boolean }
      responses:
        "200":
          description: "{ ai_suggestions: [{ id, label, body }] }"

  /admin/conversations/media/upload:
    post:
      tags: [Admin]
      summary: Upload MMS media (stored for Twilio-fetchable public URL; optional DisruptingLabs archival)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "{ success, url, content_type, filename, cdn_url? }"
        "400":
          description: Unsupported type or file larger than 4MB
        "403":
          description: conversations_number_required

  /conversations/media/public/{id}:
    get:
      tags: [Public]
      summary: Serve MMS media bytes for Twilio (and timeline previews)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Binary media with Content-Type
        "404":
          description: Not found or expired

  /conversations/media:
    get:
      tags: [Admin]
      summary: Proxy Twilio/CDN MMS for timeline img/video tags
      description: |
        Same pattern as real-state `/api/sms/media`. `<img src>` cannot send
        `Authorization`, so the admin session JWT is passed as `?token=` and
        the server fetches Twilio media with Basic auth (or streams allowed CDN URLs).
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary media
        "400":
          description: Missing/invalid url (only api.twilio.com / disruptinglabs.com)
        "401":
          description: Missing or invalid token
        "503":
          description: Twilio not configured

  /admin/conversations/contact/client/{id}/assign:
    post:
      tags: [Admin]
      summary: Assign open client conversation threads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id: { type: integer, nullable: true }
      responses:
        "200":
          description: ok

  /admin/conversations/contact/client/{id}/status:
    post:
      tags: [Admin]
      summary: Set status for all threads of a client contact (close/reopen inserts a system timeline event)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, snoozed, closed, archived] }
      responses:
        "200":
          description: "{ ok, status, system_message?, contact? }"

  /admin/conversations/unknown/{id}/status:
    post:
      tags: [Admin]
      summary: Close or reopen unknown-contact SMS threads (does not dismiss the unknown lead)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: "{ ok, status, system_message?, contact? }"
        "404":
          description: Not found or not accessible

  /admin/conversations/unknown/{id}/link:
    post:
      tags: [Admin]
      summary: Link unknown contact to an existing client
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
      responses:
        "200":
          description: ok + client_id

  /admin/conversations/unknown/{id}/create-prospect:
    post:
      tags: [Admin]
      summary: Create prospect from unknown contact and link threads
      description: >-
        Hard-blocks placeholder phones and phone/email matches on existing clients
        (`409` with `existing_client_id`). There is no `confirm_duplicate` override —
        link the unknown contact to the existing client instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
                preferred_language: { type: string, enum: [en, es] }
                create_case: { type: boolean }
      responses:
        "200":
          description: "{ ok, client_id, case_id?, preferred_language }"
        "400":
