      summary: Quick-dial third parties for "Add caller" (VOICE_THREE_WAY_PRESETS)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ presets: [{ label, number }] }" }
  /voice/three-way/start:
    post:
      tags: [Conversations]
      summary: Add a third caller to the staff member's live call (Twilio Conference)
      description: >-
        Staff with an OFG line only; the call must be theirs and connected.
        Moves the call into a recorded conference (the other leg joins via
        dial-status / outbound-dial-end) and dials the third party from the
        staff member's OFG line. US/Canada numbers only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [call_sid, to]
              properties:
                call_sid: { type: string, description: Browser softphone CallSid }
                to: { type: string }
                label: { type: string, nullable: true }
      responses:
        "200": { description: "{ session_id, status: active, third_party }" }
        "400": { description: Missing call / invalid number }
        "403": { description: No OFG line, or not your call }
        "409": { description: Call not connected or already has a third caller }
        "502": { description: Twilio error }
