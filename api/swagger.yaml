  /admin/documents:
    get:
      tags: [Admin]
      summary: List uploaded client task documents (paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, approved, rejected]
        - in: query
          name: doc_type
          schema:
            type: string
          description: Onboarding task slug filter (e.g. id_front, ssn_card)
        - in: query
          name: search
          schema:
            type: string
          description: Client name, email, or filename search
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [uploaded_at, file_name, first_name, review_status, doc_type]
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        "200":
          description: Paginated document archive rows with per-status counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
                  status_counts:
                    type: object
                    properties:
                      all: { type: integer }
                      pending: { type: integer }
                      approved: { type: integer }
                      rejected: { type: integer }

  /admin/documents/{id}/file:
    get:
      tags: [Admin]
      summary: Download decrypted document file (admin)
      security:
        - BearerAuth: []
      description: |
        Reads the encrypted file from disk, decrypts it with AES-256-GCM using
        the stored `enc_iv` and `enc_tag`, and streams the raw file bytes back
        with the original `Content-Type`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      responses:
        "200":
          description: Decrypted file bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized (admin only)
        "404":
          description: Document not found
        "500":
          description: Decryption failed

  /admin/documents/{id}/review:
    post:
      tags: [Admin]
      summary: Approve or reject a document (super admin)
      security:
        - BearerAuth: []
      description: |
        Approves or rejects a client document. On rejection, sends an email and
        SMS to the client with the rejection reason. When all 4 required documents
        are approved for the first time, the client is auto-advanced to `docs_ready`
        and a "documents verified" email + SMS is sent.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: string
                  description: Required when decision is "rejected"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  auto_advanced:
                    type: boolean
                    description: True if client was auto-advanced to docs_ready
        "400":
          description: Missing or invalid decision / reason
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /admin/tickets:
    get:
      tags: [Admin]
      summary: List support tickets (paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, waiting_client, resolved, closed]
        - in: query
          name: search
          schema:
            type: string
          description: Subject or client name/email search
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated support tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /admin/pipeline:
    get:
      tags: [Admin]
      summary: Get credit repair cases + prospects for the pipeline Kanban (server-side filters + column pagination)
      description: |
        Cases and prospects on the Kanban board. Prospect cards are unconverted
        leads (`status=prospect` OR `pipeline_stage=prospect`, not cancelled,
        with no enrolled active non-prospect case) and may include `case_id` /
        `case_number` when a Prospect-stage case already exists (New Case →
        Prospect). Cases with `pipeline_stage=prospect` are excluded from
        `cases` (shown via the Prospect column). Convert prospect → new_client
        via `/admin/prospects/{id}/convert`. Search matches name, email, phone
        (including digit-stripped), case number, and numeric client id.

        Filters apply server-side so column counts stay accurate. Case-only
        filters (package, case status, tasks, info requests, non-prospect stage)
        hide the prospect column results.

        Without `column`: returns the first page of each column in `columns`
        (default `limit=20`, max 50), plus flat `cases`/`prospects` for the
        loaded pages. With `column` + `offset`: returns a single-column page
        for load-more (`column` is `prospect` or a case stage). Do not confuse
        filter `stage` with load-more `column`.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Name, email, phone (digit-stripped), case number, or client id
        - in: query
          name: language
          schema: { type: string, enum: [en, es] }
        - in: query
          name: billing
          schema:
            type: string
            enum: [overdue, split_plan, paid_full, direct_paid, no_payment]
        - in: query
          name: package_id
          schema: { type: string }
          description: Package id, or "none" for no package
        - in: query
          name: assigned_admin_id
          schema: { type: string }
          description: Admin id, or "unassigned"
        - in: query
          name: referral_category
          schema:
            type: string
            enum: [realtor_broker, one_off, affiliate_partner]
        - in: query
          name: client_status
          schema: { type: string }
        - in: query
          name: case_status
          schema: { type: string, enum: [active, completed, on_hold] }
        - in: query
          name: stage
          schema: { type: string }
          description: Filter board to this pipeline stage or "prospect"
        - in: query
          name: payment_badge
          schema: { type: string, enum: [paid, unpaid] }
        - in: query
          name: tasks
          schema:
            type: string
            enum: [incomplete, complete, pending_review, rejected]
        - in: query
          name: info_requests
          schema: { type: string, enum: [open, none] }
        - in: query
          name: has_notes
          schema: { type: string, enum: [yes, no] }
        - in: query
          name: labels
          schema: { type: string }
          description: Comma-separated label slugs (ANY match)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Page size per column (board) or for load-more
        - in: query
          name: column
          schema:
            type: string
            enum:
              [
                prospect,
                new_client,
                docs_ready,
                round_1,
                round_2,
                round_3,
                round_4,
                round_5,
                completed,
              ]
          description: When set, returns a single-column page for load-more
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Load-more offset within `column`
      responses:
        "200":
          description: Board columns or a single column page
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      limit:
                        type: integer
                      columns:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            items:
                              type: array
                              items: {}
                            total: { type: integer }
                            offset: { type: integer }
                            limit: { type: integer }
                            has_more: { type: boolean }
                      cases:
                        type: array
                        items:
                          $ref: "#/components/schemas/CreditRepairCase"
                      prospects:
                        type: array
                        items:
                          $ref: "#/components/schemas/Prospect"
                  - type: object
                    required: [column, items, total, offset, limit, has_more]
                    properties:
                      column: { type: string }
                      items:
                        type: array
                        items: {}
                      total: { type: integer }
                      offset: { type: integer }
                      limit: { type: integer }
                      has_more: { type: boolean }
        "401":
          description: Unauthorized
        "403":
          description: Affiliate without portal access

  /admin/labels:
    get:
      tags: [Admin]
      summary: List labels (source + analysis layers)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: layer
          schema: { type: string, enum: [source, analysis] }
          description: Optional filter by label layer
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "401":
          description: Unauthorized

  /admin/clients/{id}/labels:
    post:
      tags: [Admin]
      summary: Add/remove labels on a client (merge, by slug)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items: { type: string }
                  description: Label slugs to attach
                remove:
                  type: array
                  items: { type: string }
                  description: Label slugs to remove
      responses:
        "200":
          description: Client's updated labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "404":
          description: Client not found

  /admin/prospects:
    get:
      tags: [Admin]
      summary: List prospects (status='prospect' clients)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Prospects
          content:
            application/json:
              schema:
                type: object
                properties:
                  prospects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Prospect"
        "401":
          description: Unauthorized

  /admin/prospects/{id}/convert:
    post:
      tags: [Admin]
      summary: Convert a prospect into a client + case (5A/7A)
      description: |
        Sets `status=onboarding`, `pipeline_stage=new_client`. Allowed for any
        unconverted lead (no enrolled active non-prospect case), even if
        `clients.status` was set to `active` / `pending_payment` by mistake.
        Cancelled clients and already-enrolled cases return 409. If the
        prospect already has an active case at `pipeline_stage=prospect` (from
        New Case), that case is promoted to `new_client`; otherwise a new
        `credit_repair_cases` row is created. Runs `autoAssignTasksForCase`,
        sends the dedicated prospect-welcome email (portal onboarding link),
        optionally persists/sends round calendar `.ics`, and schedules the
        `payment_confirmed` reminder flow with Day-0 steps skipped (Day 2/3
        upload nudges + team alert still run — avoids duplicate/wrong
        "payment confirmed" Day-1 copy).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: { type: integer, nullable: true }
                notes: { type: string, nullable: true }
                round_schedule:
                  $ref: "#/components/schemas/RoundScheduleInput"
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      case_number: { type: string }
                  round_calendar:
                    type: object
                    nullable: true
        "404":
          description: Prospect not found
        "409":
          description: Cancelled, or already has an enrolled case

  /admin/reminder-flows:
    get:
      tags: [Admin]
      summary: List all reminder flows with step counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reminder flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  flows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReminderFlow"
    post:
      tags: [Admin]
      summary: Create a reminder flow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_event]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                trigger_event:
                  type: string
                  enum:
                    [
                      payment_confirmed,
                      docs_ready,
                      round_1_complete,
                      round_2_complete,
                      round_3_complete,
                      round_4_complete,
                      round_5_complete,
                      completed,
                    ]
                required_label_slugs:
                  type: array
                  nullable: true
                  items: { type: string }
                  description: |
                    Optional label gate — when set, the flow only fires for
                    clients that currently have ALL listed label slugs
                    attached (see `client_labels`).
      responses:
        "201":
          description: Flow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow:
                    $ref: "#/components/schemas/ReminderFlow"
        "400":
          description: Missing/invalid fields

  /admin/reminder-flows/{id}:
    get:
      tags: [Admin]
      summary: Get a single reminder flow with its steps + recent executions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Flow detail
        "404":
          description: Not found
    put:
      tags: [Admin]
      summary: Update a reminder flow
      description: |
        Partial update — only fields present in the body are changed.
        `required_label_slugs` replaces the full label-gate list (send `null`
        or `[]` to clear it and run the flow unconditionally).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                is_active: { type: boolean }
                required_label_slugs:
                  type: array
                  nullable: true
                  items: { type: string }
                  description: Optional label gate — flow only fires when client has ALL listed label slugs
      responses:
        "200":
          description: Flow updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow:
                    $ref: "#/components/schemas/ReminderFlow"

  /admin/reminder-flows/{id}/trigger:
    post:
      tags: [Admin]
      summary: Manually run a reminder flow for a client
      description: |
        Fires the flow's email/alert steps using the selected client's merge
        fields. Set `deliver_to_admin: true` to send emails to the authenticated
        admin instead (sandbox) — subjects are prefixed with `[TEST]` and the
        10-minute idempotency guard is skipped.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
                deliver_to_admin:
                  type: boolean
                  description: When true, emails go to the admin session email
      responses:
        "200":
          description: Flow triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sandbox: { type: boolean }
                  delivered_to: { type: string }
        "400":
          description: Missing client_id or admin email
        "404":
          description: Flow not found

