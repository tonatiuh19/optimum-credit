  /auth/onboarding/{token}:
    summary: Redeem magic-link onboarding token
    description: |
      Validates a single-use onboarding token embedded in the welcome email.
      On success, creates a client session and returns a bearer token.
      Tokens expire after 72 hours and are single-use (`consumed_at` is set).
    parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
        description: Raw 64-character hex onboarding token from the welcome email link
    responses:
      "200":
        description: Token valid — session created
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Bearer session token for subsequent requests
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
      "400":
        description: Token expired or already used
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: Link expired or already used

  /auth/client/request-otp:
    post:
      tags: [Auth]
      summary: Request a one-time login code (client)
      description: |
        Sends a login OTP when a client account exists for the email.
        Returns `404 ACCOUNT_NOT_FOUND` when no account matches so the UI can
        show a clear message. Rate-limited per IP+email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "404":
          description: No account for that email (`code: ACCOUNT_NOT_FOUND`)
        "429":
          description: Too many requests — rate limited

  /auth/client/verify-otp:
    post:
      tags: [Auth]
      summary: Verify a one-time login code and start a client session
      description: |
        A code allows at most 5 incorrect attempts before it's invalidated. Rate-limited
        per IP+email in addition to the attempt cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
        "400":
          description: Invalid or expired code
        "429":
          description: Too many attempts — rate limited

