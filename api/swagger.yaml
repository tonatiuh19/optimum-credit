  /admin/clients/{id}/round-reports/{roundNumber}/reset:
    post:
      tags: [Admin]
      summary: Reset OFG Progress Report round (cascade later rounds)
      description: |
        The dry-run preview also returns `held: [{ round_number, checks }]` — rounds in this reset whose
        report the self-check held, with their checks — so the dialog can warn that resetting a report
        held for a platform reason deletes the uploads and gives the same result (Nov 7, 2026).

        Clears published Round `roundNumber` and **all later rounds** (reports,
        PDFs, wizard sessions), rolls pipeline back using the publish history
        `from_stage` when available, best-effort CDN delete, and audit log.
        Dry-run with `confirm=false` (default) returns a checklist preview.
        Execute with `confirm=true`. Requires `admin` or `super_admin`
        (`requireStaffManager`). Affiliates denied. Does not unsend emails/SMS.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Client id
        - in: path
          name: roundNumber
          required: true
          schema: { type: integer, minimum: 1, maximum: 5 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  description: false = dry-run preview; true = execute reset
      responses:
        "200":
          description: Preview or successful reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dry_run: { type: boolean }
                  preview:
                    type: object
                    properties:
                      rounds_with_data:
                        type: array
                        items: { type: integer }
                      staged_pdf_ids:
                        type: array
                        items: { type: integer }
                      warnings:
                        type: array
                        items: { type: string }
                      pipeline:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
                  reset: { type: object }
                  guidance: { type: string }
        "400":
          description: Invalid round
        "403":
          description: Forbidden
        "404":
          description: Nothing to reset / client not found

