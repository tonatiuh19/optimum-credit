        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                all: { type: boolean }
      responses:
        "200":
          description: ok + unread_count

  /admin/conversations/access:
    get:
      tags: [Admin]
      summary: Conversations access for current admin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: enabled + assigned numbers

  /admin/conversations/badge:
    get:
      tags: [Admin]
      summary: Unread SMS count for sidebar nav badge
      description: Sum of unread client + unknown threads assigned to you or on your OFG numbers.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: unread_total
        "403":
          description: No assigned OFG number

  /admin/conversations/ably-token:
    get:
      tags: [Admin]
      summary: Ably token request for Conversations realtime (alias)
      description: Same as GET /admin/me/ably-token when Conversations access is enabled.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: tokenRequest
        "403":
          description: No assigned OFG number
        "503":
          description: ABLY_API_KEY not configured

  /admin/phone-numbers:
    get:
      tags: [Admin]
      summary: List OFG Twilio inventory numbers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: numbers[]

  /admin/phone-numbers/{id}:
    patch:
      tags: [Admin]
      summary: Assign or unassign an OFG number (admin/super_admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Updated number
        "403":
          description: Forbidden

  /admin/conversations:
    get:
      tags: [Admin]
      summary: Contact-hub inbox (clients + unknown)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: view
          schema:
            type: string
            enum: [all, mine, unassigned, open, closed, unread, unknown]
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated contact hub inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "403":
          description: conversations_number_required

  /admin/conversations/contact/{kind}/{id}/timeline:
    get:
      tags: [Admin]
      summary: Unified timeline for a client or unknown contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [client, unknown] }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: contact + messages (+ threads for clients)
        "403":
          description: conversations_number_required

  /admin/conversations/send:
    post:
      tags: [Admin]
      summary: Send SMS/MMS or internal note on a client or unknown contact
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: integer }
                unknown_contact_id:
                  type: integer
                  description: Open unknown contact (SMS only; one of client_id or unknown_contact_id)
                channel: { type: string, enum: [sms, internal] }
                body: { type: string, description: Text body; optional when media_url is set for SMS/MMS }
                is_internal_note: { type: boolean }
                ofg_number_id: { type: integer }
                media_url:
                  type: string
                  description: Public MMS URL from POST /admin/conversations/media/upload
                media_content_type: { type: string }
      responses:
        "200":
          description: Send result
        "403":
          description: conversations_number_required
        "409":
          description: conversation_closed — reopen before sending

  /admin/conversations/start:
    post:
      tags: [Admin]
      summary: Cold outbound SMS to a phone number (client or unknown thread)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, body]
              properties:
                phone: { type: string }
                body: { type: string }
                ofg_number_id: { type: integer }
                media_url: { type: string }
                media_content_type: { type: string }
      responses:
        "200":
          description: "{ kind client|unknown, client_id?, unknown_contact_id?, ... }"
        "409":
          description: conversation_closed — reopen before sending

  /admin/conversations/suggest-replies:
    post:
      tags: [Admin]
      summary: AI reply suggestions for an open conversation thread
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [client, unknown] }
                contact_id: { type: integer }
                recent_messages: { type: array }
                include_ai: { type: boolean }
      responses:
        "200":
          description: "{ ai_suggestions: [{ id, label, body }] }"

  /admin/conversations/media/upload:
    post:
      tags: [Admin]
      summary: Upload MMS media (stored for Twilio-fetchable public URL; optional DisruptingLabs archival)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "{ success, url, content_type, filename, cdn_url? }"
        "400":
          description: Unsupported type or file larger than 4MB
        "403":
          description: conversations_number_required

  /conversations/media/public/{id}:
    get:
      tags: [Public]
      summary: Serve MMS media bytes for Twilio (and timeline previews)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Binary media with Content-Type
        "404":
          description: Not found or expired

  /conversations/media:
    get:
      tags: [Admin]
      summary: Proxy Twilio/CDN MMS for timeline img/video tags
      description: |
        Same pattern as real-state `/api/sms/media`. `<img src>` cannot send
        `Authorization`, so the admin session JWT is passed as `?token=` and
        the server fetches Twilio media with Basic auth (or streams allowed CDN URLs).
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary media
        "400":
          description: Missing/invalid url (only api.twilio.com / disruptinglabs.com)
        "401":
          description: Missing or invalid token
        "503":
          description: Twilio not configured

  /admin/conversations/contact/client/{id}/assign:
    post:
      tags: [Admin]
      summary: Assign open client conversation threads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_admin_id: { type: integer, nullable: true }
      responses:
        "200":
          description: ok

  /admin/conversations/contact/client/{id}/status:
    post:
      tags: [Admin]
      summary: Set status for all threads of a client contact (close/reopen inserts a system timeline event)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, snoozed, closed, archived] }
      responses:
        "200":
          description: "{ ok, status, system_message?, contact? }"

  /admin/conversations/unknown/{id}/status:
    post:
      tags: [Admin]
      summary: Close or reopen unknown-contact SMS threads (does not dismiss the unknown lead)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: "{ ok, status, system_message?, contact? }"
        "404":
          description: Not found or not accessible

  /admin/conversations/unknown/{id}/link:
    post:
      tags: [Admin]
      summary: Link unknown contact to an existing client
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: integer }
      responses:
        "200":
          description: ok + client_id

  /admin/conversations/unknown/{id}/create-prospect:
    post:
      tags: [Admin]
      summary: Create prospect from unknown contact and link threads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
                preferred_language: { type: string, enum: [en, es] }
                create_case: { type: boolean }
                confirm_duplicate: { type: boolean }
      responses:
        "200":
          description: "{ ok, client_id, case_id?, preferred_language }"
        "409":
          description: duplicate_phone when confirm_duplicate not set
          description: ok + client_id

  /admin/conversations/unknown/{id}/dismiss:
    post:
      tags: [Admin]
      summary: Dismiss unknown contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok

  /admin/conversations/{id}/messages:
    get:
      tags: [Admin]
      summary: Legacy per-thread messages (prefer contact timeline)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: messages[]

  /admin/conversation-templates:
    get:
      tags: [Admin]
      summary: List Conversations hub reply templates
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: channel
          schema: { type: string, enum: [sms, internal] }
        - in: query
          name: all
          schema: { type: string, enum: ["1"] }
          description: Include inactive when all=1
      responses:
        "200":
          description: templates[]
    post:
      tags: [Admin]
      summary: Create conversation template (admin/super_admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string }
                channel: { type: string, enum: [sms, internal] }
                body: { type: string }
                variables: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created template

  /admin/conversation-templates/{id}:
    patch:
      tags: [Admin]
      summary: Update conversation template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated template
    delete:
      tags: [Admin]
      summary: Delete conversation template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok

  /auth/admin/otp-options:
    post:
      tags: [Auth]
      summary: Available admin OTP delivery channels
      description: |
        Returns whether email and/or SMS OTP are available for the given staff email.
        SMS requires an active personal phone on the admin profile, an assigned OFG
        number in `admin_phone_numbers`, and Twilio account credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Channel availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: boolean }
                  sms: { type: boolean }

  /auth/admin/request-otp:
    post:
      tags: [Auth]
      summary: Request a one-time login code (admin/staff)
      description: |
        Sends a login OTP when an active staff account exists for the email.
        Optional `channel` is `email` (default) or `sms`.
        Returns `404 ACCOUNT_NOT_FOUND` when no admin matches, or
        `403 ACCOUNT_INACTIVE` when the account exists but is not active,
        so the UI can show a clear message. Rate-limited per IP+email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                channel: { type: string, enum: [email, sms] }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  channel: { type: string, enum: [email, sms] }
                  message: { type: string }
        "400":
          description: SMS requested but unavailable (`sms_otp_unavailable`)
        "403":
          description: Staff account exists but is not active (`code: ACCOUNT_INACTIVE`)
        "404":
          description: No staff account for that email (`code: ACCOUNT_NOT_FOUND`)
        "429":
          description: Too many requests — rate limited

  /auth/admin/verify-otp:
    post:
      tags: [Auth]
      summary: Verify a one-time login code and start an admin session
      description: |
        A code allows at most 5 incorrect attempts before it's invalidated. Rate-limited
        per IP+email in addition to the attempt cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
        "400":
          description: Invalid or expired code
        "429":
          description: Too many attempts — rate limited

  /portal/payments:
    get:
      tags: [Portal]
      summary: Get authenticated client's payment history
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of payments for the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        package_name:
                          type: string
                          nullable: true
                        amount_cents:
                          type: integer
                        discount_cents:
                          type: integer
                        original_amount_cents:
                          type: integer
                          nullable: true
                        currency:
                          type: string
                        status:
                          type: string
                          enum:
                            [pending, succeeded, failed, refunded, cancelled]
                        provider:
                          type: string
                        coupon_code:
                          type: string
                          nullable: true
                        paid_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
        "401":
          description: Unauthorized

  /admin/payments:
    get:
      tags: [Admin]
      summary: Get paginated payments with filters and summary metrics
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, succeeded, failed, refunded, cancelled]
        - in: query
          name: provider
          schema:
            type: string
            enum: [all, authorize_net, stripe, manual]
        - in: query
          name: search
          schema:
            type: string
          description: Name, email, or transaction ID search
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 10
            maximum: 100
      responses:
        "200":
          description: Paginated payment results plus summary metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        client_id:
                          type: integer
                        package_id:
                          type: integer
                          nullable: true
                        package_name:
                          type: string
                          nullable: true
                        package_slug:
                          type: string
                          nullable: true
                        amount_cents:
                          type: integer
                        discount_cents:
                          type: integer
                        original_amount_cents:
                          type: integer
                          nullable: true
                        currency:
                          type: string
                        status:
                          type: string
                          enum:
                            [pending, succeeded, failed, refunded, cancelled]
                        provider:
                          type: string
                        coupon_code:
                          type: string
                          nullable: true
                        provider_transaction_id:
                          type: string
                          nullable: true
                        provider_charge_id:
                          type: string
                          nullable: true
                        failure_reason:
                          type: string
                          nullable: true
                        paid_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        client_first_name:
                          type: string
                          nullable: true
                        client_last_name:
                          type: string
                          nullable: true
                        client_email:
                          type: string
                          nullable: true
                        client_phone:
                          type: string
                          nullable: true
                        client_pipeline_stage:
                          type: string
                          nullable: true
                        client_status:
                          type: string
                          nullable: true
                  summary:
                    type: object
                    properties:
                      total_count:
                        type: integer
                      succeeded_count:
                        type: integer
                      pending_count:
                        type: integer
                      failed_count:
                        type: integer
                      refunded_count:
                        type: integer
                      total_revenue_cents:
                        type: integer
                      revenue_30d_cents:
                        type: integer
                      revenue_7d_cents:
                        type: integer
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        "401":
          description: Unauthorized

  /admin/payments/{id}/refund:
    post:
      tags: [Admin]
      summary: Refund a payment (ledger clawback)
      description: |
        Marks a `succeeded` payment as `refunded` and voids any `pending`/`approved`
        affiliate commissions tied to it. This is a soft, internal ledger clawback —
        it does not call the Authorize.net refund/void API. Idempotent: calling again
        on an already-refunded payment returns `{ ok: true }` without side effects.
        Not available to affiliate-manager accounts.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refunded (or already refunded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Only succeeded payments can be refunded
        "401":
          description: Unauthorized
        "404":
          description: Payment not found

  /portal/documents:
    post:
      tags: [Portal]
      summary: Upload a document (client)
      security:
        - BearerAuth: []
      description: |
        Accepts a multipart form upload. The file is encrypted with AES-256-GCM
        before being stored on disk. `enc_iv` and `enc_tag` are persisted in the
        database to enable decryption during admin review.
        On success, emails every active team admin (`super_admin` / `admin` /
        `agent`) with a submission alert linking to the pipeline case.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type, file]
              properties:
                doc_type:
                  type: string
                  enum: [id_front, id_back, ssn_card, proof_of_address, other]
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDocument"
        "400":
          description: Missing or invalid fields
        "401":
          description: Unauthorized

  /portal/documents/{id}/file:
    get:
      tags: [Portal]
      summary: View own submitted document file (client)
      security:
        - BearerAuth: []
      description: |
        Decrypts and streams the client's own uploaded document. Only the
        document owner can access this endpoint — `client_id` is validated
        server-side against the authenticated session.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Document ID
      responses:
        "200":
          description: Raw decrypted file bytes with correct Content-Type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Document not found or does not belong to this client

  /portal/info-requests:
    get:
      tags: [Portal]
      summary: List client info requests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Requests list with actionable_count
        "401":
          description: Unauthorized

  /portal/info-requests/{id}:
    get:
      tags: [Portal]
      summary: Get one info request
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Request detail
        "404":
          description: Not found

  /portal/info-requests/{id}/submit:
    post:
      tags: [Portal]
      summary: Submit or resubmit an info request (multipart)
      security:
        - BearerAuth: []
      description: |
        On success, emails every active team admin (`super_admin` / `admin` /
        `agent`) a submission alert with a pipeline case deep link.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [agreed_terms, agreed_sms, responses]
              properties:
                agreed_terms: { type: string }
                agreed_sms: { type: string }
                responses: { type: string, description: JSON object of answers }
                dataDescriptor: { type: string }
                dataValue: { type: string }
      responses:
        "200":
          description: Submitted
        "400":
          description: Validation error
        "422":
          description: Not submittable

