openapi: 3.0.3
info:
  title: Optimum Credit API
  description: |
    REST API for the Optimum Credit platform.

    ## Authentication
    - **Protected routes** require `Authorization: Bearer <session_token>`
    - **Public routes** require no authentication

    ## Base URL
    All endpoints are prefixed with `/api`.
  version: "1.0.0"
  contact:
    name: Optimum Credit Dev

servers:
  - url: /api
    description: Same-origin (development & production)

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Authentication (client & admin)
  - name: Legal
    description: Public legal documents (DB-backed markdown)
  - name: Registration
    description: Public registration & Authorize.net payment flow
  - name: Credit Analysis
    description: Public credit-analysis lead capture & prospect conversion
  - name: Funding
    description: Business funding public wizard, admin board, and portal resume
  - name: Portal
    description: Client portal — documents, dashboard
  - name: Admin
    description: Admin-only operations
  - name: Affiliates
    description: |
      Affiliates v1 — public referral-link resolve/click, admin affiliate
      management (invite, rates, subscription, commissions), and the
      affiliate self-service portal (own profile, leads, commissions,
      sub-affiliate invites for `master` plan).
  - name: Bulk Import
    description: Admin CSV bulk import (validate → review → commit)
  - name: CRC
    description: Credit Repair Cloud integration — sync & webhooks

paths:
  /legal:
    get:
      tags: [Legal]
      summary: List legal document summaries
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        updated_at: { type: string, format: date-time }
        "503":
          description: Database unavailable

  /legal/{slug}:
    get:
      tags: [Legal]
      summary: Get a legal document by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [terms, privacy]
      responses:
        "200":
          description: Full markdown document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      slug: { type: string }
                      title: { type: string }
                      content_md: { type: string }
                      source_url: { type: string, nullable: true }
                      updated_at: { type: string, format: date-time }
        "404":
          description: Not found
        "503":
          description: Database unavailable

  /admin/legal:
    get:
      tags: [Admin, Legal]
      summary: List legal documents (super admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full documents for editing
        "401":
          description: Unauthorized

  /admin/legal/{slug}:
    put:
      tags: [Admin, Legal]
      summary: Update a legal document (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_md]
              properties:
                title: { type: string }
                content_md: { type: string }
                source_url: { type: string, nullable: true }
      responses:
        "200":
          description: Updated document
        "400":
          description: Validation error
        "404":
          description: Not found

  /admin/notify-recipients:
    get:
      tags: [Admin, Settings]
      summary: List staff + extra notification recipients (super admin)
      description: >
        Active team staff (with Email / In-app / SMS prefs) plus extra email-only
        recipients that need not be admin accounts.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff and extras
        "401":
          description: Unauthorized
        "403":
          description: Super admin required

  /admin/admins/{id}/notification-prefs:
    put:
      tags: [Admin, Settings]
      summary: Update a staff member's notification prefs (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_masters:
                  type: object
                  description: Set all events for a channel on/off
                  properties:
                    email: { type: boolean }
                    in_app: { type: boolean }
                    sms: { type: boolean }
                email: { type: object }
                in_app: { type: object }
                sms: { type: object }
      responses:
        "200":
          description: Updated staff prefs
        "404":
          description: Not found

  /admin/notify-extra-emails:
    get:
      tags: [Admin, Settings]
      summary: List extra team notification emails (super admin)
      description: >
        Email-only recipients for team alerts and inbound SMS. Addresses need not
        be admin accounts (e.g. support@ shared inbox).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of extra emails
        "401":
          description: Unauthorized
        "403":
          description: Super admin required
    post:
      tags: [Admin, Settings]
      summary: Add an extra notification email (super admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                label: { type: string, nullable: true }
      responses:
        "200":
          description: Created or reactivated
        "400":
          description: Invalid email

  /admin/notify-extra-emails/{id}:
    patch:
      tags: [Admin, Settings]
      summary: Update extra notification email (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                label: { type: string, nullable: true }
                is_active: { type: boolean }
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
        "409":
          description: Email already exists
    delete:
      tags: [Admin, Settings]
      summary: Remove extra notification email (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /ping:
    get:
      tags: [Health]
      summary: Ping
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  /registration:
    post:
      tags: [Registration]
      summary: Register a new client
      description: |
        Creates or updates a pending client record and returns the data needed
        to render the payment step. When Authorize.net is not configured a mock
        `transactionId` is returned (`isMock: true`).

        **Affiliate attribution:** `affiliateCode` also accepts a slug or
        `ref`/`slug` value (not just the legacy `referral_code`). On first
        successful payment, an `enrollment` commission (+ `override` for the
        parent of a `sub_affiliate`) is recorded automatically, guarded by
        `payment_id` to avoid double-paying on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  firstName,
                  lastName,
                  email,
                  addressLine1,
                  city,
                  state,
                  zip,
                  ssnLast4,
                  packageSlug,
                ]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                addressLine1: { type: string }
                addressLine2: { type: string }
                city: { type: string }
                state: { type: string, minLength: 2, maxLength: 2 }
                zip: { type: string, pattern: '^\d{5}$' }
                ssnLast4: { type: string, pattern: '^\d{4}$' }
                packageSlug: { type: string }
                affiliateCode: { type: string }
                coupon_code:
                  type: string
                  description: Optional promotional coupon code to apply a discount to the charge
      responses:
        "200":
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: integer }
                  packageId: { type: integer }
                  packageName: { type: string }
                  amountCents: { type: integer }
                  isMock: { type: boolean }
                  mockTransactionId:
                    type: string
                    description: Only present when isMock is true
        "400":
          description: Validation error
        "409":
          description: Email already has an active account

  /public/credit-analysis:
    post:
      tags: [Credit Analysis]
      summary: Generate a free credit-analysis (public, no auth)
      description: |
        Multipart upload of a credit report (PDF preferred). Runs the Optimum
        credit-analysis algorithm (FICO bands, goal-based lending conversion,
        prioritized negatives, utilization, 30/60/90 timeline, dispute rounds,
        file strength, 6-step action plan, client SMS copy) using SmartCredit
        heuristic extractors + branded HTML (navy/gold). Creates or reuses a
        `clients` row:
        - New email → inserted as `status=prospect`, `pipeline_stage=prospect`.
        - Existing prospect → stays a prospect, analysis attached.
        - Existing non-prospect client → analysis attached, status untouched.
        Attaches a source label (`web_analysis` or `agent_submission` per
        `mode`) plus inferred analysis labels (e.g. `collections`, `auto`).
        Optionally emails the analysis when `email_opt_in=true`. The response
        includes `extraction_status` — when it is not `ok` (report wasn't a
        parseable text-based PDF), the returned `analysis_html`/`analysis_text`
        honestly say we couldn't reliably read the report instead of implying
        no negative items were found.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one) as a
        form field. If it resolves, `clients.affiliate_id` is set
        (COALESCE — never overwrites existing attribution) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [
                  first_name,
                  last_name,
                  email,
                  phone,
                  text_language,
                  report_file,
                ]
              properties:
                mode: { type: string, enum: [client, agent], default: client }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                client_goal: { type: string }
                text_language: { type: string, enum: [en, es] }
                notes: { type: string }
                agent_phone:
                  type: string
                  description: Only used when mode=agent
                rep_name:
                  type: string
                  description: Only used when mode=agent
                email_opt_in: { type: boolean }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
                report_file:
                  type: string
                  format: binary
                  description: Credit report file (PDF is parsed; other types are stored only)
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAnalysisResult"
        "400":
          description: Missing/invalid fields or file

  /public/prospect-lead:
    post:
      tags: [Credit Analysis]
      summary: Lightweight lead capture → prospect (no file, public, no auth)
      description: |
        Used by the homepage "Get my free analysis" mini-form. Creates a
        `status=prospect` client (or reuses an existing prospect) and attaches
        `source_label` (defaults to `web_analysis`). When `lead_source` is
        `get_started`, also attaches the `get_started_wizard` source label.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one). If it
        resolves to an active/invited affiliate, `clients.affiliate_id` is
        set (never overwritten if already attributed) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                source_label: { type: string, default: web_analysis }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                notes: { type: string }
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
      responses:
        "200":
          description: Lead captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  client_id: { type: integer }
        "400":
          description: Missing/invalid fields

  /public/funding:
    post:
      tags: [Funding]
      summary: Start a business funding application (public)
      description: |
        Creates a `funding_applications` row + links/creates a `clients` row with
        `status=funding` (excluded from Credit Repair Prospect board). Duplicate
        emails attach to the existing client. Returns `public_token` for resume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, funding_type]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                funding_type:
                  type: string
                  enum: [credit_card_stacking, bank_statements]
                preferred_language: { type: string, enum: [en, es] }
      responses:
        "201":
          description: Application started
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/FundingApplication"
        "400":
          description: Validation error

  /public/funding/{token}:
    get:
      tags: [Funding]
      summary: Resume funding application by public token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Application + docs checklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/FundingApplication"
        "404":
          description: Not found
    patch:
      tags: [Funding]
      summary: Update funding fields / encrypted SSN+EIN
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                postal_code: { type: string }
                state: { type: string }
                llc_name: { type: string }
                llc_address: { type: string }
                preferred_language: { type: string, enum: [en, es] }
                ssn: { type: string, description: Full SSN — stored encrypted }
                ein: { type: string, description: EIN — stored encrypted }
      responses:
        "200":
          description: Updated
        "409":
          description: Locked (converted/cancelled/complete)

  /public/funding/{token}/documents:
    post:
      tags: [Funding]
      summary: Upload a required funding document slot
      description: |
        Multipart `file` + `doc_type` one of funding_drivers_license,
        funding_corp_statement, funding_bank_m1…m6. Fires `funding_doc_upload`
        staff notify; when all 8 slots are present, emails+SMS the applicant
        (language from application; SMS From = system_settings
        `funding_sms_from_phone_number_id`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, doc_type]
              properties:
                file: { type: string, format: binary }
                doc_type: { type: string }
      responses:
        "201":
          description: Uploaded
        "400":
          description: Invalid slot / missing file
        "409":
          description: Locked (converted/cancelled/complete)

  /public/funding/{token}/submit:
    post:
      tags: [Funding]
      summary: Mark funding application submitted (requires all docs)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
        "400":
          description: docs_incomplete
        "409":
          description: Locked (converted/cancelled/complete)

  /admin/funding:
    get:
      tags: [Funding]
      summary: List funding applications (admin board)
      description: |
        Paginated Kanban board — first page per status column (limit default 20).
        Pass `column` + `offset` to load more within one column. Requires super_admin or admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Name, email, phone, LLC, or application id
        - name: q
          in: query
          schema: { type: string }
          description: Alias for search (legacy)
        - name: funding_type
          in: query
          schema:
            type: string
            enum: [credit_card_stacking, bank_statements]
        - name: language
          in: query
          schema:
            type: string
            enum: [en, es]
        - name: status
          in: query
          schema: { type: string }
          description: Optional single-status filter (legacy)
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: column
          in: query
          schema:
            type: string
            enum: [awaiting_docs, submitted, under_review, complete, converted]
          description: When set with offset, returns load-more payload for that column only
      responses:
        "200":
          description: Board (all columns) or single-column page when column is set
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      limit: { type: integer }
                      applications:
                        type: array
                        items:
                          $ref: "#/components/schemas/FundingApplication"
                      columns:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            items:
                              type: array
                              items:
                                $ref: "#/components/schemas/FundingApplication"
                            total: { type: integer }
                            offset: { type: integer }
                            limit: { type: integer }
                            has_more: { type: boolean }
                  - type: object
                    properties:
                      column: { type: string }
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/FundingApplication"
                      total: { type: integer }
                      offset: { type: integer }
                      limit: { type: integer }
                      has_more: { type: boolean }
        "403":
          description: Forbidden — admin or super_admin required
    post:
      tags: [Funding]
      summary: Create funding application manually (admin)
      description: |
        Adds a row to the funding board — e.g. phone intake or GHL lead.
        Fires `funding_application_created` (team email/in-app/SMS per prefs + extra emails)
        and emails the applicant a link to `/funding?token=…` to upload documents.
        Requires super_admin or admin role.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, funding_type]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                funding_type:
                  type: string
                  enum: [credit_card_stacking, bank_statements]
                preferred_language:
                  type: string
                  enum: [en, es]
                status:
                  type: string
                  enum: [awaiting_docs, submitted, under_review, complete]
                  default: awaiting_docs
                postal_code: { type: string }
                state: { type: string }
                llc_name: { type: string }
                llc_address: { type: string }
                client_id:
                  type: integer
                  description: Optional existing client to link and prefill
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/FundingApplication"
        "400":
          description: Validation error
        "403":
          description: Forbidden — admin or super_admin required
        "404":
          description: client_id not found

  /admin/funding/{id}:
    get:
      tags: [Funding]
      summary: Funding application detail + documents
      description: Requires super_admin or admin role (agents receive 403).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/FundingApplication"
        "403":
          description: Forbidden — admin or super_admin required

  /admin/funding/{id}/status:
    post:
      tags: [Funding]
      summary: Update funding application status
      description: Requires super_admin or admin role (agents receive 403).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [awaiting_docs, submitted, under_review, complete, cancelled]
      responses:
        "200":
          description: Updated
        "403":
          description: Forbidden — admin or super_admin required

  /admin/funding/{id}/convert:
    post:
      tags: [Funding]
      summary: Convert funding lead → Credit Repair prospect
      description: Sets client status/pipeline to prospect; marks application converted. Requires super_admin or admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Converted
        "403":
          description: Forbidden — admin or super_admin required
        "409":
          description: Already converted

  /portal/funding:
    get:
      tags: [Funding]
      summary: Client portal — my funding applications
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Applications for the logged-in client
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundingApplication"

  /portal/funding/{id}/documents:
    post:
      tags: [Funding]
      summary: Client portal — upload remaining funding doc
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, doc_type]
              properties:
                file: { type: string, format: binary }
                doc_type: { type: string }
      responses:
        "201":
          description: Uploaded

  /public/affiliates/{slug}:
    get:
      tags: [Affiliates]
      summary: Resolve a public referral slug (no auth)
      description: |
        Used by the client-side `/r/{slug}` route to set the 30-day
        first-touch attribution cookie and redirect. Accepts either the full
        `slug` or the legacy `referral_code`. Optional `?to=analysis|pricing`
        overrides the affiliate's `default_landing`.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string, enum: [analysis, pricing] }
      responses:
        "200":
          description: Resolved affiliate + shareable links
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  first_name: { type: string }
                  redirect_path:
                    { type: string, example: /credit-analysis?ref=juan-perez }
                  links:
                    type: object
                    description: short_default, short_analysis, short_pricing, analysis_ref, pricing_ref
        "404":
          description: Referral link not found / inactive

