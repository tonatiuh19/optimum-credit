openapi: 3.0.3
info:
  title: Optimum Credit API
  description: |
    REST API for the Optimum Credit platform.

    ## Authentication
    - **Protected routes** require `Authorization: Bearer <session_token>`
    - **Public routes** require no authentication

    ## Base URL
    All endpoints are prefixed with `/api`.
  version: "1.0.0"
  contact:
    name: Optimum Credit Dev

servers:
  - url: /api
    description: Same-origin (development & production)

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Authentication (client & admin)
  - name: Legal
    description: Public legal documents (DB-backed markdown)
  - name: Registration
    description: Public registration & Authorize.net payment flow
  - name: Credit Analysis
    description: Public credit-analysis lead capture & prospect conversion
  - name: Portal
    description: Client portal — documents, dashboard
  - name: Admin
    description: Admin-only operations
  - name: Affiliates
    description: |
      Affiliates v1 — public referral-link resolve/click, admin affiliate
      management (invite, rates, subscription, commissions), and the
      affiliate self-service portal (own profile, leads, commissions,
      sub-affiliate invites for `master` plan).
  - name: Bulk Import
    description: Admin CSV bulk import (validate → review → commit)
  - name: CRC
    description: Credit Repair Cloud integration — sync & webhooks

paths:
  /legal:
    get:
      tags: [Legal]
      summary: List legal document summaries
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        updated_at: { type: string, format: date-time }
        "503":
          description: Database unavailable

  /legal/{slug}:
    get:
      tags: [Legal]
      summary: Get a legal document by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [terms, privacy]
      responses:
        "200":
          description: Full markdown document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      slug: { type: string }
                      title: { type: string }
                      content_md: { type: string }
                      source_url: { type: string, nullable: true }
                      updated_at: { type: string, format: date-time }
        "404":
          description: Not found
        "503":
          description: Database unavailable

  /admin/legal:
    get:
      tags: [Admin, Legal]
      summary: List legal documents (super admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full documents for editing
        "401":
          description: Unauthorized

  /admin/legal/{slug}:
    put:
      tags: [Admin, Legal]
      summary: Update a legal document (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_md]
              properties:
                title: { type: string }
                content_md: { type: string }
                source_url: { type: string, nullable: true }
      responses:
        "200":
          description: Updated document
        "400":
          description: Validation error
        "404":
          description: Not found

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /ping:
    get:
      tags: [Health]
      summary: Ping
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  /registration:
    post:
      tags: [Registration]
      summary: Register a new client
      description: |
        Creates or updates a pending client record and returns the data needed
        to render the payment step. When Authorize.net is not configured a mock
        `transactionId` is returned (`isMock: true`).

        **Affiliate attribution:** `affiliateCode` also accepts a slug or
        `ref`/`slug` value (not just the legacy `referral_code`). On first
        successful payment, an `enrollment` commission (+ `override` for the
        parent of a `sub_affiliate`) is recorded automatically, guarded by
        `payment_id` to avoid double-paying on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  firstName,
                  lastName,
                  email,
                  addressLine1,
                  city,
                  state,
                  zip,
                  ssnLast4,
                  packageSlug,
                ]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                addressLine1: { type: string }
                addressLine2: { type: string }
                city: { type: string }
                state: { type: string, minLength: 2, maxLength: 2 }
                zip: { type: string, pattern: '^\d{5}$' }
                ssnLast4: { type: string, pattern: '^\d{4}$' }
                packageSlug: { type: string }
                affiliateCode: { type: string }
                coupon_code:
                  type: string
                  description: Optional promotional coupon code to apply a discount to the charge
      responses:
        "200":
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: integer }
                  packageId: { type: integer }
                  packageName: { type: string }
                  amountCents: { type: integer }
                  isMock: { type: boolean }
                  mockTransactionId:
                    type: string
                    description: Only present when isMock is true
        "400":
          description: Validation error
        "409":
          description: Email already has an active account

  /public/credit-analysis:
    post:
      tags: [Credit Analysis]
      summary: Generate a free credit-analysis (public, no auth)
      description: |
        Multipart upload of a credit report (PDF preferred). Runs the Optimum
        credit-analysis algorithm (FICO bands, goal-based lending conversion,
        prioritized negatives, utilization, 30/60/90 timeline, dispute rounds,
        file strength, 6-step action plan, client SMS copy) using SmartCredit
        heuristic extractors + branded HTML (navy/gold). Creates or reuses a
        `clients` row:
        - New email → inserted as `status=prospect`, `pipeline_stage=prospect`.
        - Existing prospect → stays a prospect, analysis attached.
        - Existing non-prospect client → analysis attached, status untouched.
        Attaches a source label (`web_analysis` or `agent_submission` per
        `mode`) plus inferred analysis labels (e.g. `collections`, `auto`).
        Optionally emails the analysis when `email_opt_in=true`. The response
        includes `extraction_status` — when it is not `ok` (report wasn't a
        parseable text-based PDF), the returned `analysis_html`/`analysis_text`
        honestly say we couldn't reliably read the report instead of implying
        no negative items were found.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one) as a
        form field. If it resolves, `clients.affiliate_id` is set
        (COALESCE — never overwrites existing attribution) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [
                  first_name,
                  last_name,
                  email,
                  phone,
                  text_language,
                  report_file,
                ]
              properties:
                mode: { type: string, enum: [client, agent], default: client }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                client_goal: { type: string }
                text_language: { type: string, enum: [en, es] }
                notes: { type: string }
                agent_phone:
                  type: string
                  description: Only used when mode=agent
                rep_name:
                  type: string
                  description: Only used when mode=agent
                email_opt_in: { type: boolean }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
                report_file:
                  type: string
                  format: binary
                  description: Credit report file (PDF is parsed; other types are stored only)
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAnalysisResult"
        "400":
          description: Missing/invalid fields or file

  /public/prospect-lead:
    post:
      tags: [Credit Analysis]
      summary: Lightweight lead capture → prospect (no file, public, no auth)
      description: |
        Used by the homepage "Get my free analysis" mini-form. Creates a
        `status=prospect` client (or reuses an existing prospect) and attaches
        `source_label` (defaults to `web_analysis`). When `lead_source` is
        `get_started`, also attaches the `get_started_wizard` source label.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one). If it
        resolves to an active/invited affiliate, `clients.affiliate_id` is
        set (never overwritten if already attributed) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                source_label: { type: string, default: web_analysis }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                notes: { type: string }
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
      responses:
        "200":
          description: Lead captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  client_id: { type: integer }
        "400":
          description: Missing/invalid fields

  /public/affiliates/{slug}:
    get:
      tags: [Affiliates]
      summary: Resolve a public referral slug (no auth)
      description: |
        Used by the client-side `/r/{slug}` route to set the 30-day
        first-touch attribution cookie and redirect. Accepts either the full
        `slug` or the legacy `referral_code`. Optional `?to=analysis|pricing`
        overrides the affiliate's `default_landing`.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string, enum: [analysis, pricing] }
      responses:
        "200":
          description: Resolved affiliate + shareable links
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  first_name: { type: string }
                  redirect_path:
                    { type: string, example: /credit-analysis?ref=juan-perez }
                  links:
                    type: object
                    description: short_default, short_analysis, short_pricing, analysis_ref, pricing_ref
        "404":
          description: Referral link not found / inactive

  /public/affiliates/{slug}/click:
    post:
      tags: [Affiliates]
      summary: Log a referral link click (no auth, best-effort)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                landing:
                  type: string
                  enum: [credit_analysis, pricing, other]
                  default: other
      responses:
        "200":
          description: |
            Always 200 (never blocks the redirect) — `ok:false` on internal
            logging failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  slug: { type: string }
        "404":
          description: Referral link not found / inactive

  /admin/affiliates:
    get:
      tags: [Affiliates]
      summary: List affiliates with counts (admin/super_admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: plan
          in: query
          schema: { type: string, enum: [standard, master, sub_affiliate] }
        - name: status
          in: query
          schema: { type: string, enum: [invited, active, inactive, suspended] }
      responses:
        "200":
          description: Affiliates with clients_count, sub_affiliates_count, commissions totals
        "403":
          description: Forbidden — affiliates cannot manage other affiliates
    post:
      tags: [Affiliates]
      summary: Invite a new affiliate (creates admins row role=affiliate + affiliates row)
      description: |
        Generates a unique `slug` (from provided value or first/last name),
        derives `referral_code` as `slug.slice(0, 32)`, applies tier defaults
        (`suggestedTierDefaults`) unless overridden, and sends the welcome
        email. `comp_subscription: true` sets `status=active`,
        `subscription_status=comped` immediately (skip billing).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                plan:
                  {
                    type: string,
                    enum: [standard, master, sub_affiliate],
                    default: standard,
                  }
                parent_affiliate_id:
                  type: integer
                  description: Required when plan=sub_affiliate; must reference a master affiliate
                slug: { type: string }
                default_landing:
                  { type: string, enum: [credit_analysis, pricing] }
                monthly_price_cents: { type: integer }
                commission_rate_bps: { type: integer }
                parent_override_rate_bps: { type: integer }
                comp_subscription: { type: boolean }
                notes: { type: string }
      responses:
        "200":
          description: Created
        "400":
          description: Missing/invalid fields
        "409":
          description: Email or slug already in use

  /admin/affiliates/meta/suggestions:
    get:
      tags: [Affiliates]
      summary: Tier price + commission-rate suggestions per plan (for the invite form)
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: suggestions (by plan) + features (AFFILIATE_FEATURES_ALL_ON)

  /admin/affiliates/{id}:
    get:
      tags: [Affiliates]
      summary: Affiliate detail — profile, links, sub-affiliates, recent clients
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Affiliate detail
        "404":
          description: Not found
    patch:
      tags: [Affiliates]
      summary: Update an affiliate (slug, plan, rates, landing, status, parent, notes, names/phone)
      description: Also syncs first_name/last_name/phone onto the linked admins row.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slug: { type: string }
                plan: { type: string, enum: [standard, master, sub_affiliate] }
                monthly_price_cents: { type: integer }
                commission_rate_bps: { type: integer }
                parent_override_rate_bps: { type: integer }
                parent_affiliate_id: { type: integer, nullable: true }
                default_landing:
                  { type: string, enum: [credit_analysis, pricing] }
                status:
                  { type: string, enum: [invited, active, inactive, suspended] }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                bio: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Updated affiliate
        "409":
          description: Slug already in use

  /admin/affiliates/{id}/comp:
    post:
      tags: [Affiliates]
      summary: Comp an affiliate's subscription (subscription_status=comped, status=active)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
        "404":
          description: Not found

  /admin/affiliates/{id}/subscribe:
    post:
      tags: [Affiliates]
      summary: Charge an affiliate's monthly subscription on their behalf (Authorize.net ARB)
      description: |
        Accept.js opaque data — amount comes from affiliates.monthly_price_cents.
        Rejects with `409` if the affiliate already has an active/pending subscription
        or a linked `anet_subscription_id` — cancel it first before creating a new one.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataDescriptor, dataValue]
              properties:
                dataDescriptor: { type: string }
                dataValue: { type: string }
      responses:
        "200":
          description: Subscribed — subscription_id
        "402":
          description: Subscription creation failed
        "409":
          description: Affiliate already has an active or pending subscription

  /admin/affiliates/{id}/commissions:
    get:
      tags: [Affiliates]
      summary: List an affiliate's commission ledger rows
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Commissions
    post:
      tags: [Affiliates]
      summary: Add a manual commission row
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { type: integer }
                client_id: { type: integer, nullable: true }
                notes: { type: string }
      responses:
        "200":
          description: Created — id

  /admin/affiliates/commissions/{id}:
    patch:
      tags: [Affiliates]
      summary: Update a commission's status
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, paid, void] }
      responses:
        "200":
          description: OK
        "404":
          description: Not found

  /admin/affiliate/me:
    get:
      tags: [Affiliates]
      summary: Self-service — own affiliate profile + links + stats
      description: Requires the caller's admins.role to be `affiliate`.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: affiliate, links, stats (clicks_total, referred_clients, commissions_pending_cents, commissions_earned_cents)
        "403":
          description: Affiliate access required
    patch:
      tags: [Affiliates]
      summary: Self-service — update own limited profile fields
      description: |
        Limited surface — `default_landing`, `bio`, `phone`, and social links
        only. Rates/plan/status remain admin-managed.
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_landing:
                  { type: string, enum: [credit_analysis, pricing] }
                bio: { type: string }
                phone: { type: string }
                social_facebook: { type: string }
                social_instagram: { type: string }
                social_tiktok: { type: string }
                social_linkedin: { type: string }
      responses:
        "200":
          description: Updated affiliate

  /admin/affiliate/me/subscribe:
    post:
      tags: [Affiliates]
      summary: Self-service — pay own monthly subscription (Authorize.net ARB)
      description: |
        Does NOT require portal access (needed to bootstrap access). Rejects with
        `409` if the caller already has an active/pending subscription or a linked
        `anet_subscription_id` — cancel it first before creating a new one.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataDescriptor, dataValue]
              properties:
                dataDescriptor: { type: string }
                dataValue: { type: string }
      responses:
        "200":
          description: Subscribed — subscription_id
        "402":
          description: Subscription creation failed
        "409":
          description: You already have an active or pending subscription

  /admin/affiliate/leads:
    post:
      tags: [Affiliates]
      summary: Self-service — manually create a referred lead (requires portal access)
      description: Creates a `status=prospect` client with `affiliate_id=self` and attaches `affiliate_referral`.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "200":
          description: Created — client_id
        "403":
          description: Portal access required

  /admin/affiliate/commissions:
    get:
      tags: [Affiliates]
      summary: Self-service — own commission ledger (requires portal access)
      description: Master affiliates also see `override` rows earned from their sub-affiliates.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Commissions
        "403":
          description: Portal access required

  /admin/affiliate/subs:
    post:
      tags: [Affiliates]
      summary: Self-service — master affiliate invites a sub-affiliate (requires portal access)
      description: Creates admins(role=affiliate) + affiliates row with `plan=sub_affiliate`, `parent_affiliate_id=self`.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "200":
          description: Created — id, admin_id, slug
        "403":
          description: Portal access required, or caller is not a master affiliate

  /tradeline-products:
    get:
      tags: [Registration]
      summary: List active tradeline products (public catalog)
      responses:
        "200":
          description: Tradeline catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/TradelineProduct"

  /registration/process-payment:
    post:
      tags: [Registration]
      summary: Charge card via Authorize.net Accept.js nonce (legacy two-step flow)
      description: |
        Accepts an opaque payment nonce from Accept.js when Authorize.net is configured,
        or processes a mock payment when it is not. For `tradeline_picker` packages,
        pass `tradelineProductIds` and the charge amount is the sum of selected lines.

        **Legacy route.** In production this route is disabled (returns `410`) unless
        `ALLOW_LEGACY_PROCESS_PAYMENT=true` is set — new clients should use the unified
        `POST /registration` flow instead. Even when enabled, the target client must be
        in `pending_payment` or `prospect` status. This route is rate-limited per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: integer }
                dataDescriptor:
                  type: string
                  example: COMMON.ACCEPT.INAPP.PAYMENT
                dataValue:
                  type: string
                  description: Opaque nonce from Accept.js
                tradelineProductIds:
                  type: array
                  items: { type: integer }
                  description: Required when package checkout_type is tradeline_picker
      responses:
        "200":
          description: Payment succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "402":
          description: Payment declined
        "404":
          description: Client not found
        "410":
          description: Route disabled — client is not eligible (wrong status) or legacy flow disabled in production. Use POST /registration instead.
        "429":
          description: Too many attempts — rate limited
        "503":
          description: Payment provider not configured (only when nonce required and ANet missing)

  /portal/peace-of-mind:
    get:
      tags: [Portal]
      summary: Peace of Mind subscription eligibility and status
      security: [{ BearerAuth: [] }]
      responses:
