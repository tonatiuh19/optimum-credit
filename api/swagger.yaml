        "409":
          description: duplicate_phone / duplicate_email with existing_client_id

  /admin/conversations/unknown/{id}/dismiss:
    post:
      tags: [Admin]
      summary: Dismiss unknown contact
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok

  /admin/conversations/messages/{messageId}/retry-call-insights:
    post:
      tags: [Admin]
      summary: Retry call transcription
      description: |
        Re-queues and immediately transcribes a call or voicemail with Twilio
        Batch Transcription. Requires Conversations access and ACL on the thread.
        Stores the transcript only.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated message with call insights fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: object }
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Recording not available yet
        "500":
          description: Retry failed

  /admin/conversations/{id}/messages:
    get:
      tags: [Admin]
      summary: Legacy per-thread messages (prefer contact timeline)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: messages[]

  /admin/conversation-templates:
    get:
      tags: [Admin]
      summary: List Conversations hub reply templates
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: channel
          schema: { type: string, enum: [sms, internal] }
        - in: query
          name: all
          schema: { type: string, enum: ["1"] }
          description: Include inactive when all=1
      responses:
        "200":
          description: templates[]
    post:
      tags: [Admin]
      summary: Create conversation template (admin/super_admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string }
                channel: { type: string, enum: [sms, internal] }
                body: { type: string }
                variables: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created template

  /admin/conversation-templates/{id}:
    patch:
      tags: [Admin]
      summary: Update conversation template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated template
    delete:
      tags: [Admin]
      summary: Delete conversation template
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok

  /auth/admin/otp-options:
    post:
      tags: [Auth]
      summary: Available admin OTP delivery channels
      description: |
        Returns whether email and/or SMS OTP are available for the given staff email.
        SMS requires an active personal phone on the admin profile, an assigned OFG
        number in `admin_phone_numbers`, and Twilio account credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Channel availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: boolean }
                  sms: { type: boolean }

  /auth/admin/request-otp:
    post:
      tags: [Auth]
      summary: Request a one-time login code (admin/staff)
      description: |
        Sends a login OTP when an active staff account exists for the email.
        Optional `channel` is `email` (default) or `sms`.
        Returns `404 ACCOUNT_NOT_FOUND` when no admin matches, or
        `403 ACCOUNT_INACTIVE` when the account exists but is not active,
        so the UI can show a clear message. Rate-limited per IP+email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                channel: { type: string, enum: [email, sms] }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  channel: { type: string, enum: [email, sms] }
                  message: { type: string }
        "400":
          description: SMS requested but unavailable (`sms_otp_unavailable`)
        "403":
          description: Staff account exists but is not active (`code: ACCOUNT_INACTIVE`)
        "404":
          description: No staff account for that email (`code: ACCOUNT_NOT_FOUND`)
        "429":
          description: Too many requests — rate limited

  /auth/admin/verify-otp:
    post:
      tags: [Auth]
      summary: Verify a one-time login code and start an admin session
      description: |
        A code allows at most 5 incorrect attempts before it's invalidated. Rate-limited
        per IP+email in addition to the attempt cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
        "400":
          description: Invalid or expired code
        "429":
          description: Too many attempts — rate limited

  /portal/payments:
