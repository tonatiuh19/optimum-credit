      responses:
        "200":
          description: Re-extraction complete
        "400":
          description: Session published or invalid
        "500":
          description: Extraction failed

  /admin/report-wizard/sessions/{id}/enhance:
    post:
      tags: [Admin]
      summary: Claude narrative enhance (action plan / wins / targets wording; scores untouched)
      security:
        - BearerAuth: []
