      summary: Redeem prepaid onboard invite
      description: |
        Creates or promotes client to New Client, records paid installment + optional
        remaining splits, sends welcome email, returns portal session JWT.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  description: Required for portal session / OTP return path
                phone:
                  type: string
                  nullable: true
                preferred_language:
                  type: string
                  enum: [en, es]
      responses:
        "201":
          description: Enrolled; portal session JWT when available
        "400":
          description: Validation error (e.g. missing email)
        "409":
          description: Already an enrolled client
        "410":
          description: Invite closed

  /admin/cases/{id}/splits:
    get:
      tags: [Admin - Payment Splits]
      summary: List splits for a case
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Array of splits
          content:
            application/json:
              schema:
                type: object
                properties:
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentSplit"
        "401":
          description: Unauthorized
    post:
      tags: [Admin - Payment Splits]
      summary: Add a split to a case
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSplitPayload"
      responses:
        "201":
          description: Split created
          content:
            application/json:
              schema:
                type: object
                properties:
                  split_id:
                    type: integer
        "401":
          description: Unauthorized

  /admin/cases/{id}/splits/{splitId}:
    put:
      tags: [Admin - Payment Splits]
      summary: Update a split
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: splitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                amount_cents:
                  type: integer
                due_date:
                  type: string
                  format: date
                status:
                  type: string
                  enum: [pending, paid, overdue, cancelled]
                completion_source:
                  type: string
                  enum: [manual, authorize_link]
                send_payment_link:
                  type: boolean
                  description: >
                    When true on an unpaid split, creates a payment_split_tokens
                    row if one does not already exist.
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Split updated
        "401":
          description: Unauthorized
    delete:
      tags: [Admin - Payment Splits]
      summary: Delete a split
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: splitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Split deleted
        "401":
          description: Unauthorized

  /admin/payment-splits:
    get:
      tags: [Admin - Payment Splits]
      summary: Paginated overview of all payment splits
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, overdue, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated splits
          content:
            application/json:
              schema:
                type: object
                properties:
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentSplit"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      pages:
                        type: integer
        "401":
          description: Unauthorized

  /admin/calendar:
    get:
      tags: [Admin - Calendar]
      summary: Payment splits + round targets + open work tasks in a date range
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Calendar splits, round events, and open work tasks with due dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentSplit"
                  round_events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        case_id: { type: integer }
                        case_number: { type: string, nullable: true }
                        client_id: { type: integer }
                        client_first_name: { type: string }
                        client_last_name: { type: string }
                        round_number: { type: integer }
                        target_date: { type: string, format: date }
                        kind:
                          type: string
                          enum: [schedule, extended]
                          description: schedule = R1–5 from case_round_schedules; extended = next_dispute_target_date
                        label:
                          type: string
                          description: Optional display label (e.g. Round N target for extended)
                  work_tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        status: { type: string, enum: [backlog, doing] }
                        priority:
                          type: string
                          enum: [low, medium, high, urgent]
                        due_date: { type: string, format: date }
                        assignee_admin_id: { type: integer, nullable: true }
                        assignee_name: { type: string, nullable: true }
                        case_id: { type: integer, nullable: true }
                        case_number: { type: string, nullable: true }
                        client_id: { type: integer, nullable: true }
                        client_first_name: { type: string, nullable: true }
                        client_last_name: { type: string, nullable: true }
                        source: { type: string, enum: [optimum, hubspot] }
        "401":
          description: Unauthorized

  /portal/payment-splits:
    get:
      tags: [Client Portal]
      summary: Client's own payment schedule
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of client payment splits
          content:
            application/json:
              schema:
                type: object
                properties:
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentSplit"
        "401":
          description: Unauthorized

  /pay/{token}:
    get:
      tags: [Public]
      summary: Get public split payment info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Split payment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  split_id:
                    type: integer
                  case_number:
                    type: string
                    nullable: true
                  label:
                    type: string
                  amount_cents:
                    type: integer
                  due_date:
                    type: string
                    format: date
                  status:
                    type: string
                  client_first_name:
                    type: string
                    nullable: true
                  has_stored_card:
                    type: boolean
        "404":
          description: Token not found or expired
    post:
      tags: [Public]
      summary: Process a split payment via token
      description: |
        Reserves the split under a row lock (status → `processing`) and records a
        provisional `pending` payment before charging, so two concurrent submissions
        (e.g. a double-click or a retried request) can't both succeed against the
        same split. If the split is already reserved/paid, returns `409`. Rate-limited
        per token. On success, emails every active team admin a "Payment received"
        alert (installment) with a pipeline deep link.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [stored_profile, new_card]
                data_descriptor:
                  type: string
                  description: Accept.js nonce descriptor (new_card only)
                data_value:
                  type: string
                  description: Accept.js nonce value (new_card only)
      responses:
        "200":
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  transaction_id:
                    type: string
        "400":
          description: Invalid payment or split already paid
        "402":
          description: Card was declined by the payment processor
        "404":
          description: Token not found
        "409":
          description: This split is already being processed by another request
        "429":
          description: Too many attempts — rate limited
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreditRepairCase:
      type: object
      properties:
        id:
          type: integer
          description: credit_repair_cases.id
        case_number:
          type: string
          example: CR-00001
        client_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        package_id:
          type: integer
          nullable: true
        package_name:
          type: string
          nullable: true
        package_slug:
          type: string
          nullable: true
        crc_client_id:
          type: string
          nullable: true
        crc_synced_at:
          type: string
          format: date-time
          nullable: true
        pipeline_stage:
          type: string
          enum:
            [
              prospect,
              new_client,
              docs_ready,
              round_1,
              round_2,
              round_3,
              round_4,
              round_5,
              completed,
              cancelled,
            ]
        pipeline_stage_changed_at:
          type: string
          format: date-time
          nullable: true
        max_rounds:
          type: integer
          minimum: 5
          maximum: 12
          description: Max OFG progress rounds (5 default; up to 24 for special clients)
        next_dispute_target_date:
          type: string
          format: date
          nullable: true
          description: Optional next dispute target (calendar) for extended cases
        highest_published_round:
          type: integer
          nullable: true
          description: Highest published client_round_reports.round_number for this client
        extended_rounds_legend:
          type: string
          nullable: true
          description: Pipeline badge when max_rounds > 5, e.g. Special · R6/8
        status:
          type: string
          enum: [active, completed, cancelled, on_hold]
          description: Case status (distinct from client status)
        client_status:
          type: string
          description: Client account status
        created_at:
          type: string
          format: date-time
        docs_total:
          type: integer
        docs_approved:
          type: integer
        docs_pending:
          type: integer
        docs_rejected:
          type: integer
        labels:
          type: array
          description: Source + analysis labels attached to the case's client
          items:
            $ref: "#/components/schemas/Label"

    AdminCrmContact:
      type: object
      description: CRM Contacts address-book row (independent of pipeline clients)
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address_line1:
          type: string
          nullable: true
        address_line2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        preferred_language:
          type: string
          enum: [en, es]
        admin_notes:
          type: string
          nullable: true
        assigned_admin_id:
          type: integer
          nullable: true
        created_by_admin_id:
          type: integer
          nullable: true
        converted_client_id:
          type: integer
          nullable: true
        converted_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminClientListItem:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        pipeline_stage:
          type: string
          enum:
            [
              prospect,
              new_client,
              docs_ready,
              round_1,
              round_2,
              round_3,
              round_4,
              round_5,
              completed,
              cancelled,
            ]
        status:
          type: string
          enum:
            [prospect, funding, pending_payment, onboarding, active, paused, cancelled]
        package_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"

    Label:
