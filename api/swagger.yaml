  /webhooks/crc:
    post:
      tags: [CRC]
      summary: Receive CRC pipeline stage update (called by Zapier)
      description: |
        Zapier posts here when a client's round/stage changes in Credit Repair Cloud.
        Secured by a shared `secret` field compared against `CRC_WEBHOOK_SECRET`
        (constant-time comparison). In production `CRC_WEBHOOK_SECRET` is mandatory —
        the endpoint returns `503` if it isn't configured. When configured, the
        `secret` field must always match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                secret:
                  type: string
                  description: Shared webhook secret (CRC_WEBHOOK_SECRET)
                email:
                  type: string
                  format: email
                crc_client_id:
                  type: string
                  description: Base64-encoded CRC client ID
                stage:
                  type: string
                  example: "Round 2 (Month 2)"
      responses:
        "200":
          description: Stage updated (or no-op if unchanged / client not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stage:
                    type: string
                  clientId:
                    type: integer
        "400":
          description: Missing required fields
        "401":
          description: Invalid webhook secret
        "422":
          description: Unknown stage name
        "503":
          description: Webhook not configured (production only)

