          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                phone:
                  type: string
                  nullable: true
                preferred_language:
                  type: string
                  enum: [en, es]
                  description: >-
                    Staff only. Client preferred language; also reassigns
                    language-owner admin when assigned_admin_id is omitted.
                package_id:
                  type: integer
                status:
                  type: string
                  enum: [pending_payment, onboarding, active, paused, cancelled]
                referral_category:
                  type: string
                  enum: [realtor_broker, one_off, affiliate_partner]
                referrer_id:
                  type: integer
                  nullable: true
                referrers:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      referrer_id: { type: integer }
                      notify_on_round:
                        type: boolean
                        description: >
                          Accepted for compatibility; server always stores true.
                cms_credentials:
                  type: object
                  description: SmartCredit + MyFreeScoreNow vault (staff only; hard-fails update if save fails)
                  properties:
                    smart_credit:
                      type: object
                      properties:
                        email: { type: string }
                        password: { type: string }
                    myfreescorenow:
                      type: object
                      properties:
                        email: { type: string }
                        password: { type: string }
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
        "403":
          description: Affiliate subscription required (code `affiliate_subscription_required`)
        "404":
          description: Client not found (or out of the caller's affiliate scope)
        "409":
          description: Email already exists
        "500":
          description: CMS vault save failed (code `cms_credentials_failed`)
    delete:
      tags: [Admin]
      summary: Delete a client
      description: >-
        Affiliates may only delete their own referred leads while they are
        still `status='prospect'` — out-of-scope clients return 404, and
        already-converted clients return 403.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Affiliate subscription required, or client is past the prospect stage
        "404":
          description: Client not found (or out of the caller's affiliate scope)

  /admin/bulk-import/templates/clients.csv:
    get:
      tags: [Bulk Import]
      summary: Download the clients CSV import template
      security:
        - BearerAuth: []
      responses:
        "200":
          description: CSV file with headers + one sample row
          content:
            text/csv:
              schema:
                type: string

  /admin/bulk-import/validate:
    post:
      tags: [Bulk Import]
      summary: Upload + validate a bulk import CSV (stages a review job, no DB writes yet)
      description: |
        Parses and validates the uploaded CSV (max 500 rows, 5MB), resolves
        `package_slug` to `package_id`, and flags rows whose email already
        exists in `clients`. The result is staged as a `bulk_import_jobs` row
        (`status = validated`, TTL 1 hour) that must be reviewed and then
        committed via `POST /admin/bulk-import/{jobId}/commit`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                entity:
                  type: string
                  enum: [clients]
                  default: clients
      responses:
        "200":
          description: Validation summary + row-level preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  row_count:
                    type: integer
                  will_create_count:
                    type: integer
                  skipped_count:
                    type: integer
                  error_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  breakdown:
                    type: object
                    properties:
                      will_create: { type: integer }
                      skipped: { type: integer }
                      error: { type: integer }
        "400":
          description: Missing/invalid file, unknown or forbidden columns, too many rows
        "403":
          description: Bulk CSV import is disabled (see BULK_CSV_IMPORT_ENABLED)

  /admin/bulk-import/{jobId}:
    get:
      tags: [Bulk Import]
      summary: Get a staged/committed bulk import job (status, preview, result)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      id: { type: integer }
                      entity: { type: string, enum: [clients] }
                      status:
                        type: string
                        enum:
                          [validated, processing, committed, expired, failed]
                      file_name: { type: string }
                      row_count: { type: integer }
                      created_count: { type: integer }
                      skipped_count: { type: integer }
                      error_count: { type: integer }
                      expires_at: { type: string, format: date-time }
                      created_at: { type: string, format: date-time }
                      committed_at:
                        type: string
                        format: date-time
                        nullable: true
                  will_create_count:
                    type: integer
                  preview_rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkImportPreviewRow"
                  result:
                    type: object
                    nullable: true
        "404":
          description: Import job not found

  /admin/bulk-import/{jobId}/commit:
    post:
      tags: [Bulk Import]
      summary: Commit a validated bulk import job — creates clients for `will_create` rows
      description: |
        Requires the job to belong to the requesting admin, be unexpired, and
        have `status = validated` (claimed atomically to `processing`). Rows
        already marked `skipped`/`error` during validation are not retried;
        `will_create` rows are re-checked for email conflicts before insert.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send_welcome_emails:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  created_count:
                    type: integer
                  skipped_count:
                    type: integer
                  error_count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        row_number: { type: integer }
                        status:
                          { type: string, enum: [created, skipped, error] }
                        client_id: { type: integer }
                        message: { type: string }
                        external_ref: { type: string, nullable: true }
        "403":
          description: Bulk CSV import is disabled
        "404":
          description: Import job not found
        "409":
          description: Job is not in a committable state (already processing/committed)
        "410":
          description: Job has expired

