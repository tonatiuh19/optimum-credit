  /admin/affiliates:
    get:
      tags: [Affiliates]
      summary: List affiliates with counts (admin/super_admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: plan
          in: query
          schema: { type: string, enum: [standard, master, sub_affiliate] }
        - name: status
          in: query
          schema: { type: string, enum: [invited, active, inactive, suspended] }
      responses:
        "200":
