                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        client_first_name:
                          type: string
                          nullable: true
                        client_last_name:
                          type: string
                          nullable: true
                        client_email:
                          type: string
                          nullable: true
                        client_phone:
                          type: string
                          nullable: true
                        client_pipeline_stage:
                          type: string
                          nullable: true
                        client_status:
                          type: string
                          nullable: true
                  summary:
