  /admin/cases/{caseId}/report-wizard/before-context:
    get:
      tags: [Admin]
      summary: Resolve Before PDF context for a round (prior-round reuse vs enrollment)
      description: >
        For Round 1 returns enrollment guidance. For Round N>1, returns the published
        Round N−1 after PDF metadata when available so the wizard can reuse it as Before.
        A PDF that was incomplete in a published Score update is never offered:
        can_reuse=false with reuse_blocked=incomplete_source (staff upload a complete Before).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
        - in: query
          name: round_number
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Round 1..case.max_rounds (default program 1–5; extended up to 24)
      responses:
        "200":
          description: Before-context for the requested round
          content:
            application/json:
              schema:
                type: object
                properties:
                  context:
                    $ref: "#/components/schemas/ReportWizardBeforeContext"
        "400":
          description: Invalid case id or round_number
        "404":
          description: Case not found

  /admin/cases/{caseId}/report-wizard/sessions:
    get:
      tags: [Admin]
      summary: List draft OFG report wizard sessions for a case
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Non-published wizard sessions (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportWizardDraftSummary"
        "400":
          description: Invalid case id
    post:
      tags: [Admin]
      summary: Create OFG report wizard session (upload after PDF + before upload, staged before, or prior reuse)
      description: |
        Vercel body limit is ~4.5 MB. When uploading both Before and After Ultra PDFs,
        stage Before via `POST .../report-wizard/stage-pdf` first, then pass `staged_before_id`
        with `after_pdf` only. Each file must still be ≤ 4 MB.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [after_pdf]
              properties:
                before_pdf:
                  type: string
                  format: binary
                  description: Required unless staged_before_id or reuse_before_session_id is set (avoid with after_pdf when both are large)
                after_pdf:
                  type: string
                  format: binary
                staged_before_id:
                  type: integer
                  description: Id from POST .../stage-pdf (sequential Before upload)
                reuse_before_session_id:
                  type: integer
                  description: Published prior-round session whose after PDF becomes Before
                round_number:
                  type: integer
                  minimum: 1
                  maximum: 5
                highlight_win:
                  type: string
                tradeline_rec:
                  type: string
                funding_note:
                  type: string
                spanish:
                  type: string
                enhance_with_claude:
                  type: string
                  description: Claude narrative polish during extract (default on; "false" to skip)
                score_update:
                  type: string
                  description: >-
                    "true" = continue an incomplete SmartCredit print as a Score update
                    (scores + verified inquiries only, no account results). Accepted only when
                    the upload check reports incomplete_print; never for same_file.
                starting_point:
                  type: string
                  description: >-
                    "true" = Round 1 only, the client has no earlier report: upload one PDF as
                    after_pdf (no Before source). Scores and items to dispute, nothing compared.
                    Refused codes: starting_point_round_1_only, starting_point_one_file,
                    starting_point_score_update.
      responses:
        "201":
          description: Session created and extraction complete
        "400":
          description: Invalid input
        "404":
          description: Case not found
        "413":
          description: Upload exceeds platform body limit
        "422":
          description: >-
            Round validation or reuse constraints failed; or an instant upload check:
            code same_file (Before and After are the same file) or code incomplete_print
            (a SmartCredit PDF saved before its accounts loaded; side = before | after).
            Both carry score_update_available (true only for incomplete_print — re-send with
            score_update=true). code score_update_not_needed = score_update requested but both
            PDFs are complete. code reuse_incomplete_source = the reused prior PDF was
            incomplete (published as a Score update) — upload a complete Before.

  /admin/cases/{caseId}/report-wizard/stage-pdf:
    post:
      tags: [Admin]
      summary: Stage a Before PDF for sequential report-wizard upload
      description: |
        Uploads a single Before PDF (≤ 4 MB) and returns `staged_id` for
        `POST .../report-wizard/sessions` with `staged_before_id`. Expires in 2 hours.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf]
              properties:
                pdf:
                  type: string
                  format: binary
      responses:
        "201":
          description: Staged
          content:
            application/json:
              schema:
                type: object
                properties:
                  staged_id:
                    type: integer
                  file_name:
                    type: string
                  byte_size:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid input
        "404":
          description: Case not found
        "413":
          description: File too large

  /admin/report-wizard/sessions/{id}:
    get:
      tags: [Admin]
      summary: Get report wizard session (status + extracted/reviewed JSON)
      security:
