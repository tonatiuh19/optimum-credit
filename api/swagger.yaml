        llc_address: { type: string, nullable: true }
        client_id: { type: integer, nullable: true }
        has_secrets: { type: boolean }
        docs_uploaded:
          type: array
          items:
            type: string
            enum:
              [
                funding_drivers_license,
                funding_corp_statement,
                funding_bank_m1,
                funding_bank_m2,
                funding_bank_m3,
                funding_bank_m4,
                funding_bank_m5,
                funding_bank_m6,
              ]
        docs_complete: { type: boolean }
        docs_complete_notified_at:
          { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        converted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReminderFlow:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        trigger_event:
          type: string
          enum:
            [
              payment_confirmed,
              docs_ready,
              round_1_complete,
              round_2_complete,
              round_3_complete,
              round_4_complete,
              round_5_complete,
              round_extended_complete,
              completed,
              payment_due,
              event_registered,
            ]
        is_active: { type: boolean }
        required_label_slugs:
          type: array
          nullable: true
          items: { type: string }
          description: |
            Optional label gate — when set, the flow only fires for clients
            that currently have ALL listed label slugs attached. Null/empty
            means the flow always fires for the trigger_event.
        step_count:
          type: integer
          description: Only present on the list endpoint
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicEventLandingResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              slug: { type: string }
              name: { type: string }
              name_es: { type: string, nullable: true }
              sort_order: { type: integer }
        company: { type: object }
        series: { type: array, items: { type: object } }
        sessions: { type: array, items: { type: object } }
        form_fields: { type: array, items: { type: object } }
        next_session_id: { type: integer, nullable: true }
        selected_session_id: { type: integer, nullable: true }
        mfsn_url: { type: string }

    PublicEventRegisterResponse:
      type: object
      properties:
        ok: { type: boolean }
        client_id: { type: integer }
        registration_id: { type: integer }
        event_kind: { type: string }
        mfsn_url: { type: string }
        email_sent: { type: boolean }
        sms_sent: { type: boolean }

    ReminderFlowStep:
      type: object
      properties:
