openapi: 3.0.3
info:
  title: Optimum Credit API
  description: |
    REST API for the Optimum Credit platform.

    ## Authentication
    - **Protected routes** require `Authorization: Bearer <session_token>`
    - **Public routes** require no authentication

    ## Base URL
    All endpoints are prefixed with `/api`.
  version: "1.0.0"
  contact:
    name: Optimum Credit Dev

servers:
  - url: /api
    description: Same-origin (development & production)

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Authentication (client & admin)
  - name: Legal
    description: Public legal documents (DB-backed markdown)
  - name: Registration
    description: Public registration & Authorize.net payment flow
  - name: Credit Analysis
    description: Public credit-analysis lead capture & prospect conversion
  - name: Funding
    description: Business funding public wizard, admin board, and portal resume
  - name: Event Marketing
    description: CRM Event Marketing — public landings /e and admin company CRUD
  - name: Portal
    description: Client portal — documents, dashboard
  - name: Admin
    description: Admin-only operations
  - name: Affiliates
    description: |
      Affiliates v1 — public referral-link resolve/click, admin affiliate
      management (invite, rates, subscription, commissions), and the
      affiliate self-service portal (own profile, leads, commissions,
      sub-affiliate invites for `master` plan).
  - name: Bulk Import
    description: Admin CSV bulk import (validate → review → commit)
  - name: CRC
    description: Credit Repair Cloud integration — sync & webhooks

paths:
  /legal:
    get:
      tags: [Legal]
      summary: List legal document summaries
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        updated_at: { type: string, format: date-time }
        "503":
          description: Database unavailable

  /legal/{slug}:
    get:
      tags: [Legal]
      summary: Get a legal document by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [terms, privacy]
      responses:
        "200":
          description: Full markdown document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      slug: { type: string }
                      title: { type: string }
                      content_md: { type: string }
                      source_url: { type: string, nullable: true }
                      updated_at: { type: string, format: date-time }
        "404":
          description: Not found
        "503":
          description: Database unavailable

  /admin/legal:
    get:
      tags: [Admin, Legal]
      summary: List legal documents (super admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full documents for editing
        "401":
          description: Unauthorized

  /admin/legal/{slug}:
    put:
      tags: [Admin, Legal]
      summary: Update a legal document (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_md]
              properties:
                title: { type: string }
                content_md: { type: string }
                source_url: { type: string, nullable: true }
      responses:
        "200":
          description: Updated document
        "400":
          description: Validation error
        "404":
          description: Not found

  /admin/notify-recipients:
    get:
      tags: [Admin, Settings]
      summary: List staff + extra notification recipients (super admin)
      description: >
        Active team staff (with Email / In-app / SMS prefs) plus extra email-only
        recipients that need not be admin accounts. Production hides Vitest fixture
        staff (`*@example.test` / `*@affiliate.test`); Vitest keeps them visible
        for integration coverage.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff and extras
        "401":
          description: Unauthorized
        "403":
          description: Super admin required

  /admin/admins/{id}/notification-prefs:
    put:
      tags: [Admin, Settings]
      summary: Update a staff member's notification prefs (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_masters:
                  type: object
                  description: Set all events for a channel on/off
                  properties:
                    email: { type: boolean }
                    in_app: { type: boolean }
                    sms: { type: boolean }
                email: { type: object }
                in_app: { type: object }
                sms: { type: object }
      responses:
        "200":
          description: Updated staff prefs
        "404":
          description: Not found

  /admin/notify-extra-emails:
    get:
      tags: [Admin, Settings]
      summary: List extra team notification emails (super admin)
      description: >
        Email-only recipients for team alerts and inbound SMS. Addresses need not
        be admin accounts (e.g. support@ shared inbox).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of extra emails
        "401":
          description: Unauthorized
        "403":
          description: Super admin required
    post:
      tags: [Admin, Settings]
      summary: Add an extra notification email (super admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                label: { type: string, nullable: true }
      responses:
        "200":
          description: Created or reactivated
        "400":
          description: Invalid email
        "409":
          description: Email belongs to an active staff member (code notify_email_is_staff)

  /admin/notify-extra-emails/{id}:
    patch:
      tags: [Admin, Settings]
      summary: Update extra notification email (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                label: { type: string, nullable: true }
                is_active: { type: boolean }
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
        "409":
          description: Email already exists
    delete:
      tags: [Admin, Settings]
      summary: Remove extra notification email (super admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /ping:
    get:
      tags: [Health]
      summary: Ping
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  /registration:
    post:
      tags: [Registration]
      summary: Register a new client
      description: |
        Creates or updates a pending client record and returns the data needed
        to render the payment step. When Authorize.net is not configured a mock
        `transactionId` is returned (`isMock: true`).

        **Affiliate attribution:** `affiliateCode` also accepts a slug or
        `ref`/`slug` value (not just the legacy `referral_code`). On first
        successful payment, an `enrollment` commission (+ `override` for the
        parent of a `sub_affiliate`) is recorded automatically, guarded by
        `payment_id` to avoid double-paying on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  firstName,
                  lastName,
                  email,
                  addressLine1,
                  city,
                  state,
                  zip,
                  ssnLast4,
                  packageSlug,
                ]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                addressLine1: { type: string }
                addressLine2: { type: string }
                city: { type: string }
                state: { type: string, minLength: 2, maxLength: 2 }
                zip: { type: string, pattern: '^\d{5}$' }
                ssnLast4: { type: string, pattern: '^\d{4}$' }
                packageSlug: { type: string }
                affiliateCode: { type: string }
                coupon_code:
                  type: string
                  description: Optional promotional coupon code to apply a discount to the charge
      responses:
        "200":
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: integer }
                  packageId: { type: integer }
                  packageName: { type: string }
                  amountCents: { type: integer }
                  isMock: { type: boolean }
                  mockTransactionId:
                    type: string
                    description: Only present when isMock is true
        "400":
          description: Validation error
        "409":
          description: Email already has an active account

  /public/credit-analysis:
    post:
      tags: [Credit Analysis]
      summary: Generate a free credit-analysis (public, no auth)
      description: |
        Multipart upload of a credit report (PDF or image). Queues the new
        engine's account-by-account read (direct ~1 min, batch fallback) —
        the single Credit Analysis engine for screen, PDF, email and AI. Creates or reuses a
        `clients` row:
        - New email → inserted as `status=prospect`, `pipeline_stage=prospect`.
        - Existing prospect → stays a prospect, analysis attached.
        - Existing non-prospect client → analysis attached, status untouched.
        Attaches a source label (`web_analysis` or `agent_submission` per
        `mode`); item labels (e.g. `collections`, `auto`) attach from the
        new-engine read when it is ready.
        Optionally emails the new-engine PDF when `email_opt_in=true` (once the
        read is ready; never while in escrow). New engine only: PDF or image
        (JPG, PNG, WebP) required — other types return 400; 503 when the
        reader is unavailable. The response returns `enhanced_pending=true`
        and a `public_token`; there is no text-only analysis.

        **Affiliate attribution (first-touch, 30 days):** accepts
        `affiliate_code` / `affiliateCode` / `ref` / `slug` (any one) as a
        form field. If it resolves, `clients.affiliate_id` is set
        (COALESCE — never overwrites existing attribution) and the
        `affiliate_referral` source label is attached.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [
                  first_name,
                  last_name,
                  email,
                  phone,
                  text_language,
                  report_file,
                ]
              properties:
                mode: { type: string, enum: [client, agent], default: client }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                client_goal: { type: string }
                text_language: { type: string, enum: [en, es] }
                notes: { type: string }
                agent_phone:
                  type: string
                  description: Only used when mode=agent
                rep_name:
                  type: string
                  description: Only used when mode=agent
                email_opt_in: { type: boolean }
                lead_source:
                  type: string
                  description: When "get_started", also attaches the get_started_wizard label
                affiliate_code:
                  type: string
                  description: Affiliate slug or referral code (also accepts affiliateCode/ref/slug)
                report_file:
                  type: string
                  format: binary
                  description: Credit report file (PDF is parsed; other types are stored only)
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAnalysisResult"
        "400":
          description: Missing/invalid fields or file

  /admin/credit-files:
    post:
      tags: [Admin, Credit Analysis]
      summary: Upload a credit report for account-level extraction (any provider)
      description: >-
        Accepts a PDF or an image (JPG, PNG, WebP, GIF) from any provider
        (SmartCredit, IdentityIQ, MyFreeScoreNow, bureau reports, scans/photos).
        Stores it encrypted and queues a Claude extraction (ANTHROPIC_MODEL),
        read right away in its own invocation (large per-bureau reports are split
        into page ranges read in parallel and verified against the report's own
        totals); the queue cron's Message Batches path is the fallback. An identical
        file already read by the current reader (same purpose group) is reused
        instantly (status ready, reused true). Recognized text PDFs also get a text
        cross-check. Returns 202; poll GET /admin/credit-files/{id}. Staff only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                purpose:
                  type: string
                  enum: [analysis, progress_before, progress_after, other]
                client_id: { type: integer }
                case_id: { type: integer }
      responses:
        "202": { description: "Accepted (id, status queued | ready, reused, provider, image_pages, total_pages). ready + reused = an identical file's read was reused." }
        "400": { description: Missing file / unsupported type }
        "404": { description: Client not found }
        "413": { description: File over the platform upload limit }
  /admin/credit-files/{id}:
    get:
      tags: [Admin, Credit Analysis]
      summary: Credit file extraction status + result
      description: >-
        status queued → submitted → ready | failed. When ready, credit_file
        holds scores, every account per bureau (lean fields), inquiries;
        issues lists cross-check findings for staff review.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Job (see CreditFileExtractionResponse in shared/api.ts) }
        "404": { description: Not found }
  /admin/credit-files/{id}/analysis:
    get:
      tags: [Admin, Credit Analysis]
      summary: Credit analysis data built from a ready extraction
      description: >-
        Deterministic rules over the extracted credit file: per-bureau
        overview, missing-bureau flags, negatives with round (R2 collections,
        R3 cross-bureau inconsistencies, R4 charge-offs/lates), legal basis,
        HOLD for consumer-dispute remarks, inquiries (dispute / ages off /
        permissible), utilization incl. vs excl. AU cards, projections
        (estimates), 5-factor file strength, Standard/Complex program.
        409 while the extraction is not ready.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ analysis, client_name, lang }" }
        "404": { description: Not found }
        "409": { description: Extraction not ready or failed }
  /admin/credit-files/{id}/analysis.pdf:
    get:
      tags: [Admin, Credit Analysis]
      summary: Branded Credit Analysis PDF (same brand as the Progress Report)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: lang
          schema: { type: string, enum: [en, es] }
          description: Defaults to the client's preferred language
      responses:
        "200":
          description: PDF
          content:
            application/pdf: {}
        "409": { description: Extraction not ready or failed }
  /admin/credit-analyses/{id}/enhanced-status:
    get:
      tags: [Admin, Credit Analysis]
      summary: Background enhanced-read status behind an existing analysis
      description: >-
        Staff uploads via POST /admin/clients/{id}/credit-analysis also queue
        an account-level read (same file, background). The analysis panel
        polls this so its existing Download PDF can serve the enhanced report.
        null = no enhanced read (Download PDF keeps today's report).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: >-
            { status: queued | submitted | ready | failed | null, context:
            { escrow: boolean | null, lender_score_model, lender_score,
            lender_target_score }, review: null | { status: pending |
            running | passed | needs_review | approved, findings: {
            selfCheck: { ok, items[] }, audit: [{ check, severity:
            blocking|note, detail }], reconciledAdded, error }, reviewedAt } }.
            review is set once the read is ready (Spec v2.1 §11 review gate).
  /admin/credit-analyses/{id}/review:
    post:
      tags: [Admin, Credit Analysis]
      summary: Approve a flagged Credit Analysis (release to the client) or re-run the checks
      description: >-
        Review gate. After a read, the self-check (report's own Account
        Summary totals) + Claude "find missing accounts" + a double Claude
        audit run; passed → released (scores, labels, client email, public
        result). Otherwise needs_review until an admin approves. Admin /
        super_admin only. rerun resets the checks to pending.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, rerun] }
      responses:
        "200": { description: "{ review_status: approved | pending }" }
        "400": { description: Invalid action }
        "403": { description: Not an admin / super_admin }
        "409": { description: The report has not been read yet }
  /internal/credit-file-review/{id}:
    post:
      tags: [Internal]
      summary: Run the review gate for one read in a fresh 300 s invocation
      description: Kicked right after a Credit Analysis read is ready; the 5-min cron is the fallback. x-cron-secret required.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: header
          name: x-cron-secret
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ status: passed | needs_review | pending | skipped, reconciledAdded, findings }" }
        "401": { description: Missing / wrong secret }
  /internal/credit-file-read/{id}:
    post:
      tags: [Internal]
      summary: Read one queued credit report in its own invocation (up to 800 s)
      description: >-
        Kicked right after an upload (never inside the upload request). Large per-bureau
        reports are split into 2-4 page ranges read in parallel; a failed read goes to a
        Message Batch immediately. Idempotent: only a queued job is claimed. The 5-min cron
        kicks any job left queued. x-cron-secret required.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: header
          name: x-cron-secret
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ ok: true } read ready; { ok: false } not claimed or handed to a batch" }
        "401": { description: Missing / wrong secret }
        "500": { description: Read failed (the job is retried by the cron) }
  /public/credit-analyses/{token}/status:
    get:
      tags: [Public, Credit Analysis]
      summary: New-engine read status for a public / portal analysis (by token)
      description: >-
        token = public_token returned by POST /public/credit-analysis,
        /portal/credit-analysis (and staff uploads). 32 hex chars; never the
        numeric id. queued | submitted = still reading or being
        double-checked (direct read up to ~4 min, then the automatic review);
        review = held for staff review (show "we're reviewing it").
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{32}$" }
      responses:
        "200": { description: "{ status: queued | submitted | ready | failed | review | null }" }
        "404": { description: Unknown token }
  /public/credit-analyses/{token}/analysis:
    get:
      tags: [Public, Credit Analysis]
      summary: New-engine (account-by-account) analysis by token
      description: Same data as the PDF; agent-only lender score omitted. 404 until the read is ready AND released by the review gate (passed / approved).
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ analysis }" }
        "404": { description: Not ready / unknown token }
  /public/credit-analyses/{token}/pdf:
    get:
      tags: [Public, Credit Analysis]
      summary: New-engine Credit Analysis PDF by token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string, enum: [en, es] }
      responses:
        "200": { description: PDF, content: { application/pdf: {} } }
        "404": { description: Not ready / unknown token }
  /admin/funding/{id}/documents/{docId}/file:
    get:
      tags: [Admin, Funding]
      summary: View / download a funding document (decrypted, logged)
      description: >-
        Roles super_admin, admin, underwriter. ?download=1 for attachment. Logged in funding_access_logs (view_doc).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: docId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/funding/{id}/documents:
    post:
      tags: [Admin, Funding]
      summary: Upload a funding document on the client's behalf
      description: >-
        multipart: doc_type (funding slot) + file. Encrypted, stored as .enc. Logged (upload_doc). 409 if the client has not started the application uploads yet.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/funding/{id}/documents/{docId}/request:
    post:
      tags: [Admin, Funding]
      summary: Request a new document (reject + notify client)
      description: >-
        Body { reason }. Marks the document rejected, moves the application to awaiting_docs and emails/texts the client their upload link. Logged (request_doc).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: docId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/funding/{id}/sensitive:
    get:
      tags: [Admin, Funding]
      summary: Masked SSN / EIN
      description: >-
        { ssn_masked: ***-**-1234, ein_masked: **-***1234 }
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/funding/{id}/sensitive/reveal:
    post:
      tags: [Admin, Funding]
      summary: Reveal full SSN or EIN (logged)
      description: >-
        Body { field: ssn | ein }. Logged (reveal_ssn / reveal_ein).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/funding/{id}/notes:
    post:
      tags: [Admin, Funding]
      summary: Append an underwriting note
      description: >-
        Body { text }. Appended with author + time ((underwriter) tag). Staff/underwriter detail only — never in public/portal payloads.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Not super_admin / admin / underwriter }
  /admin/credit-analyses/{id}/enhanced-analysis:
    get:
      tags: [Admin, Credit Analysis]
      summary: New-engine analysis (JSON) for the on-screen panel
      description: >-
        Same data as the enhanced PDF (per-bureau scores + printed ratings,
        negatives by round, inquiry clusters, escrow, lender score,
        projections, file strength, program tier). 404 until the
        account-level read is ready.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ analysis }" }
        "404": { description: Enhanced read not ready }
  /admin/credit-analyses/{id}/context:
    patch:
      tags: [Admin, Credit Analysis]
      summary: Escrow flag + lender score used by the enhanced analysis PDF
      description: >-
        escrow null = auto-detect (mortgage pull in the last 45 days), true =
        in escrow (hold banner, loan inquiries excluded, tradelines after
        closing), false = not in escrow. Lender score / target (300-900) are
        shown next to the VantageScore figures. Affiliates are denied.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                escrow: { type: boolean, nullable: true }
                lender_score_model: { type: string, nullable: true, maxLength: 40 }
                lender_score: { type: integer, nullable: true, minimum: 300, maximum: 900 }
                lender_target_score: { type: integer, nullable: true, minimum: 300, maximum: 900 }
      responses:
        "200": { description: "{ context }" }
        "400": { description: Invalid value / nothing to update }
        "404": { description: Not found }
  /admin/report-wizard/sessions/{id}/notify-default:
    get:
      tags: [Admin, Report Wizard]
      summary: Suggested "Notify client" for publishing this round (GF-84)
      description: >-
        A round is "old" (publish silently — no client/partner email or SMS)
        when a newer round is already published, a newer round is being
        prepared for the case, or the After report is 45+ days old. Publish
        (finalize) accepts notify_client true/false to override.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: "{ notify_client: boolean, reasons: string[] }" }
  /admin/credit-analyses/{id}/enhanced-pdf:
    get:
      tags: [Admin, Credit Analysis]
      summary: Enhanced Credit Analysis PDF for an existing analysis
      description: >-
        200 PDF (attachment) when the enhanced read is ready; otherwise 404
        with fallback=true so the client keeps today's printable report.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: lang
          schema: { type: string, enum: [en, es] }
      responses:
        "200":
          description: PDF
          content:
            application/pdf: {}
        "404": { description: "Not ready / not found — { fallback: true }" }
  /admin/clients/{id}/lead-signals:
    post:
      tags: [Admin, Clients]
      summary: Prospect traffic light — manual Hot signals
      description: >-
        Mark the credit analysis as reviewed with Cesar and/or set the next
        scheduled call; the traffic light (hot / warm / cold) is recomputed
        immediately. The platform also recomputes every prospect each cron tick
        from replies (14 days), credit report/analysis, payments, monitoring
        login and documents; a 5+ minute call after the analysis counts as
        reviewed. Alerts: upgrades → language owner (EN Lecca, ES Ángel); Hot
        with no movement for 3 days → LEAD_HOT_STALE_ALERT_ADMIN_IDS (default
        Cesar); first successful payment → ready-to-convert suggestion (staff
        confirm; never automatic).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis_reviewed: { type: boolean }
                call_scheduled_at: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: "LeadSignalsResponse (shared/api.ts)" }
        "400": { description: Nothing to update / invalid date }
        "404": { description: Client not found }
  /admin/clients/{id}/notes:
    post:
      tags: [Admin, Clients]
      summary: Append a staff note to a client file
      description: >-
        Appends one line `[YYYY-MM-DD HH:mm UTC — Admin Name] note` to
        clients.admin_notes (never overwrites). Staff only (affiliates 403).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 1500 }
      responses:
        "200":
          description: Note appended
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  admin_notes: { type: string, nullable: true }
        "400": { description: Missing or too-long note }
        "404": { description: Client not found }
  /admin/clients/{id}/pause:
    post:
      tags: [Admin, Clients]
      summary: Pause, block or resume a client
      description: >-
        paused=true puts the client on hold (reason required): hold_status
        `paused` (default) or `blocked`. Both stop every automated client
        message (reminder flows, queued reminders, payment nudges, reminder
        SMS); `blocked` also locks portal login (client endpoints return 403
        `{ code: account_blocked }`). Reason + previous status are logged in
        admin_notes. paused=false resumes from paused or blocked to prospect
        (no enrolled case), onboarding (case still new_client) or active.
        Staff only (affiliates 403).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
                hold_status:
                  type: string
                  enum: [paused, blocked]
                  default: paused
                  description: Which hold to apply when paused=true
                reason:
                  type: string
                  maxLength: 1000
                  description: Required when paused=true
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                  admin_notes: { type: string, nullable: true }
        "400": { description: Invalid body / missing reason }
        "404": { description: Client not found }
        "422": { description: Already in that hold / cancelled, or not on hold when resuming }
  /admin/clients/{id}/credit-insights:
    get:
      tags: [Admin]
      summary: Lead credit insights (latest read + history)
      description: |
        One snapshot per credit report read (analysis or progress): middle score vs
        target, points needed, projected middle after Round 4 and the round that
        reaches the target, readiness (ready / close / long), negatives by type,
        derogatory balance, utilization (+ lender figure, no open card in good
        standing), inquiries (120 days / 12 months / same-day max), new account in
        90 days, lender-report source (vendor, report ID, Requested By), active
        mortgage file, File Strength, program + estimated value, heat score 0-100
        with reasons, quick wins, next action, score factors, thin file, student /
        medical amounts, address history and lender simulation. A new read is
        compared with the previous one and the assigned staffer gets a bell for
        stage changes (score crossed a cutoff, target reached, items removed,
        new collection / charge-off, utilization under 30%).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "{ latest: LeadCreditInsightsRow | null, history: LeadCreditInsightsRow[] } (newest first, max 24)"
        "404":
          description: Client not found / out of scope
  /admin/referral-partners/leaderboard:
    get:
      tags: [Admin]
      summary: Referral partner leaderboard
      description: |
        Per partner (leads created in the window): leads, hot, converted (succeeded
        payment), conversion %, average middle score, open pipeline value (estimated
        program value of unconverted leads), last lead. Also lists lender-report
        "Requested By" names on leads with no partner linked yet.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        "200":
          description: "{ days, partners: ReferralPartnerLeaderboardRow[], unlinked_requesters: [{ name, leads, last_at }] }"
  /admin/credit-insights/backfill:
    post:
      tags: [Admin]
      summary: Build lead credit insights for existing reads (super admin)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: "{ scanned, built, failed }"
        "403":
          description: Not a super admin
  /admin/clients/{id}/credit-analysis:
    get:
      tags: [Admin, Credit Analysis]
      summary: Latest credit analysis for a client (staff)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest analysis or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/CreditAnalysisResult"
    post:
      tags: [Admin, Credit Analysis]
      summary: Run free credit analysis for a prospect (staff, multipart)
      description: >-
        Agent-mode analysis for an existing prospect (`status=prospect` or
        `pipeline_stage=prospect`). Returns 403 prospect_only for enrolled clients.
        Does not require an enrolled case. Optional email_opt_in emails the client.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
