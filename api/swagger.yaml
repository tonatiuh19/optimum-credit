        OAuth client credentials are set. `auth_mode` is `service_key` | `oauth` | null.
        With a Service Key, permitted admins are treated as `connected`
        (no per-admin OAuth).
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  can_extract: { type: boolean }
                  hub_domain: { type: string, nullable: true }
                  connected_at: { type: string, nullable: true }
                  oauth_configured: { type: boolean }
