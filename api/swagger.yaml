  /webhooks/authorize-net:
    post:
      tags: [Registration]
      summary: Authorize.net webhook (ARB subscription + renewal payments)
      description: |
        Signature verification via `ANET_WEBHOOK_SIGNATURE_KEY`. In production the
        key is mandatory — the endpoint returns `503` if it isn't configured. When
        the key is configured, every request must present a valid `X-ANET-Signature`
        header (missing/invalid is always rejected, not just when the header happens
        to be present). Raw body must be preserved for HMAC validation.

        Handles subscription cancel/suspend/fail plus successful payment events
        (`authcapture` / capture) — inserts a `payments` row for client ARB renewals
        and restores `client_subscriptions` / affiliate `subscription_status` to active.
        First successful enrollment payment also emails every active team admin
        (`super_admin` / `admin` / `agent`) a "New purchase" alert with a pipeline deep link.
      responses:
        "200":
          description: Processed
        "401":
          description: Missing or invalid signature
        "503":
          description: Webhook not configured (production only)

  /webhooks/twilio/sms:
    post:
      tags: [CRC]
      summary: Twilio inbound SMS webhook
      description: |
        Validates `X-Twilio-Signature` when `TWILIO_AUTH_TOKEN` is set.
        Production refuses unsigned requests if the token is missing.
        Signature check tries multiple public URL candidates (`PUBLIC_APP_URL`,
        `X-Forwarded-*`, www/apex ofgllc.com) so proxy host mismatches do not
        cause Twilio error 11200.
        Resolves the To address against `admin_phone_numbers`, matches From to a
        client (else CRM contact / unknown queue), opens/reopens the channel thread, stores the
        message idempotently by MessageSid, and publishes Ably when configured.
        When `INBOUND_AI_SMS_ENABLED=1` (independent of `ADMIN_AI_ENABLED`), and the
        OFG line has an assigned admin (optional `INBOUND_AI_ADMIN_IDS` allowlist,
        e.g. `90001` for César-only; unset = all assigned), the webhook acks Twilio
        immediately then runs inbound AI via `waitUntil`: STOP/HELP/START short-circuit
        without Claude; FAQ reply/resolve/escalate uses `ANTHROPIC_SMS_API_KEY` when set,
        otherwise `ANTHROPIC_API_KEY`.
        Read-only: the AI only returns text (no tools) — it never changes client
        data, payments, rounds or documents. It sees the client's round status
        (current round, next round date, latest report) plus the portal reports
        link and a fresh 72h secure PDF link to the latest report. Every reply
        passes a code-level guard before sending: only those links, no $ amounts,
        scores or dates absent from the CRM/FAQ context, no deletion/guarantee
        promises — otherwise the client gets the hold message and staff get the
        draft. First AI reply in a thread is prefixed with the automated-assistant
        disclosure; AI-handled threads stay open; billing answers are flagged for
        staff review.
        Claude auth, HTTP, timeout, and invalid JSON still send the escalation hold SMS
        once per failure streak (staff note names the failure). That hold does not
        count toward the 3-turn limit. A failed send is retried on the next inbound.
        Allowlist does not change Twilio SMS routing for other staff lines. Default OFF.
        Enable Twilio Messaging Service Advanced Opt-Out on OFG numbers in console.
      responses:
        "200":
          description: TwiML / accepted
        "403":
          description: Invalid signature
        "503":
          description: Twilio not configured (production)

  /webhooks/twilio/call-transcript:
    post:
      tags: [CRC]
      summary: Twilio batch call transcript callback
      description: |
        Twilio Voice batch transcription posts the finished transcript here
        (`sentences[].text`). `X-Twilio-Signature` is validated against the raw
        JSON body with `TWILIO_AUTH_TOKEN`. The recording SID is matched to
        `conversation_messages.recording_url`. A completed payload stores
        `call_transcript` and sets status `ready`. Call insights stay empty.
      responses:
        "200":
          description: Accepted
        "403":
          description: Invalid signature
        "503":
          description: Twilio not configured (production)

  /webhooks/twilio/sms-status:
    post:
      tags: [CRC]
      summary: Twilio SMS/MMS status callback
      description: |
        Same signature rules as `/webhooks/twilio/sms`. Updates
        `conversation_messages.provider_status` (and `error_message` on
        failed/undelivered) by MessageSid. Ignores regressive statuses
        (e.g. delivered → queued). Unknown MessageSid returns 200 (race
        before INSERT). Set as `statusCallback` on outbound Twilio sends
        (public base from `OPTIMUM_API_BASE_URL` / `PUBLIC_APP_URL`).
      responses:
        "200":
          description: Accepted
        "403":
          description: Invalid signature
        "503":
          description: Twilio not configured (production)

  /webhooks/twilio/voice:
    post:
      tags: [Conversations]
      summary: Twilio inbound voice webhook (alias of /voice/incoming)
      description: |
        Signature-validated Twilio Voice webhook. Default: rings only the admin
        assigned to the dialled OFG number (`admin_{id}` client identity) plus
