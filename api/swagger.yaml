                          type: string
                          nullable: true
                        package_slug:
                          type: string
                          nullable: true
                        amount_cents:
                          type: integer
                        discount_cents:
                          type: integer
                        original_amount_cents:
                          type: integer
                          nullable: true
                        currency:
                          type: string
                        status:
                          type: string
                          enum:
                            [pending, succeeded, failed, refunded, cancelled]
                        provider:
                          type: string
                        coupon_code:
                          type: string
                          nullable: true
                        provider_transaction_id:
                          type: string
                          nullable: true
                        provider_charge_id:
                          type: string
                          nullable: true
                        failure_reason:
                          type: string
                          nullable: true
                        paid_at:
                          type: string
