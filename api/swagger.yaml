  /admin/prospects/{id}/convert:
    post:
      tags: [Admin]
      summary: Convert a prospect into a client + case (5A/7A)
      description: |
        Sets `status=onboarding`, `pipeline_stage=new_client`. Allowed for any
        unconverted lead (no enrolled active non-prospect case), even if
        `clients.status` was set to `active` / `pending_payment` by mistake.
        Cancelled clients and already-enrolled cases return 409. If the
        prospect already has an active case at `pipeline_stage=prospect` (from
        New Case), that case is promoted to `new_client`; otherwise a new
        `credit_repair_cases` row is created. Runs `autoAssignTasksForCase`,
        sends the dedicated prospect-welcome email (portal onboarding link),
        fires idempotent signup activation SMS/email to the client + linked
        partners (`clients.activation_notified_at`; SMS From =
        `signup_notify_sms_from_phone_number_id`; client SMS uses the same
        `/portal/onboarding/:token` magic link as the welcome email when
        convert mints a shared token), optionally persists/sends
        round calendar `.ics`, and schedules the `payment_confirmed` reminder
        flow with Day-0 steps skipped (Day 2/3 upload nudges + team alert
        still run — avoids duplicate/wrong "payment confirmed" Day-1 copy).
        First paid enrollment also calls the same activation fan-out when
        convert did not already claim the stamp (SMS mints its own magic link
        if none was shared).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: { type: integer, nullable: true }
                notes: { type: string, nullable: true }
                round_schedule:
                  $ref: "#/components/schemas/RoundScheduleInput"
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: "#/components/schemas/AdminClientListItem"
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      case_number: { type: string }
                  round_calendar:
                    type: object
                    nullable: true
        "404":
          description: Prospect not found
        "409":
          description: Cancelled, or already has an enrolled case

  /admin/reminder-flows:
    get:
      tags: [Admin]
      summary: List all reminder flows with step counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reminder flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  flows:
                    type: array
