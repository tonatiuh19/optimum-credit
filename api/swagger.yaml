          name: admin
          schema: { type: integer }
        - in: query
          name: caller
          schema: { type: string }
      responses:
        "200":
          description: TwiML Gather

  /voice/forward-leg-status:
    post:
      tags: [Conversations]
      summary: Status callback for the call-forwarding (cell) leg
      description: >-
        Twilio webhook (signature-guarded). On CallStatus=failed, looks up the
        Twilio error (e.g. 13227 no international permission) and alerts the
        staff member + super admins via the missed_call channel, at most once
        per 24h per staff member.
      parameters:
        - in: query
          name: admin
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Accepted

  /voice/call-screen-accept:
    post:
      tags: [Conversations]
      summary: Bridge after call-screen keypress
      responses:
        "200":
          description: Empty TwiML

  /voice/fix-call-setup:
    post:
      tags: [Conversations]
      summary: Re-verify TwiML App + sync OFG number voice/SMS webhooks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ success, twimlAppSid, voiceUrl, incomingUrl, numbers[] }"
        "503":
          description: Twilio not configured

  /voice/incoming:
    post:
      tags: [Conversations]
      summary: Inbound voice TwiML (same as /webhooks/twilio/voice)
      description: |
        Rings the OFG line assignee (softphone and/or forwarded cell).
        When `INBOUND_AI_VOICE_ENABLED=1` + `ANTHROPIC_API_KEY` (default OFF),
        and the OFG line assignee passes optional `INBOUND_AI_ADMIN_IDS`, answers
        with AI Gather first (`/api/voice/ai-turn`); otherwise dials the assignee
        as before. Press 0 or escalate dials the assignee. Pass `?human=1` to skip
        AI and dial immediately. Allowlist does not change non-AI voice routing.
      responses:
        "200":
          description: TwiML

  /voice/ai-turn:
    post:
      tags: [Conversations]
      summary: Inbound AI voice turn (Gather callback)
      description: |
        Gated by `INBOUND_AI_VOICE_ENABLED` + optional `INBOUND_AI_ADMIN_IDS`
        (line assignee must be allowlisted when set). Speech/DTMF → Claude decide
        reply / resolve / escalate-to-dial. Requires Twilio signature validation.
      responses:
        "200":
          description: TwiML
        "403":
          description: Invalid signature

  /admin/conversations/lookup-contact:
    get:
      tags: [Conversations]
      summary: Resolve client by phone for dialpad / inbound UI
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: phone
          required: true
          schema: { type: string }
      responses:
        "200":
          description: found + client_id / client_name

  /cron/process-queue:
    get:
      tags: [Admin]
      summary: Process pending notification_queue rows (Vercel Cron)
      description: |
        Same as POST. Vercel Cron invokes GET with `Authorization: Bearer CRON_SECRET`
        every 5 minutes (`vercel.json`). Cancels stale pending (>14d), reclaims stuck
        claim tags (>15m), claim-tag sends via Resend, emails overdue My Tasks
        (stamps `due_notified_at` after delivery or when all channels are muted),
        deletes expired `mms_media`,
        and processes pending **call insights** (Whisper STT → optional Claude resume).
        Always on unless `CALL_INSIGHTS_ENABLED=0`. Recording webhooks also process
        immediately; this cron is the backup. After reminder emails send, optional client
        reminder SMS (`payload_json.also_sms`) from Lecca when Settings
        `client_reminder_sms_enabled` is on — logged to Conversations.
        **Upload-nudge guard:** only rows with explicit
        `payload_json.trigger_event=payment_confirmed` are cancelled
        (no SMS twin) when all required Get Started tasks are already submitted
        (pending admin review) or the case has left New Client / Prospect.
        Bare queue emails (no `trigger_event`) are never soft-skipped.
      parameters:
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: Bearer CRON_SECRET (Vercel Cron)
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processed: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  suppressed: { type: integer }
                  stale_cancelled: { type: integer }
                  stuck_reclaimed: { type: integer }
                  work_due_notified: { type: integer }
                  mms_expired_deleted: { type: integer }
                  call_insights:
                    type: object
                    properties:
                      processed: { type: integer }
                      ready: { type: integer }
                      failed: { type: integer }
                      skipped: { type: integer }
                      reclaimed: { type: integer }
        "401":
          description: Unauthorized
        "500":
          description: Processing failure
        "503":
          description: CRON_SECRET not configured
    post:
      tags: [Admin]
      summary: Process pending notification_queue rows
      description: |
        Protected by `X-Cron-Secret` or `Authorization: Bearer CRON_SECRET`
        (must match `CRON_SECRET`). Cancels pending rows scheduled more than
        14 days ago, reclaims stuck `processing` claims older than 15 minutes,
        then claims a batch with a unique tag (overlap-safe) and sends emails
        via Resend. SMS / in_app / push channels are marked `failed` until
        those deliverers are wired (never fake-marked `sent`). Also sends
        overdue My Tasks emails (up to 8×200 rows per run; stamps
        `due_notified_at` after a successful send or when every channel is
        muted, so undeliverable rows cannot starve the batch).
        Also deletes
        expired `mms_media` rows (up to 200 per run).
      parameters:
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processed: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
                  suppressed: { type: integer }
                  stale_cancelled: { type: integer }
                  stuck_reclaimed: { type: integer }
                  work_due_notified: { type: integer }
                  mms_expired_deleted: { type: integer }
        "401":
          description: Unauthorized
        "500":
          description: Processing failure

  /cron/admin-morning-digest:
    get:
      tags: [Admin]
      summary: Weekday morning Claude digest email for each active admin
      description: |
        Vercel Cron hits this Mon–Fri at 13:00 and 14:00 UTC. The handler only sends when
        America/Denver local hour is 7 (business morning) unless `force=1`.
        Builds a per-admin snapshot (assigned clients/prospects, open/overdue My Tasks,
        open conversations), asks Claude for an energizing brief + quote (falls back to
        deterministic copy), and delivers via email/in-app prefs (`morning_digest`).
        Idempotent per admin per Denver calendar day via `audit_logs`.
        Claude enhance uses `ANTHROPIC_API_KEY`; on auth/API failure the digest still
        emails with deterministic fallback (`claude_fallback` in the response).
      parameters:
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: Bearer CRON_SECRET
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
        - in: query
          name: force
          schema: { type: string, enum: ["0", "1", "true"] }
          description: >-
            Bypass Denver weekday 7am window only. Still enforces one email per
            admin per Denver day unless force_resend=1.
        - in: query
          name: force_resend
          schema: { type: string, enum: ["0", "1", "true"] }
          description: Allow a duplicate send the same Denver day (manual/test only)
        - in: query
          name: admin_email
          schema: { type: string }
          description: Limit run to one admin email
      responses:
        "200":
          description: Digests processed or skipped (outside window)
        "401":
          description: Unauthorized
        "503":
          description: CRON_SECRET not configured
    post:
      tags: [Admin]
      summary: Weekday morning Claude digest (manual / cPanel)
      parameters:
        - in: header
          name: X-Cron-Secret
          required: false
          schema: { type: string }
        - in: query
          name: force
          schema: { type: string, enum: ["0", "1", "true"] }
      responses:
        "200":
          description: Digests processed
        "401":
          description: Unauthorized

  /admin/clients/{id}/round-report-deliveries:
    get:
      tags: [Admin]
      summary: Progress-report delivery timeline per round (case panel)
      description: |
        Per round: `events` newest first — `generated` (PDF uploaded, by),
        `send` (email/SMS to client or partner with name + role, to, status —
        SMS is the live carrier status — error, by, `resend` when the same
        address was already sent in that round), `opened` (download-link opens,
        `open_count`, link issued `first_at`) — and a `summary` (sends, failed,
        delivered SMS, unique recipients, opens, last sent / opened).
        Source: outbound_message_log (kind round_report), conversation_messages,
        round_report_pdfs, round_report_download_tokens. Not for affiliates.
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ client_id, rounds: { [round]: { events, summary } } }" }
        "401": { description: Unauthorized }
        "403": { description: Affiliate access denied }
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard stats + command center
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: mine
          schema: { type: string, enum: ["1"] }
          description: Scope to clients / conversations assigned to the current admin (tasks are always the assignee's).
      responses:
        "200":
          description: |
            Dashboard aggregates (clients, revenue, tickets, payments) plus
            `upcoming_rounds` (R1–5 schedules plus Special `kind: extended`
            `next_dispute_target_date` targets) and `my_work_tasks` (open tasks
            assigned to the current admin, max 8).
            Command center: `scope` (everyone | mine), `is_super`, `inbox`
            (non-zero "Needs you" rows: key, count, tone alert|warn|info, to),
            `pulse.weeks` (8 Monday-start weeks: new_clients, enrolled =
            contract signed, completed, revenue_cents), `activity` (latest 15:
            client, contract, document, report, analysis, payment).
            Money (`stats.revenue_cents_30d`, `recent_payments`, payments in
            activity, weekly revenue) is returned to super admins only.
        "401":
          description: Unauthorized

  /admin/work-tasks:
    get:
      tags: [Admin]
      summary: List admin Work Hub tasks (Kanban)
      description: |
        Server-side search (`q`) and per-column pagination.
        Without `status`: returns first page of backlog/doing/done in `columns`
        (also a flat `tasks` array for compatibility).
        With `status` + `offset`: returns one column page for load-more.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search title, description, case, client, assignee, labels
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 50 }
        - in: query
          name: status
          schema: { type: string, enum: [backlog, doing, done] }
          description: When set, returns a single-column page
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Board columns or a single column page
    post:
      tags: [Admin]
      summary: Create an Optimum work task
      description: Optional `case_id` links the task to a credit repair case.
      security: [{ BearerAuth: [] }]
      responses:
        "201":
          description: Created

  /admin/work-tasks/case-search:
