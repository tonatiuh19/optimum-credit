            schema:
              type: object
              required: [package_id, paid_amount_cents, payment_method]
              properties:
                package_id:
                  type: integer
                paid_amount_cents:
                  type: integer
                paid_label:
                  type: string
                payment_method:
                  type: string
                  enum: [cash, zelle, venmo, card_offline, other]
                payment_note:
                  type: string
                  nullable: true
                remaining_splits:
                  type: array
                  items:
                    type: object
                    required: [label, amount_cents, due_date]
                    properties:
                      label:
                        type: string
                      amount_cents:
                        type: integer
                      due_date:
                        type: string
                        format: date
                      send_payment_link:
                        type: boolean
                preferred_language:
                  type: string
                  enum: [en, es]
                  nullable: true
                referral_category:
                  type: string
                  nullable: true
                referrer_id:
                  type: integer
                  nullable: true
                staff_notes:
                  type: string
                  nullable: true
                expires_in_hours:
                  type: integer
                  default: 168
      responses:
        "201":
          description: Invite created (includes url + token once)
        "400":
          description: Validation error

