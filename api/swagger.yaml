  /admin/payments/{id}/refund:
    post:
      tags: [Admin]
      summary: Refund a payment (ledger clawback)
      description: |
        Marks a `succeeded` payment as `refunded` and voids any `pending`/`approved`
        affiliate commissions tied to it. This is a soft, internal ledger clawback —
        it does not call the Authorize.net refund/void API. Idempotent: calling again
        on an already-refunded payment returns `{ ok: true }` without side effects.
        Not available to affiliate-manager accounts.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refunded (or already refunded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Only succeeded payments can be refunded
        "401":
          description: Unauthorized
        "404":
          description: Payment not found

