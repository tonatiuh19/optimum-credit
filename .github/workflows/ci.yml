name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Unit-only — no live TiDB. Integration/*Integration.test.ts stay local/pre-deploy.
      - name: Unit tests
        run: >
          npx vitest run
          api/affiliateHelpers.test.ts
          api/hubspotHelpers.test.ts
          api/creditAnalysisAlgorithm.test.ts
          api/corsOrigins.test.ts
          api/legalMarkdownSanitize.test.ts
          api/reportWizardValidation.test.ts
          api/friendlyErrorsEdgeCases.test.ts
          api/freeCheckoutEdgeCases.test.ts
          api/reportWizardEdgeCases.test.ts
          api/reportWizardScenarios.test.ts
